function pickWeakest(weekly, plan) {
  const pet = plan.petId ? PET_BY_ID[plan.petId] : null;
  const goalTags = {
    muscle: ['力量', '胸', '背', '腿', '后链'],
    fatloss: ['减脂', '心肺', '低冲击'],
    strength: ['力量', '后链', '进阶'],
    endurance: ['心肺', '低冲击', '减脂'],
    mobility: ['灵活度', '拉伸', '久坐救星'],
  }[plan.goal] || [];
  const badTags = {
    muscle: ['热身', '护腰友好'],
    fatloss: ['进阶'],
    strength: ['居家', '护膝友好'],
    endurance: [],
    mobility: ['进阶', '力量'],
  }[plan.goal] || [];

  const scored = weekly
    .filter(({ it }) => it.role === 'accessory')
    .map(({ si, it }) => {
      const ex = getExercise(it.id);
      if (!ex) return null;
      let s = 0;
      for (const t of ex.tags) {
        if (goalTags.includes(t)) s -= 1.2;   // 贴合目标的动作更不该换
        if (badTags.includes(t)) s += 1.2;
      }
      if (pet) s -= (pet.priority[ex.pattern] ?? 1) * 0.8;
      if (it.role === 'finisher') s -= 2;
      const swap = suggestSwap(plan, si, it.id, {
        injuries: plan.injuries,
        level: plan.level,
        equipment: plan.equipment,
        role: it.role,
      });
      return { si, it, ex, s, swap };
    })
    .filter(Boolean)
    .sort((a, b) => b.s - a.s);

  for (const cand of scored) {
    if (cand.swap && cand.swap.ex && cand.swap.ex.id !== cand.it.id) return cand;
  }
  return null;
}

/* ---------------- 组装：排序 + 教练口吻 ---------------- */

const ZONES = { home: fingersHome, plan: fingersPlan, train: fingersTrain, pet: fingersPet, coach: fingersCoach, progress: fingersProgress };

function sortFingers(fingers) {
  return [...fingers].sort((a, b) => SEV_RANK[b.severity] - SEV_RANK[a.severity] || b.height - a.height);
}

function petFlavor(finger, pet) {
  if (!pet) return null;
  const p = PET_BY_ID[pet.typeId];
  if (!p) return null;
  const mood = moodOf(pet);
  // 心情差 → 建议更消极；心情好 → 更积极（宠物影响语气）
  if (mood === 'bored' || mood === 'hungry') return `${p.name}在旁边没精神，它觉得这条你大概率不会做。`;
  if (mood === 'ecstatic') return `${p.name}在边上蹦：就按这个来。`;
  return null;
}

function buildFingers(zone, ctx) {
  const fn = ZONES[zone] || fingersHome;
  let fingers = sortFingers(fn(ctx));
  const { coach, pet } = ctx;

  for (const f of fingers) {
    const opener = phrase(coach, f.severity === 'high' || f.severity === 'mid' ? 'open' : 'open', 0);
    const closer = f.action ? phrase(coach, 'close', 0) : '';
    f.coachNote = `${opener}${f.title}。${f.why}${closer ? ' ' + closer : ''}`;
    if (coach.style === 'science' && f.severity !== 'high') {
      f.coachNote = `${opener}${f.why}`;
    }
    f.petNote = petFlavor(f, pet);
    f.priority = SEV_RANK[f.severity] * 10 + Math.round(f.height * 10);
  }

  return {
    zone,
    coach,
    pet,
    summary: buildSummary(zone, coach, pet, ctx),
    fingers,
    primary: fingers[0] || null,
  };
}

function buildSummary(zone, coach, pet, ctx) {
  const p = pet ? PET_BY_ID[pet.typeId] : null;
  const mood = pet ? MOODS[moodOf(pet)] : null;
  const zoneLabel = { home: '首页', plan: '计划', train: '训练', pet: '宠物', coach: '教练', progress: '进展' }[zone] || '';
  const lead = {
    roast: `伸个五指山，${zoneLabel}这页有 5 个地方能改。`,
    science: `${zoneLabel}页可调变量清单如下，按影响排序。`,
    warm: `${zoneLabel}这页我们可以一点点来，先看最要紧的那个。`,
    drill: `报告：${zoneLabel}页存在 5 项可调整项，按优先级排列。`,
  }[coach.style] || '这页有 5 个地方能改。';
  return {
    lead,
    sub: p ? `${p.name}（${p.species}）· ${mood.label}` : '还没有宠物',
  };
}

/* ---------- 一键应用 ---------- */
function applyFingerAction(action, app) {
  if (!action) return { ok: false, msg: '这条是启发，不需要动手。' };
  const { kind, payload } = action;
  switch (kind) {
    case 'goto':
    case 'scroll_to':
      return { ok: true, nav: payload };
    case 'swap_item': {
      const plan = app.state.plan;
      if (!plan) return { ok: false, msg: '还没有计划。' };
      const si = payload.sessionIndex ?? 0;
      const cur = plan.sessions[si]?.items.find((i) => i.id === payload.itemId);
      if (!cur) return { ok: false, msg: '这个动作已经不在计划里了。' };
      let newId = payload.newId;
      // 预选失效（被删/本来就是它自己）时，现场重新找一个
      if (!newId || newId === payload.itemId) {
        const sug = suggestSwap(plan, si, payload.itemId, { injuries: plan.injuries, level: plan.level, equipment: plan.equipment });
        newId = sug?.ex?.id;
      }
      if (!newId || newId === payload.itemId) return { ok: false, msg: '这一项暂时没有更合适的替代动作，换个部位练也行。' };
      replaceItem(plan, si, payload.itemId, newId);
      app.save();
      return { ok: true, msg: `换成了「${getExercise(newId)?.name}」。`, refresh: true };
    }
    case 'swap_current': {
      const plan = app.state.plan;
      if (!plan) return { ok: false, msg: '还没有计划。' };
      app.sessionIndex = app.sessionIndex ?? 0;
      const si = app.sessionIndex ?? 0;
      const profile = { injuries: plan.injuries, level: plan.level, equipment: plan.equipment };
      const sug = suggestSwap(plan, si, payload.itemId, profile);
      if (!sug) return { ok: false, msg: '这一项找不到替代动作，要不要换个部位练？' };
      replaceItem(plan, si, payload.itemId, sug.ex.id);
      app.save();
      return { ok: true, msg: `换成了「${sug.ex.name}」。${sug.reason}`, refresh: true };
    }
    case 'set_days': {
      if (!app.profile) return { ok: false, msg: '先建个档案。' };
      app.profile.days = payload.days;
      app.regeneratePlan();
      return { ok: true, msg: `改成一周 ${payload.days} 练，计划重排了。`, refresh: true };
    }
    case 'start_session': {
      app.startSession(payload.index);
      return { ok: true, msg: '开始了。' };
    }
    default:
      if (typeof app[`action_${kind}`] === 'function') return app[`action_${kind}`](payload);
      return { ok: false, msg: '这个动作还没接通。' };
  }
}

/** 识别用户问题里的具体约束，让回答不像模板 */
function extractFacts(t) {

/** 习惯闭环（P7）：提醒与断签补签，纯函数 */
const { todayKey } = __require("js/store.js");

const DAY = 86400000;
const REPAIR_COOLDOWN = 7 * DAY;
const MAX_REPAIR_DAYS = 3;

function dayKeyOf(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

function daysSince(dateKey, now = Date.now()) {
  if (!dateKey) return null;
  const [y, m, d] = String(dateKey).split('-').map(Number);
  if (!y || !m || !d) return null;
  const last = new Date(y, m - 1, d).getTime();
  const today = new Date(now);
  today.setHours(0, 0, 0, 0);
  return Math.max(0, Math.round((today.getTime() - last) / DAY));
}

/** 超过 2 天没训练就提醒 */
function reminderStatus(state = {}, now = Date.now()) {
  const days = daysSince(state.lastTrainedDate, now);
  if (days === null) return { due: false, days: null, reason: 'no-record' };
  return { due: days >= 2, days, reason: days >= 2 ? 'inactive' : '' };
}

/** 断签 3 天内、且 7 天没补过，可以补一次 */
function canRepairStreak(state = {}, now = Date.now()) {
  if (!state.lastTrainedDate) return { ok: false, reason: '还没有训练记录' };
  if ((state.streak || 0) > 0) return { ok: false, reason: '连续还没断' };
  const sinceRepair = now - (Number(state.lastRepairAt) || 0);
  if (state.lastRepairAt && sinceRepair < REPAIR_COOLDOWN) return { ok: false, reason: '本周已经补过了' };
  const days = daysSince(state.lastTrainedDate, now);
  if (days === null || days > MAX_REPAIR_DAYS) return { ok: false, reason: '断太久了，补不回来' };
  return { ok: true, reason: '' };
}

/** 补签：把连续恢复到 1，并把上次训练记为昨天，下一次训练能接上 */
function repairStreak(state = {}, now = Date.now()) {
  const y = new Date(now);
  y.setDate(y.getDate() - 1);
  return {
    ...state,
    streak: Math.max(1, Number(state.streak) || 0),
    lastRepairAt: now,
    lastTrainedDate: dayKeyOf(y),
  };
}

/**
 * 是否该发系统通知：已到期 + 有权限 + 今天还没提醒过
 * @param {{now?:number, lastNotified?:string, permission?:string}} ctx
 */
function shouldNotify(state = {}, ctx = {}) {
  const now = Number(ctx.now) || Date.now();
  const permission = ctx.permission || 'default';
  const lastNotified = ctx.lastNotified || '';
  const status = reminderStatus(state, now);
  if (!status.due) return { notify: false, reason: 'not-due', title: '', body: '' };
  if (permission !== 'granted') return { notify: false, reason: 'no-permission', title: '', body: '' };
  const today = dayKeyOf(new Date(now));
  if (lastNotified === today) return { notify: false, reason: 'already-notified', title: '', body: '' };
  return {
    notify: true,
    reason: 'due',
    title: '该练了',
    body: `已经 ${status.days} 天没训练。今天练一次，连续天数就接回来了。`,

}

/** 计划对比（P20）：自动生成 vs 自定义，纯函数 */

  const out = Object.fromEntries(MUSCLE_GROUPS.map((g) => [g.key, 0]));
  for (const s of plan?.sessions || []) {
    for (const it of s.items || []) {
      const sets = Number(it.sets) || 0;
      for (const g of MUSCLE_GROUPS) {
        if ((it.muscles || []).some((m) => g.muscles.includes(m))) out[g.key] += sets;
      }
    }
  }
  return out;
}

  const sessions = plan?.sessions || [];
  const items = sessions.flatMap((s) => s.items || []);
  const byGroup = groupSets(plan);
  return {
    days: sessions.length,
    totalSets: items.reduce((sum, it) => sum + (Number(it.sets) || 0), 0),
    totalMinutes: sessions.reduce((sum, s) => sum + (Number(s.minutes) || 0), 0),
    exerciseCount: items.length,
    uniqueExercises: new Set(items.map((it) => it.id)).size,
    byGroup,
  };
}

function comparePlans(autoPlan, customPlan) {
  const a = planSnapshot(autoPlan);
  const b = planSnapshot(customPlan);
  const idsA = new Set((autoPlan?.sessions || []).flatMap((s) => (s.items || []).map((it) => it.id)));
  const idsB = new Set((customPlan?.sessions || []).flatMap((s) => (s.items || []).map((it) => it.id)));
  const names = (plan) => {

/** 杠铃片计算（P7）：给定总重量，算每边要加哪些片 */
const DEFAULT_PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];

/**
 * @param {number} target 总重量（含杠铃杆）
 * @param {{bar?:number, plates?:number[]}} opts
 * @returns {{ok:boolean, plates:number[], remainder:number, text:string, bar:number}}
 */
function plateBreakdown(target, opts = {}) {
  const bar = Number.isFinite(Number(opts.bar)) ? Number(opts.bar) : 20;
  const plates = Array.isArray(opts.plates) && opts.plates.length ? opts.plates : DEFAULT_PLATES;
  const t = Number(target);
  if (!Number.isFinite(t) || t < 0) return { ok: false, plates: [], remainder: 0, text: '重量不正确', bar };
  if (t === 0) return { ok: true, plates: [], remainder: 0, text: '徒手 / 空手', bar: 0 };
  if (t < bar) return { ok: false, plates: [], remainder: t, text: `低于空杆 ${bar}kg`, bar };

  let side = (t - bar) / 2;
  const out = [];
  for (const p of plates) {
    while (side >= p - 1e-9) {
      out.push(p);
      side -= p;
    }
  }
  side = Math.round(side * 100) / 100;
  const ok = side <= 0.01;
  const text = out.length ? out.map((n) => (Number.isInteger(n) ? n : n.toFixed(2).replace(/0$/, ''))).join(' + ') : '空杆';
  return { ok, plates: out, remainder: ok ? 0 : side, text, bar };
}


Object.assign(module.exports, { DEFAULT_PLATES, plateBreakdown });
};

/** PWA：公网域名启用安装/离线缓存；通知在权限允许时可用 */
let deferredPrompt = null;

function initPwa() {
  try {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.dispatchEvent(new CustomEvent('wuzhishan-installable'));
    });
    if (location.protocol !== 'https:' || !location.hostname.endsWith('github.io')) return;
    if (!document.querySelector('link[rel="manifest"]')) {
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'manifest.webmanifest';
      document.head.appendChild(link);
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
    }
  } catch (e) {
    /* 增强项，失败不影响主流程 */
  }
}

function canInstall() {
  return Boolean(deferredPrompt);
}

async function promptInstall() {
  if (!deferredPrompt) return false;
  try {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
  } catch (e) {
    /* 忽略 */
  }
  deferredPrompt = null;
  return true;
}

async function notifyDue(title, body) {
  try {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return false;
    const opts = { body, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'wuzhishan-remind' };
    const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if (reg && reg.showNotification) {
      await reg.showNotification(title, opts);
      return true;
    }
    new Notification(title, opts);
    return true;
  } catch (e) {
    return false;
  }
}


Object.assign(module.exports, { initPwa, canInstall, promptInstall, notifyDue });
};

  { key: '?', desc: '打开这张快捷键表' },
  { key: 'Esc', desc: '关闭最上层弹层 / 抽屉' },

/** 训练智能（P25）：周组数目标 + deload 建议，纯函数 */
const { MUSCLE_GROUPS } = __require("js/analytics.js");
const { getExercise } = __require("data/exercises.js");

const BASE_TARGETS = {
  chest: [8, 20],
  back: [8, 20],
  legs: [10, 22],
  shoulders: [6, 16],
  arms: [4, 12],
  core: [4, 12],
};

function mondayKey(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

const LEVEL_MULT = { beginner: 0.7, intermediate: 1, advanced: 1.2 };
const GOAL_MULT = { muscle: 1.1, fatloss: 0.9, strength: 1, endurance: 0.95 };

  const start = mondayKey(new Date(now));
  const out = Object.fromEntries(MUSCLE_GROUPS.map((g) => [g.key, 0]));
  for (const log of setLogs) {
    const date = String(log.date || '');
    if (date < start) continue;
    const muscles = getExercise(log.exerciseId)?.muscles || [];
    for (const g of MUSCLE_GROUPS) {
      if (g.muscles.some((m) => muscles.includes(m))) out[g.key] += 1;
    }
  }
  return out;
}

  const gm = GOAL_MULT[profile.goal] || 1;

    return {
      key: g.key,
      label: g.label,
      min: Math.max(3, Math.round(base[0] * lm * gm)),

function heatmapData(state, weeksCount) {
  const sessions = state.sessions || {};
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  const start = new Date(today);
  start.setDate(start.getDate() - ((weeksCount - 1) * 7 + ((start.getDay() + 6) % 7)));
  const weeks = [];
  for (let w = 0; w < weeksCount; w++) {
    const col = [];
    for (let d = 0; d < 7; d++) {
      const date = new Date(start);
      date.setDate(start.getDate() + w * 7 + d);
      const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      const info = sessions[key];
      const ratio = info?.ratio || 0;
      const level = ratio === 0 ? 0 : ratio < 40 ? 1 : ratio < 70 ? 2 : ratio < 95 ? 3 : 4;
      col.push({ date: key, ratio, level, today: key === todayStr });
    }
    weeks.push(col);
  }
  return weeks;
}

      drill: '本周零完成度。下周任务：三次，缺一补一。',
    }[coach.style];

  if (done >= target) {
    return {
      roast: `${done} 次，达标。别以为这是你努力，是你终于开始正常了。下周保持，我就少说两句。`,

}

function isFirstIncomplete(item, doneMap, session) {

    if ((doneMap[it.id] || 0) < it.sets) return it.id === item.id;

function fmtSec(sec) {
  const s = Math.max(0, Math.floor(sec || 0));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
}

/** 热身组（P21）：按主项重量生成递增热身组，纯函数 */
function warmupSets(workingWeight, { bar = 20, plates = 2.5 } = {}) {
  const w = Number(workingWeight);
  if (!Number.isFinite(w) || w <= bar) return [];
  const round = (v) => Math.max(bar, Math.round(v / plates) * plates);
  const pcts = [
    { pct: 0.4, reps: 8 },
    { pct: 0.6, reps: 5 },
    { pct: 0.8, reps: 3 },
  ];
  const out = [];
  for (const p of pcts) {
    const weight = round(w * p.pct);
    if (weight >= w) continue;
    if (out.length && out[out.length - 1].weight === weight) continue;
    out.push({ pct: Math.round(p.pct * 100), weight, reps: p.reps });
  }
  return out;
}

function warmupText(sets) {
  return sets.map((s) => `${s.weight}kg×${s.reps}`).join(' · ');
}

};
