      this.audio.addEventListener('pause', () => { this.music.playing = false; try { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; } catch (e) { /* ignore */ } this.renderMusicDock(); });
      this.audio.addEventListener('timeupdate', () => { this.updateMediaPosition(); this.updateMusicProgress(); });
    }
    return this.audio;
  }

  async loadMusicTracks() {
    try {
      this.music.tracks = await listTracks();
    } catch (e) {
      this.music.tracks = [];
    }
    if (!this.music.currentId && this.state.lastMusicId && this.music.tracks.some((t) => t.id === this.state.lastMusicId)) {
      this.music.currentId = this.state.lastMusicId;
    }
    this.renderMusicList();
    this.renderMusicDock();
  }

  renderMusicList() {
    const el = $('#music-list');
    if (!el) return;
    if (!this.music.tracks.length) {
      el.innerHTML = '<div class="tiny muted">还没有本地音乐。导入 mp3 / m4a / wav 等文件，或粘贴官方歌单链接。</div>';
      return;
    }
    const q = String(this.musicFilter || '').toLowerCase();
    const rows = this.music.tracks.filter((t) => !q || String(t.name).toLowerCase().includes(q));
    el.innerHTML = rows.map((t, i) => `<div class="music-row ${this.music.currentId === t.id ? 'is-on' : ''}">
      <button class="music-play" data-act="music-play" data-id="${t.id}"><span class="music-idx">${i + 1}</span><span class="music-name">${esc(t.name)}</span></button>
      <span class="tiny muted">${(Number(t.size) / 1048576).toFixed(1)}MB</span>
      <button class="music-del" data-act="music-delete" data-id="${t.id}" title="删除这首">×</button>
    </div>`).join('');
  }

  async playMusic(id) {
    try {
      const row = await getTrack(id);
      if (!row) return;
      const audio = this.ensureAudio();
      if (this.music.currentUrl) URL.revokeObjectURL(this.music.currentUrl);
      const url = URL.createObjectURL(row.blob);
      this.music.currentUrl = url;
      this.music.currentId = id;
      this.state.lastMusicId = id;
      this.save();
      this.music.queue = this.music.tracks.map((t) => t.id);
      this.music.index = this.music.queue.indexOf(id);
      audio.src = url;
      await audio.play();
      this.updateMediaSession(row);
      this.toast(`播放：${row.name}`, this.coach.id);
      this.renderMusicList();
      this.renderMusicDock();
    } catch (e) {
      this.toast('播放失败：' + (e.message || '浏览器限制了自动播放'), this.coach.id);
    }
  }

  onMusicEnded() {
    if (this.state.musicRepeat === 'one' && this.music.currentId) {
      this.playMusic(this.music.currentId);
      return;
    }
    const hasNext = this.music.index < this.music.queue.length - 1;
    if (this.state.musicShuffle || this.state.musicRepeat === 'all' || hasNext) this.musicNext();
    else { this.music.playing = false; this.renderMusicDock(); }
  }

  updateMusicProgress() {
    const a = this.audio;
    if (!a) return;
    const bar = $('#music-progress');
    const time = $('#music-time');
    const dur = Number.isFinite(a.duration) ? a.duration : 0;
    if (bar && document.activeElement !== bar) bar.value = String(dur ? Math.round((a.currentTime / dur) * 1000) : 0);
    if (time) time.textContent = `${fmtSec(a.currentTime || 0)}${dur ? ' / ' + fmtSec(dur) : ''}`;
  }

  toggleMusicShuffle() {
    this.state.musicShuffle = !this.state.musicShuffle;
    this.save();
    this.renderMusicDock();
    this.toast(this.state.musicShuffle ? '随机播放开了。' : '随机播放关了。', this.coach.id);
  }

  cycleMusicRepeat() {
    const order = ['off', 'all', 'one'];
    const i = order.indexOf(this.state.musicRepeat || 'off');
    this.state.musicRepeat = order[(i + 1) % order.length];
    this.save();
    this.renderMusicDock();
    this.toast(this.state.musicRepeat === 'one' ? '单曲循环。' : this.state.musicRepeat === 'all' ? '列表循环。' : '循环关闭。', this.coach.id);
  }

  toggleMusic() {
    const audio = this.ensureAudio();
    if (!audio.src) {
      const target = this.music.currentId || this.state.lastMusicId || this.music.tracks[0]?.id;
      if (target) this.playMusic(target);
      return;
    }
    if (audio.paused) audio.play().catch(() => {});
    else audio.pause();
  }

  async musicNext() {
    if (!this.music.queue.length) return;
    let idx = stepIndex(this.music.index, this.music.queue.length, 1);
    if (this.state.musicShuffle && this.music.queue.length > 1) {
      do { idx = Math.floor(Math.random() * this.music.queue.length); } while (idx === this.music.index);
    }
    this.music.index = idx;
    await this.playMusic(this.music.queue[idx]);
  }

  async musicPrev() {
    if (!this.music.queue.length) return;
    const idx = stepIndex(this.music.index, this.music.queue.length, -1);
    this.music.index = idx;
    await this.playMusic(this.music.queue[idx]);
  }

  async musicDelete(id) {
    if (this.music.currentId === id) {
      this.ensureAudio().pause();
      this.music.currentId = null;
      this.clearMediaSession();
    }
    await deleteTrack(id);
    await this.loadMusicTracks();
    this.toast('删了。', this.coach.id);
  }

  async musicClear() {
    if (!window.confirm('清空全部本地音乐？不能恢复。')) return;
    await clearTracks();
    this.ensureAudio().pause();
    this.music.tracks = [];
    this.music.queue = [];
    this.music.currentId = null;
    this.clearMediaSession();
    this.renderMusicList();
    this.renderMusicDock();
    this.toast('本地音乐清空了。', this.coach.id);
  }

  async importMusicFiles(files) {
    const status = $('#music-status');
    if (status) status.textContent = '正在导入本地音乐…';
    try {
      const res = await addTracks(files);
      await this.loadMusicTracks();
      if (status) status.textContent = '';
      this.toast(`导入 ${res.added} 首${res.skipped.length ? `，跳过 ${res.skipped.length} 个` : ''}。`, this.coach.id);
    } catch (e) {
      if (status) status.textContent = '';
      this.toast('导入失败：' + (e.message || '浏览器不支持本地存储'), this.coach.id);
    }
  }

  async importMusicPlaylist(file) {
    const text = await file.text();
    const entries = parsePlaylist(file.name, text);
    const names = entries.map((e) => e.title.toLowerCase());
    const matched = this.music.tracks.filter((t) => names.some((n) => n.includes(t.name.toLowerCase()) || t.name.toLowerCase().includes(n)));
    if (matched.length) {
      this.music.queue = matched.map((t) => t.id);
      this.music.index = -1;
      this.toast(`歌单匹配到 ${matched.length} 首，点第一首开始。`, this.coach.id);
      this.renderMusicList();
    } else {
      this.toast('歌单里的歌名没有匹配到本地音乐。先导入音频文件，再导歌单。', this.coach.id);
    }
  }

  updateMediaSession(track) {
    try {
      if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
      navigator.mediaSession.metadata = new MediaMetadata(mediaSessionPayload(track));
      const audio = this.ensureAudio();
      const handlers = {
        play: () => audio.play().catch(() => {}),
        pause: () => audio.pause(),
        previoustrack: () => this.musicPrev(),
        nexttrack: () => this.musicNext(),
        seekto: (d) => { if (Number.isFinite(d.seekTime)) audio.currentTime = d.seekTime; },
        seekbackward: (d) => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); },
        seekforward: (d) => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (d.seekOffset || 10)); },
      };
      Object.entries(handlers).forEach(([key, fn]) => { try { navigator.mediaSession.setActionHandler(key, fn); } catch (e) { /* 不支持的 action */ } });
    } catch (e) {
      /* 媒体面板是增强项 */
    }
  }

  updateMediaPosition() {
    try {
      if (!('mediaSession' in navigator) || !this.audio || !Number.isFinite(this.audio.duration) || !this.audio.duration) return;
      navigator.mediaSession.setPositionState({
        duration: this.audio.duration,
        position: Math.min(this.audio.currentTime, this.audio.duration),
        playbackRate: this.audio.playbackRate || 1,
      });
    } catch (e) { /* 忽略 */ }
  }

  clearMediaSession() {
    try { if ('mediaSession' in navigator) navigator.mediaSession.metadata = null; } catch (e) { /* 忽略 */ }
  }

  openMusicSearch() {
    const provider = $('#music-provider')?.value || 'qq';
    const current = this.music.tracks.find((t) => t.id === this.music.currentId);
    const query = ($('#music-search-input')?.value || '').trim() || current?.name || this.state.focusIntent || '';
    const url = searchUrl(provider, query);
    if (!url) {
      this.toast('先输入歌名，或播放一首本地音乐。', this.coach.id);
      return;
    }
    window.open(url, '_blank', 'noopener');
    this.toast(`已打开${MUSIC_PROVIDERS[provider]?.label || '音乐平台'}搜索：${query}`, this.coach.id);
  }

  setMusicVolume(value) {
    this.state.musicVolume = Number(value);
    this.save();
    if (this.audio) this.audio.volume = Number(value);
  }

  setMusicEmbed(url) {
    const info = detectEmbed(url);
    if (!info) {
      this.toast('只支持 Spotify / Apple Music / YouTube 的歌单或单曲链接。', this.coach.id);
      return;
    }
    this.state.musicEmbed = String(url).trim();
    this.music.embed = this.state.musicEmbed;
    this.save();
    this.renderView();
    this.afterRender();
    this.toast(`已嵌入 ${info.label} 播放器。`, this.coach.id);
  }

  clearMusicEmbed() {
    this.state.musicEmbed = '';
    this.music.embed = '';
    this.save();
    this.renderView();
    this.afterRender();
  }

  renderMusicDock() {
    const dock = $('#music-dock');
    if (!dock) return;
    dock.hidden = !this.music.currentId;
    document.body.classList.toggle('has-music-dock', !dock.hidden);
    const title = $('#music-title');
    const track = this.music.tracks.find((t) => t.id === this.music.currentId);
    if (title) title.textContent = track ? track.name : '未播放';
    const btn = $('#music-toggle');
    if (btn) btn.textContent = this.music.playing ? '❚❚' : '▶';
    const vol = $('#music-volume');
    if (vol && document.activeElement !== vol) vol.value = String(this.state.musicVolume ?? 0.8);
    const shuffle = $('#music-shuffle');
    if (shuffle) shuffle.classList.toggle('is-on', Boolean(this.state.musicShuffle));
    const repeat = $('#music-repeat');
    if (repeat) {
      repeat.classList.toggle('is-on', (this.state.musicRepeat || 'off') !== 'off');
      repeat.textContent = this.state.musicRepeat === 'one' ? '🔂' : '🔁';
      repeat.title = this.state.musicRepeat === 'one' ? '单曲循环' : this.state.musicRepeat === 'all' ? '列表循环' : '循环关闭';
    }
    this.updateMusicProgress();
  }

  /* ---------- 短视频文案导入 ---------- */
  openVideoImport() {
    this.videoParse = null;
    this.openModal(`
      <div class="modal-head">
        <div><span class="eyebrow">短视频导入</span><h2>从抖音文案生成计划</h2></div>
        <button class="icon-btn" data-act="close-modal" aria-label="关闭">✕</button>
      </div>
      <p class="small muted" style="line-height:1.7;margin-bottom:10px">把抖音的分享文案 / 视频里的训练计划文字粘进来。受平台限制，只贴链接读不到视频内容；这里只在本机解析文字，不上传、不抓取。</p>
      <textarea class="input video-text" id="video-text" rows="6" placeholder="例如：深蹲 4组×12次；卧推 3组×10次；平板支撑 3组 40秒"></textarea>
      <div class="video-hint tiny muted">支持：4组×12次、4×12、12次4组、3组 40秒、力竭；动作名会匹配动作库。</div>
      <div id="video-preview" class="video-preview"></div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-act="close-modal">取消</button>
        <button class="btn btn-ghost" data-act="video-parse">解析预览</button>
        <button class="btn btn-primary" id="video-apply" data-act="video-apply" disabled>导入为计划草稿</button>
      </div>
    `);
  }

  parseVideoImport() {
    const text = $('#video-text')?.value || '';
    const result = buildPlanFromText(text, this.state.profile);
    this.videoParse = result;
    const box = $('#video-preview');
    const apply = $('#video-apply');
    if (apply) apply.disabled = !result.ok;
    if (!box) return;
    if (!result.ok) {
      box.innerHTML = `<div class="video-error">${esc(result.reason)}</div>`;
      return;
    }
    box.innerHTML = `<div class="video-result">
      <div class="video-result-head"><b>识别到 ${result.items.length} 个动作</b><span class="pill ghost">${result.source.platform === 'douyin' ? '抖音链接' : '训练文字'}</span></div>
      <div class="video-items">${result.items.map((it, i) => `<div><span>${i + 1}</span><b>${esc(it.name)}</b><em>${it.sets} 组 × ${esc(it.reps)}</em></div>`).join('')}</div>
      ${result.unmatched.length ? `<div class="video-unmatched">没识别：${result.unmatched.slice(0, 4).map(esc).join('、')}</div>` : ''}
      <div class="tiny muted">导入后进入自定义计划编辑，可改动作/组数/拆天。</div>
    </div>`;
  }

  applyVideoImport() {
    if (!this.videoParse?.ok || !this.videoParse.plan) return;
    this.customDraft = this.videoParse.plan;
    this.closeModal();
    this.go('custom');
    this.toast(`已导入 ${this.videoParse.items.length} 个动作，先确认再保存。`, this.coach.id);
  }

  /* ---------- 自定义计划 ---------- */
  startCustomPlan(useCurrent = true) {
    const base = useCurrent && this.state.plan ? clonePlan(this.state.plan) : emptyCustomPlan(this.state.profile);
    base.custom = true;
    base.sessions = Array.isArray(base.sessions) && base.sessions.length ? base.sessions : emptyCustomPlan(this.state.profile).sessions;
    this.customDraft = base;
    this.go('custom');
  }

  customCancel() {
    this.customDraft = null;
    this.go(this.state.plan ? 'plan' : 'plan');
  }

  customSave() {
    if (!this.customDraft) return;
    const draft = normalizeCustomPlan(this.customDraft);
    const errors = validateCustomPlan(draft);
    if (errors.length) {
      this.toast(errors[0].msg, this.coach.id);
      return;
    }
    draft.custom = true;
    draft.version = (this.state.plan?.version || 0) + 1;
    this.state.plan = draft;
    this.state.activeSession = null;
    this.sessionClock = 0;
    this.planTab = 0;
    this.sessionIndex = 0;
    this.save();
    this.customDraft = null;
    this.go('plan');
    this.toast('计划保存了。进训练就能用。', this.coach.id);
  }

  customAddDay() {
    const draft = clonePlan(this.customDraft);
    draft.sessions.push({ title: `第 ${draft.sessions.length + 1} 天`, minutes: draft.minutes || 45, items: [] });
    draft.days = draft.sessions.length;
    this.customDraft = draft;
    this.renderView();
    this.afterRender();
  }

  customRemoveDay(si) {
    if (!this.customDraft || this.customDraft.sessions.length <= 1) return;
    const draft = clonePlan(this.customDraft);
    draft.sessions.splice(si, 1);
    draft.days = draft.sessions.length;
    this.customDraft = draft;
    this.renderView();
    this.afterRender();
  }

  customRemoveExercise(si, ii) {
    this.customDraft = removeItem(this.customDraft, si, ii);
    this.renderView();
    this.afterRender();
  }

  customMove(si, ii, dir) {
    this.customDraft = moveItem(this.customDraft, si, ii, dir);
    this.renderView();
    this.afterRender();
  }

  openExercisePicker(si) {
    this.picker = { si, query: '', muscle: 'all', equipment: 'all' };
    this.openModal(`
      <div class="modal-head">
        <div><span class="eyebrow">动作库</span><h2>给第 ${si + 1} 天加动作</h2></div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      <div class="picker-controls">
        <input class="input" id="ex-search" placeholder="搜动作名或标签，例如：卧推 / 腿 / 护膝" />
        <select class="select" id="picker-muscle">
          <option value="all">全部肌群</option>
          ${Object.entries(MUSCLES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}
        </select>
        <select class="select" id="picker-equipment">
          <option value="all">全部器械</option>
          ${Object.entries(EQUIPMENTS).map(([k, v]) => `<option value="${k}">${v.label || v}</option>`).join('')}
        </select>
      </div>
      <div class="picker-list" id="picker-list"></div>
    `);
    const search = $('#ex-search');
    if (search) search.addEventListener('input', () => { this.picker.query = search.value; this.renderPickerList(); });
    const sel = $('#picker-muscle');
    if (sel) sel.addEventListener('change', () => { this.picker.muscle = sel.value; this.renderPickerList(); });
    const eq = $('#picker-equipment');
    if (eq) eq.addEventListener('change', () => { this.picker.equipment = eq.value; this.renderPickerList(); });
    this.renderPickerList();
    setTimeout(() => $('#ex-search')?.focus(), 60);
  }

  renderPickerList() {
    const list = $('#picker-list');
    if (!list || !this.picker) return;
    const items = filterExercises(this.picker.query, this.picker.muscle, this.picker.equipment).slice(0, 80);
    list.innerHTML = items.length
      ? items.map((ex) => `<button class="picker-row" data-act="picker-pick" data-id="${ex.id}">
          <span class="picker-name"><b>${esc(ex.name)}</b><span class="tiny muted">${(ex.muscles || []).map((m) => MUSCLES[m]).filter(Boolean).join(' · ')}${ex.tags?.length ? ` · ${ex.tags.join(' / ')}` : ''} · L${ex.level || 1}</span></span>
          <span class="tiny muted">${(ex.equipment || []).map((e) => EQUIPMENTS[e]?.label || e).slice(0, 2).join(' / ')}</span>
        </button>`).join('')
      : '<div class="small muted" style="padding:12px">没有匹配的动作，换个词试试。</div>';
  }

  pickerPick(id) {
    if (!this.picker) return;
    const res = addItem(this.customDraft, this.picker.si, id);
    if (!res.added) {
      this.toast(res.msg, this.coach.id);
      return;
    }
    this.customDraft = res.plan;
    const si = this.picker.si;
    this.closeModal();
    this.picker = null;
    this.renderView();
    this.afterRender();
    const day = $(`.custom-day:nth-of-type(${si + 2})`);
    if (day) day.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  openTemplateSaveModal() {
    if (!this.customDraft) return;
    this.openModal(`
      <div class="modal-head">
        <div><span class="eyebrow">计划模板</span><h2>存为模板</h2></div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      <div class="field">
        <label for="template-name">模板名称</label>
        <input class="input" id="template-name" maxlength="30" value="${esc(this.customDraft.splitName || '我的计划')}" />
      </div>
      <p class="tiny muted">模板只存本机，可导出 JSON 分享给别人导入。</p>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-act="close-modal">取消</button>
        <button class="btn btn-primary" data-act="template-save-confirm">保存模板</button>
      </div>
    `);
    setTimeout(() => $('#template-name')?.select(), 60);
  }

  saveTemplate(name) {
    if (!this.customDraft) return;
    const tpl = makeTemplate(name || this.customDraft.splitName, this.customDraft);
    this.state.planTemplates = addTemplate(this.state.planTemplates || [], tpl);
    this.save();
    this.closeModal();
    this.renderView();
    this.afterRender();
    this.toast('模板存好了。', this.coach.id);
  }

  loadTemplate(id) {
    const tpl = (this.state.planTemplates || []).find((t) => t.id === id);
    if (!tpl) return;
    this.customDraft = clonePlan(tpl.plan);
    this.renderView();
    this.afterRender();
    this.toast(`已载入模板「${tpl.name}」。`, this.coach.id);
  }

  deleteTemplate(id) {
    if (!id) return;
    this.state.planTemplates = removeTemplate(this.state.planTemplates || [], id);
    this.save();
    this.renderView();
    this.afterRender();
    this.toast('模板删了。', this.coach.id);
  }

  exportTemplate() {
    if (!this.customDraft) return;
    const tpl = makeTemplate(this.customDraft.splitName, this.customDraft);
    const blob = new Blob([serializeTemplate(tpl)], { type: 'application/json;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `wuzhishan-plan-${tpl.id}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    this.toast('模板导出了，发给别人可导入。', this.coach.id);
  }

  async importTemplateFile(file) {
    const text = await file.text();
    const res = parseTemplate(text);
    if (!res.ok) {
      this.toast(res.msg, this.coach.id);
      return;
    }
    this.customDraft = clonePlan(res.template.plan);
    this.renderView();
    this.afterRender();
    this.toast(`已导入模板「${res.template.name}」，保存后生效。`, this.coach.id);
  }

  openCompareModal() {
    const auto = this.state.generatedPlan;
    if (!auto) {
      this.toast('还没有自动生成版可对比。先让教练排一份。', this.coach.id);
      return;
    }
    const cmp = comparePlans(auto, this.state.plan);
    const row = (r) => `<tr><td>${r.label}</td><td>${r.a}${r.unit}</td><td>${r.b}${r.unit}</td><td>${r.b - r.a > 0 ? '+' : ''}${r.b - r.a}${r.unit}</td></tr>`;
    const max = Math.max(1, ...cmp.groups.flatMap((g) => [g.a, g.b]));
    this.openModal(`
      <div class="modal-head">
        <div><span class="eyebrow">计划对比</span><h2>自动生成 vs 自己排</h2></div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      <table class="compare-table"><caption class="sr-only">自动生成计划与自定义计划对比</caption>
        <thead><tr><th>指标</th><th>自动版</th><th>自定义</th><th>差</th></tr></thead>
        <tbody>${cmp.rows.map(row).join('')}</tbody>
      </table>
      <div class="compare-groups">
        ${cmp.groups.map((g) => `<div class="compare-group"><span>${g.label}</span>
          <div class="compare-bars"><i class="auto" style="width:${(g.a / max) * 100}%"></i><i class="custom" style="width:${(g.b / max) * 100}%"></i></div>
          <span class="tiny muted">${g.a} / ${g.b} 组</span></div>`).join('')}
      </div>
      <div class="compare-diff">
        <div><b>自动版独有</b>：${cmp.onlyA.length ? cmp.onlyA.map(esc).join('、') : '无'}</div>
        <div><b>自定义独有</b>：${cmp.onlyB.length ? cmp.onlyB.map(esc).join('、') : '无'}</div>
        <div class="tiny muted">共同动作 ${cmp.same} 个；灰色=自动版，深色=自定义。</div>
      </div>
    `);
  }

  async exportPhotos() {
    try {
      const rows = await listPhotos();
      if (!rows.length) return this.toast('还没有照片可导出。', this.coach.id);
      rows.forEach((r) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(r.blob);
        a.download = `wuzhishan-photo-${r.date}-${r.angle}.jpg`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      });
      this.toast(`正在导出 ${rows.length} 张照片（浏览器可能询问是否允许多文件下载）。`, this.coach.id);
    } catch (e) {
      this.toast('照片导出失败。', this.coach.id);
    }
  }

  async exportMusic() {
    try {
      const rows = await listTracks();
      if (!rows.length) return this.toast('还没有本地音乐可导出。', this.coach.id);
      let n = 0;
      for (const meta of rows) {
        const row = await getTrack(meta.id);
        if (!row?.blob) continue;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(row.blob);
        a.download = row.file || `${row.name}.mp3`;
        a.click();
        n += 1;
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        await new Promise((resolve) => setTimeout(resolve, 120));
      }
      this.toast(`正在导出 ${n} 首本地音乐。`, this.coach.id);
    } catch (e) {
      this.toast('音乐导出失败。', this.coach.id);
    }
  }

  metToday() {
    return (this.state.metActivities || []).filter((a) => a.date === todayKey());
  }

  addMetActivity() {
    const code = $('#met-code')?.value;
    const preset = WORKOUT_MET_PRESETS.find((a) => a.code === code) || WORKOUT_MET_PRESETS[0];
    const minutes = Math.max(5, Math.min(360, Number($('#met-minutes')?.value) || 30));
    if (!preset) return;
    this.state.metActivities = [...this.metToday(), { date: todayKey(), code: preset.code, label: preset.label, met: preset.met, minutes }];
    this.save();
    this.renderView();
    this.afterRender();
    this.toast(`已加入今日活动：${preset.label} ${minutes} 分钟（${preset.met} MET）。`, this.coach.id);
  }

  removeMetActivity(idx) {
    if (!Number.isInteger(idx) || idx < 0) return;
    const list = this.metToday();
    list.splice(idx, 1);
    this.state.metActivities = list;
    this.save();
    this.renderView();
    this.afterRender();
  }

  importTodayMetActivity() {
    const plan = this.state.plan;
    if (!plan?.sessions?.length) return;
    const idx = this.activeSession?.index ?? this.sessionIndex ?? 0;
    const session = plan.sessions[idx] || plan.sessions[0];
    const sm = sessionMetSummary(session, { weightKg: this.state.profile?.body?.weightKg, goal: plan.goal });
    if (!sm.ok) { this.toast('先在身体档案填体重，才能按 MET 估算。', this.coach.id); return; }
    this.state.metActivities = [...this.metToday(), { date: todayKey(), code: 'plan_session', label: `计划课：${session.title.split(' · ')[0]}`, met: sm.avgMet, minutes: sm.minutes }];
    this.save();
    this.renderView();
    this.afterRender();
    this.toast(`已导入今日计划课：均值 ${sm.avgMet} MET · ${sm.minutes} 分钟。`, this.coach.id);
  }

  clearMetActivities() {
    this.state.metActivities = [];
    this.save();
    this.renderView();
    this.afterRender();
  }

  recordBodyLog() {
    const res = normalizeBodyLog({
      date: $('#body-log-date')?.value,
      weight: $('#body-log-weight')?.value,
      bodyFat: $('#body-log-fat')?.value,
      waist: $('#body-log-waist')?.value,
    });
    if (!res.ok) {
      this.toast(res.msg, this.coach.id);
      return;
    }
    const logs = [...(this.state.bodyLogs || []), res.log].sort((a, b) => String(a.date).localeCompare(String(b.date))).slice(-200);
    this.state.bodyLogs = logs;
    const body = { ...(this.state.profile.body || {}), weightKg: res.log.weight };
    if (res.log.bodyFat != null) body.bodyFatPct = res.log.bodyFat;
    if (res.log.waist != null) body.waistCm = res.log.waist;
    this.state.profile = { ...this.state.profile, body };
    this.save();
    this.renderView();
    this.afterRender();
    this.toast('身体记录已保存。', this.coach.id);
  }

  customReorder(si, from, to) {
    if (!this.customDraft) return;
    const items = this.customDraft.sessions[si]?.items;
    if (!items || to < 0 || to >= items.length) return;
    const draft = clonePlan(this.customDraft);
    const [moved] = draft.sessions[si].items.splice(from, 1);
    draft.sessions[si].items.splice(to, 0, moved);
    this.customDraft = draft;
    this.renderView();
    this.afterRender();
  }

  customCopyDay(si) {
    if (!this.customDraft) return;
    const draft = clonePlan(this.customDraft);
    const src = draft.sessions[si];
    if (!src) return;
    draft.sessions.splice(si + 1, 0, { ...clonePlan(src), title: `${src.title} 副本` });
    draft.days = draft.sessions.length;
    this.customDraft = draft;
    this.renderView();
    this.afterRender();
    this.toast('复制了一天。', this.coach.id);
  }

  async copyTemplateShare() {
    if (!this.customDraft) return;
    const plan = this.customDraft;
    const lines = [`【${plan.splitName || '自定义计划'}】${plan.sessions.length} 天`];
    plan.sessions.forEach((s, i) => {
      lines.push(`第 ${i + 1} 天 ${s.title}：${(s.items || []).map((it) => it.name).join('、') || '（空）'}`);
    });
    lines.push('来自五指山 · 谭师道场');
    const text = lines.join('\n');
    try {
      await navigator.clipboard.writeText(text);
      this.toast('分享文案已复制。', this.coach.id);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); this.toast('分享文案已复制。', this.coach.id); } catch (err) { this.toast('复制失败，可以用「导出模板」发文件。', this.coach.id); }
      ta.remove();
    }
  }

  openWorkoutFocus() {
    if (!this.state.plan) {
      this.toast('先有训练计划再进专注模式。', this.coach.id);
      return;
    }
    if (!this.state.activeSession || this.state.activeSession.finished) {
      this.startSession(this.sessionIndex ?? 0);
    }
    this.workoutFocusOpen = true;
    document.body.classList.add('workout-focus-on');
    this.renderWorkoutFocus();
    this.updateTimerUI();
  }

  closeWorkoutFocus() {
    this.workoutFocusOpen = false;
    this.exerciseDetailId = null;
    this.exerciseReturn = 'train';
    this.photoCompare = [];
    document.body.classList.remove('workout-focus-on');
    const el = $('#workout-focus');
    if (el) {
      el.hidden = true;
      el.innerHTML = '';
    }
  }

  workoutCurrent() {
    const active = this.state.activeSession;
    const plan = this.state.plan;
    if (!active || !plan) return null;
    const session = plan.sessions[active.index];
    if (!session) return null;
    const done = active.doneSets || {};
    for (let i = 0; i < session.items.length; i++) {
      const item = session.items[i];
      const d = done[item.id] || 0;
      if (d < item.sets) return { item, session, index: i, setNo: d + 1, doneSets: d };
    }
    return null;
  }

  renderWorkoutFocus() {
    const el = $('#workout-focus');
    if (!el) return;
    if (!this.workoutFocusOpen) {
      el.hidden = true;
      return;
    }
    const active = this.state.activeSession;
    const plan = this.state.plan;
    if (!active || !plan) {
      this.closeWorkoutFocus();
      return;
    }
    const session = plan.sessions[active.index];
    const done = active.doneSets || {};
    const total = session.items.reduce((sum, it) => sum + it.sets, 0);
    const completed = session.items.reduce((sum, it) => sum + (done[it.id] || 0), 0);
    const cur = this.workoutCurrent();
    el.hidden = false;
    if (!cur) {
      el.innerHTML = `<div class="wf-shell"><div class="wf-top"><span>专注训练 · DAY ${active.index + 1}</span><button class="btn btn-ghost btn-sm" data-act="workout-close">退出</button></div>
        <div class="wf-done"><h2>这一节做完了</h2><p>${completed}/${total} 组。按结束记录，别再加戏。</p>
        <div class="row" style="justify-content:center;gap:10px"><button class="btn btn-primary" data-act="finish-session">结束并记录</button><button class="btn btn-ghost" data-act="workout-close">先退出</button></div></div></div>`;
      return;
    }
    const { item, index, setNo } = cur;
    const ex = getExercise(item.id);
    const art = getArt(ex?.pattern || 'A');
    const last = lastSetFor(this.state.setLogs || [], item.id);
    const reps = last?.reps ?? (parseInt(item.reps, 10) || 8);
    const pct = total ? Math.round((completed / total) * 100) : 0;
    el.innerHTML = `<div class="wf-shell">
      <div class="wf-top"><span>专注训练 · DAY ${active.index + 1} · ${esc(session.title)}</span><button class="btn btn-ghost btn-sm" data-act="workout-close">退出</button></div>
      <div class="wf-progress"><div class="wf-bar"><i style="width:${pct}%"></i></div><span>${completed}/${total} 组 · ${pct}%</span></div>
      <div class="wf-card">
        <div class="wf-art">${art}</div>
        <div class="wf-info">
          <span class="eyebrow">动作 ${index + 1}/${session.items.length} · 第 ${setNo}/${item.sets} 组</span>
          <h2>${esc(item.name)}</h2>
          <p class="small muted">${esc(item.reps)} · 休息 ${esc(item.rest)} · RPE ${esc(item.rpe)}</p>
          <div class="wf-cue">${esc(item.cue || '动作质量优先于重量。')}</div>
          <button class="btn btn-sm btn-ghost mt-s" data-act="exercise-detail" data-id="${item.id}">看动作要点与替代动作</button>
          ${last ? `<div class="wf-last">上次：${last.weight}kg × ${last.reps}${last.rpe ? ` · RPE ${last.rpe}` : ''}</div>` : ''}
          <div class="wf-inputs">
            <label><span>重量 kg</span><input class="input" id="wf-weight" type="number" inputmode="decimal" step="0.5" min="0" max="500" value="${last?.weight ?? ''}" placeholder="可选" /></label>
            <label><span>次数</span><input class="input" id="wf-reps" type="number" inputmode="numeric" min="1" max="100" value="${reps}" /></label>
            <button class="btn btn-primary btn-lg" data-act="workout-complete">完成这组</button>
          </div>
          <div class="wf-hint">完成会自动开始组间休息；重量留空则只记完成，不记重量。</div>
        </div>
      </div>
      <div class="wf-rest ${this.timer.running ? 'is-running' : ''}" id="workout-rest">
        <span>组间休息</span><b id="workout-rest-time">${fmtSec(this.timer.left)}</b>
        <button class="btn btn-sm btn-ghost" data-act="workout-skip-rest">跳过休息</button>
      </div>
    </div>`;
  }

  workoutComplete() {
    const cur = this.workoutCurrent();
    if (!cur) return;
    const weight = Number($('#wf-weight')?.value);
    const reps = Number($('#wf-reps')?.value);
    if (Number.isFinite(weight) && weight > 0 && Number.isFinite(reps) && reps > 0) {
      const entry = addSetLog(this.state, {
        date: this.todayKey,
        sessionIndex: this.state.activeSession?.index ?? 0,
        exerciseId: cur.item.id,
        exerciseName: cur.item.name,
        setIndex: cur.setNo,
        weight,
        reps,
        rpe: Number(String(cur.item.rpe).match(/\d+/)?.[0]) || null,
      });
      if (entry) this.save();
    }
    this.completeSet(cur.item.id);
    this.renderWorkoutFocus();
  }

  openExerciseDetail(id) {
    if (!getExercise(id)) return;
    this.exerciseReturn = this.workoutFocusOpen ? 'workout' : 'train';
    if (this.workoutFocusOpen) this.closeWorkoutFocus();
    this.exerciseDetailId = id;
    this.go('exercise');
  }

  exerciseBack() {
    const back = this.exerciseReturn;
    this.go('train');
    if (back === 'workout') this.openWorkoutFocus();
  }

  renderPetCorner() {
    const el = $('#pet-corner');
    if (!el) return;
    const pet = this.state.pet;
    const show = Boolean(pet) && this.view !== 'pet' && this.view !== 'adopt' && !this.workoutFocusOpen;
    el.hidden = !show;
    if (!show) { el.innerHTML = ''; return; }
    el.innerHTML = `${petMini(pet.typeId, pet, 54)}<span>${esc(pet.name)}</span>`;
    el.title = `去看看${pet.name}`;
  }

  async shareCard() {
    if (!this.state.pet) return this.go('adopt');
    const data = buildShareData(this.state, this.coach);
    const meta = {
      streak: data.streak,
      weekSessions: data.weekSessions,
      totalSessions: data.totalSessions,
      bestWeight: data.bestWeight,
    };
    const svg = petSVG(this.state.pet.typeId, { pet: this.state.pet, size: 520, animated: false, scene: false, meta });
    const canvas = document.createElement('canvas');
    try {
      await drawShareCard(canvas, data, svg);
    } catch (e) {
      this.toast('分享卡生成失败：' + e.message, this.coach.id);
      return;
    }
    this.lastShareDataUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = this.lastShareDataUrl;
    a.download = `五指山-${data.date}.png`;
    a.click();
    this.toast('分享卡生成了。发出去，别只存着。', this.coach.id);
  }

  /* ---------- 宠物待机 ---------- */
  startPetIdle() {
    this.stopPetIdle();
    if (this.view !== 'pet' || !this.state.pet) return;
    const loop = () => {
      if (this.view !== 'pet' || !$('#pet-stage-inner')) return;
      const actions = ['yawn', 'scratch', 'pace', 'sniff', 'stretch'];
      this.petIdleTick(actions[Math.floor(Math.random() * actions.length)]);
      this._petIdleTimer = setTimeout(loop, 7000 + Math.random() * 5000);
    };
    this._petIdleTimer = setTimeout(loop, 2200);
  }

  stopPetIdle() {
    clearTimeout(this._petIdleTimer);
    clearTimeout(this._petIdleOff);
    this._petIdleTimer = null;
    this._petIdleOff = null;
    const el = $('#pet-stage-inner');
    if (!el) return;
    ['yawn', 'scratch', 'pace', 'sniff', 'stretch'].forEach((a) => el.classList.remove('idle-' + a));
  }

  petIdleTick(name) {
    const el = $('#pet-stage-inner');
    if (!el) return null;
    const actions = ['yawn', 'scratch', 'pace', 'sniff', 'stretch'];
    const a = actions.includes(name) ? name : actions[Math.floor(Math.random() * actions.length)];
    actions.forEach((x) => el.classList.remove('idle-' + x));
    void el.offsetWidth;
    el.classList.add('idle-' + a);
    clearTimeout(this._petIdleOff);
    this._petIdleOff = setTimeout(() => el.classList.remove('idle-' + a), 2400);
    return a;
  }

  pickPet(id) {
    this.adoptPick = id;
    this.renderView();
    this.afterRender();
  }

  adoptPet() {
    const id = this.adoptPick || 'dog';
    const p = PET_BY_ID[id];
    const existing = this.state.pet;
    if (existing && existing.typeId === id) {
      this.toast(`${p.name}已经是你的了。`, this.coach.id);
      this.go('pet');
      return;
    }
    const keepName = existing && existing.typeId === id;
    this.state.pet = newPetState(id, keepName ? existing.name : p.name);
    if (existing) {
      // 换宠物：保留部分羁绊，表示它记得你
      this.state.pet.bond = Math.round((existing.bond || 0) * 0.3);
      this.state.pet.totalCare = Math.round((existing.totalCare || 0) * 0.5);
    }
    this.state.profile.petId = id;
    this.state.profile.onboarded = true;
    this.save();
    this.toast(`${p.name}跟着你了。它认${p.directionName}。`, this.coach.id);
    this.go('pet');
    if (this.state.plan) {
      this.state.plan.petId = id;
      this.state.plan.petDirection = p.direction;
      this.save();
    }
  }

  switchPetView(id) {
    // 在宠物页预览不同宠物（不换，只切预览）
    this.adoptPick = id;
    this.toast(`这是「${PET_BY_ID[id].name}」的样子。想换就去「换一只养」。`, this.coach.id);
    this.go('adopt');
  }

  /* ---------- 换动作 / 要点 / 收藏 ---------- */
  openSwapModal(sessionIndex, itemId) {
    const plan = this.state.plan;
    if (!plan) return;
    const session = plan.sessions[sessionIndex];
    const item = session?.items.find((i) => i.id === itemId);
    if (!item) return;
    const sug = suggestSwap(plan, sessionIndex, itemId, { injuries: plan.injuries, level: plan.level, equipment: plan.equipment });
    const candidates = this.swapCandidates(item, session).filter((c) => c.id !== sug?.ex?.id);
    this.openModal(`
      <div class="modal-head">
        <div>
          <span class="eyebrow">换动作</span>
          <h2 style="margin-top:4px">${esc(item.name)} 做不了？</h2>
          <p class="small muted">同模式替代，保持训练结构不变。</p>
        </div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      ${sug ? `<div class="card flat" style="border-left:3px solid var(--ochre)">
        <div class="card-title">🖐️ ${esc(this.coach.name)}推荐</div>
        <div class="row-between mt-s">
          <div>
            <div style="font-weight:700">${esc(sug.ex.name)}</div>
            <div class="tiny muted">${esc(sug.reason)}</div>
          </div>
          <button class="btn btn-sm btn-primary" data-act="apply-swap" data-session="${sessionIndex}" data-item="${itemId}" data-new="${sug.ex.id}">用这个</button>
        </div>
      </div>` : ''}
      ${candidates.length ? `<div class="mini-title mt">其他替代动作（自动匹配）</div>
      <div class="stack">
        ${candidates.map((c) => `<div class="row-between" style="padding:8px 10px;border:1px solid var(--line);border-radius:10px;gap:10px">
          <div style="min-width:0">
            <b class="small">${esc(c.name)}</b>
            <div class="tiny muted">${esc(c.reason)} · ${esc(c.equip)}</div>
          </div>
          <button class="btn btn-sm btn-ghost" data-act="apply-swap" data-session="${sessionIndex}" data-item="${itemId}" data-new="${c.id}">换成它</button>
        </div>`).join('')}
      </div>` : `<div class="tiny muted mt">${sug ? '当前器械与伤病条件下，这是最合适的一个了。' : '当前器械与伤病条件下，没有更合适的同类动作——可以换个部位练，或先休息。'}</div>`}
      <div class="modal-foot"><button class="btn btn-ghost" data-act="close-modal">算了，继续练</button></div>
    `);
  }

  swapCandidates(item, session) {
    const used = session.items.map((i) => i.id).filter((id) => id !== item.id);
    const gear = this.state.profile.equipment || ['none'];
    const plan = this.state.plan;
    const injuries = (plan?.injuries || []).flatMap((k) => INJURIES[k]?.avoid || []);
    const level = LEVELS[this.state.profile.level]?.cap ?? 3;
    return findSubstitutes(item.id, {
      equipment: gear,
      injuries,
      level,
      exclude: used,
      limit: 6,
    }).map((r) => ({
      id: r.ex.id,
      name: r.ex.name,
      equip: r.ex.equipment.map((g) => EQUIPMENTS[g] || g).join(' / '),
      reason: r.reason,
    }));
  }

  applySwap(sessionIndex, itemId, newId) {
    if (!newId) return;
    const plan = this.state.plan;
    const old = plan.sessions[sessionIndex].items.find((i) => i.id === itemId);
    replaceItem(plan, sessionIndex, itemId, newId);
    this.save();
    this.closeModal();
    this.toast(`换成了「${getExercise(newId)?.name}」。`, this.coach.id);
    this.renderView();
    this.afterRender();
  }

  showCue(itemId) {
    const ex = getExercise(itemId);
    if (!ex) return;
    const item = this.state.plan?.sessions?.flatMap((s) => s.items).find((i) => i.id === itemId);
    this.openModal(`
      <div class="modal-head">
        <div>
          <span class="eyebrow">动作要点 · ${esc(ex.pattern)}模式</span>
          <h2 style="margin-top:4px">${esc(ex.name)}</h2>
          <p class="small muted">${ex.muscles.map((m) => MUSCLES[m]).join(' · ')} · ${ex.equipment.map((g) => EQUIPMENTS[g] || g).join(' / ')}</p>
        </div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      <div class="art-wrap">
        ${getArt(ex.pattern)}
        <div class="art-caption">${esc(patternName(ex.pattern))} · ${esc(patternCue(ex.pattern))}</div>
      </div>
      <div class="cue-box" style="margin-top:0">${esc(item?.cue || '动作全程可控，宁可慢，不要晃。')}</div>
      <div class="mini-title mt">常见错误</div>
      <ul class="rules-list">
        <li><span class="rl-num">×</span><span>${esc(commonMistake(ex))}</span></li>
        <li><span class="rl-num">×</span><span>重量上去了，幅度却变小了。</span></li>
        <li><span class="rl-num">×</span><span>最后两次靠甩、靠借力，那两次不算。</span></li>
      </ul>
      <div class="mini-title mt">${esc(this.coach.name)}说</div>
      <div class="fd-coach" style="margin:0">
        <div class="fd-coach-avatar">${coachSVG(this.coach.id, 30)}</div>
        <div class="fd-coach-text">${esc(this.cueLine(ex, item))}</div>
      </div>
      ${ex.src ? `<div class="tiny muted mt-s" style="line-height:1.6">动作元数据参考 free-exercise-db（Unlicense 公有领域）的 <span class="ds-code">${esc(ex.src)}</span>，中文名与要点由本站撰写。</div>` : ''}
      <div class="modal-foot">
        <button class="btn btn-ghost" data-act="close-modal">知道了</button>
        <button class="btn btn-primary" data-act="save-cue-goto">让教练存一条要点</button>
      </div>
    `);
  }

  cueLine(ex, item) {
    const style = this.coach.style;
    const base = item?.cue || '动作全程可控';
    return {
      roast: `${base}。就这么点事，你还能做错？做错就降重量，别硬撑。`,
      science: `${base}。建议用 70% 重量先做 2 组，确认轨迹稳定再加。`,
      warm: `${base}。做慢一点，感受它，没关系的。`,
      drill: `${base}。执行。`,
    }[style];
  }

  /** 某动作的历史：上次一组 + 最好一组（供计划页/训练页提示） */
  historyForItem(itemId) {
    const logs = this.state.setLogs || [];
    return { last: lastSetFor(logs, itemId), pr: bestSetFor(logs, itemId) };
  }

  openLogSetModal(itemId) {
    const plan = this.state.plan;
    const session = this.state.activeSession;
    const item = plan?.sessions?.flatMap((s) => s.items).find((i) => i.id === itemId);
    if (!item) return;
    const { last, pr } = this.historyForItem(itemId);
    const repsFromPlan = parseInt(item.reps, 10) || 8;
    const ci = this.cycleInfo();
    const suggested = ci ? recommendLoad(this.state.setLogs || [], itemId, ci.week.loadPct) : null;
    const repsVal = last?.reps ?? repsFromPlan;
    const rpeVal = last?.rpe ?? (Number(item.rpe) || 8);
    const rangeMatch = String(item.reps || '').match(/(\d+)\s*[–-]\s*(\d+)/);
    const repRange = rangeMatch ? [Number(rangeMatch[1]), Number(rangeMatch[2])] : [8, 12];
    const auto = last?.rpe ? suggestNextLoad({ weight: last.weight, reps: last.reps, rpe: last.rpe, repRange }) : null;
    const weightVal = last?.rpe && auto ? auto.nextWeight : (last?.weight ?? suggested ?? '');
    const doneNow = session?.doneSets?.[itemId] || 0;
    this.openModal(`
      <div class="modal-head">
        <div>
          <span class="eyebrow">记一组 · 第 ${doneNow + 1} / ${item.sets} 组</span>
          <h2 style="margin-top:4px">${esc(item.name)}</h2>
          <p class="small muted">${esc(item.reps)} · 组间 ${esc(item.rest)} · RPE ${esc(item.rpe)}</p>
        </div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label for="log-weight">重量（kg）</label>
          <input class="input" id="log-weight" type="number" inputmode="decimal" min="0" max="500" step="0.5" value="${weightVal}" placeholder="比如 60" />
        </div>
        <div class="field">
          <label for="log-reps">次数</label>
          <input class="input" id="log-reps" type="number" inputmode="numeric" min="1" max="100" step="1" value="${repsVal}" />
        </div>
      </div>
      <div class="field mt-s">
        <label for="log-rpe">RPE（这组有多难，6–10）</label>
        <select class="select" id="log-rpe">
          ${[6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10].map((n) => `<option value="${n}" ${Number(rpeVal) === n ? 'selected' : ''}>RPE ${n}</option>`).join('')}
        </select>
      </div>
      <div class="tiny muted mt-s" id="plate-preview" style="line-height:1.7"></div>
      <div class="tiny muted mt-s" style="line-height:1.7">
        ${last ? `上次：${last.weight}kg × ${last.reps}（估算 1RM ${e1rm(last.weight, last.reps)}）` : '这是第一次记这个动作。'}
        ${pr ? ` · 最好：${pr.weight}kg × ${pr.reps}（估算 1RM ${e1rm(pr.weight, pr.reps)}）` : ''}
        ${suggested ? `<br/><span style="color:var(--ochre);font-weight:700">本周建议 ${suggested}kg</span> · 第 ${ci.week.week} 周 ${Math.round(ci.week.loadPct * 100)}% 强度` : ''}
        ${auto ? `<br/><span style="color:var(--ink);font-weight:700">上次 RPE ${last.rpe} → 建议下次 ${auto.nextWeight}kg（${auto.reason}）</span>` : ''}
      </div>
      <div class="modal-foot" style="flex-wrap:wrap;gap:8px">
        <button class="btn btn-ghost" data-act="skip-weight" data-item="${itemId}">不记重量，只完成</button>
        <button class="btn btn-ghost" data-act="close-modal">取消</button>
        <button class="btn btn-primary" data-act="save-set-log" data-item="${itemId}" data-mark="1">保存并完成这组</button>
      </div>
    `, 'is-hand');
    setTimeout(() => $('#log-weight')?.focus(), 60);
    const updatePlate = () => {
      const el = $('#plate-preview');
      if (!el) return;
      const bar = getExercise(item.id)?.equipment?.includes('barbell');
      if (!bar) {
        el.textContent = '';
        return;
      }
      const w = Number($('#log-weight')?.value);
      const r = plateBreakdown(w, { bar: 20 });
      el.innerHTML = r.ok
        ? `🏋️ 杠铃片：每边 <b>${r.text === '空杆' ? '不加片' : esc(r.text)}</b>（空杆 20kg）`
        : `<span style="color:var(--cinnabar)">${esc(r.text)}${r.remainder ? `，还差 ${r.remainder}kg 凑不齐` : ''}</span>`;
    };
    $('#log-weight')?.addEventListener('input', updatePlate);
    updatePlate();
  }

  saveSetLog(itemId, markDone = true) {
    const item = this.state.plan?.sessions?.flatMap((s) => s.items).find((i) => i.id === itemId);
    const session = this.state.activeSession;
    const rawWeight = $('#log-weight')?.value;
    const rawReps = $('#log-reps')?.value;
    const entry = addSetLog(this.state, {
      date: this.todayKey,
      sessionIndex: session?.index ?? 0,
      exerciseId: itemId,
      exerciseName: item?.name || itemId,
      setIndex: (session?.doneSets?.[itemId] || 0) + 1,
      weight: Number(rawWeight),
      reps: Number(rawReps),
      rpe: Number($('#log-rpe')?.value) || null,
    });
    if (!entry) {
      this.toast('重量 0–500kg、次数 1–100 才算数。', this.coach.id);
      return;
    }
    this.save();
    this.closeModal();
    if (markDone) this.completeSet(itemId);
    else { this.renderView(); this.afterRender(); }
    this.toast(`记下了：${entry.weight}kg × ${entry.reps}`, this.coach.id);
    if (item && entry.rpe) {
      const rm = String(item.reps || '').match(/(\d+)\s*[–-]\s*(\d+)/);
      const rr = rm ? [Number(rm[1]), Number(rm[2])] : [8, 12];
      const next = suggestNextLoad({ weight: entry.weight, reps: entry.reps, rpe: entry.rpe, repRange: rr });
      if (next.delta !== 0) this.toast(`记下了：${entry.weight}kg × ${entry.reps} · 下次建议 ${next.nextWeight}kg（${next.reason}）`, this.coach.id);
    }
  }

  /** 当前周期信息：第几周、本周处方、整条周期 */
  cycleInfo() {
    const plan = this.state.plan;
    if (!plan) return null;
    const weeks = plan.cycleWeeks || 8;
    const cycle = buildCycle({ weeks, goal: plan.goal });
    const index = weekIndexFor(plan);
    return { cycle, index, week: cycle[index - 1] || cycle[0], summary: cycleSummary(cycle[index - 1] || cycle[0]) };
  }

  openCycleWeekModal(weekNo) {
    const info = this.cycleInfo();
    if (!info) return;
    const week = info.cycle[weekNo - 1];
    if (!week) return;
    const plan = this.state.plan;
    const applied = applyWeek(plan, week);
    const rows = plan.sessions.map((s, i) => {
      const base = s.items.reduce((a, it) => a + it.sets, 0);
      const now = applied.sessions[i].items.reduce((a, it) => a + it.sets, 0);
      return `<div class="row-between small" style="padding:4px 0;border-bottom:1px dashed var(--line)">
        <span>DAY ${i + 1} · ${esc(s.title.split(' · ')[0])}</span>
        <span class="muted">${base} 组 → <b style="color:var(--ink)">${now} 组</b></span>
      </div>`;
    }).join('');
    this.openModal(`
      <div class="modal-head">
        <div>
          <span class="eyebrow">周期处方 · 第 ${week.week} 周</span>
          <h2 style="margin-top:4px">${esc(week.label)}${week.isDeload ? ' · 减载' : ''}</h2>
          <p class="small muted">强度 ${Math.round(week.loadPct * 100)}% · 组数 ×${week.setsMult} · 目标 RPE ${week.rpe}</p>
        </div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      <div class="cue-box" style="margin-top:0">${esc(week.note)}</div>
      <div class="mini-title mt">这一周每天会变成</div>
      ${rows}
      <div class="tiny muted mt-s">应用后只改组数与 RPE 目标，不动动作与器械；随时可以再应用别的周。</div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-act="close-modal">先不应用</button>
        <button class="btn btn-primary" data-act="apply-cycle-week" data-week="${week.week}">应用第 ${week.week} 周处方</button>
      </div>
    `, 'is-hand');
  }

  /** 把已完成的组数夹到当前计划允许的范围，防止减载后出现 143% 完成率 */
  clampDoneSets(doneMap = {}, session) {
    const out = {};
    if (!session) return out;
    for (const item of session.items) {
      const n = Number(doneMap[item.id] || 0);
      out[item.id] = Math.max(0, Math.min(n, item.sets));
    }
    return out;
  }

  applyCycleWeek(weekNo) {
    const info = this.cycleInfo();
    if (!info) return;
    const week = info.cycle[weekNo - 1];
    if (!week) return;
    const applied = applyWeek(this.state.plan, week);
    this.state.plan.sessions = applied.sessions;
    this.state.plan.cycleWeek = week.week;
    const a = this.state.activeSession;
    if (a) {
      const session = this.state.plan.sessions[a.index];
      if (session) a.doneSets = this.clampDoneSets(a.doneSets, session);
    }
    this.save();
    this.closeModal();
    this.renderView();
    this.afterRender();
    this.toast(`已应用第 ${weekNo} 周处方：组数 ×${week.setsMult}，RPE ${week.rpe}。`, this.coach.id);
  }

  undoCycleWeek() {
    const plan = this.state.plan;
    if (!plan) return;
    const restored = restoreBase(plan);
    this.state.plan.sessions = restored.sessions;
    this.state.plan.cycleWeek = 1;
    const a = this.state.activeSession;
    if (a) {
      const session = this.state.plan.sessions[a.index];
      if (session) a.doneSets = this.clampDoneSets(a.doneSets, session);
    }
    this.save();
    this.renderView();
    this.afterRender();
    this.toast('已恢复基础组数与 RPE。', this.coach.id);
  }

  saveBookmark(text, coachId) {
    if (!text) return;
    const c = COACH_BY_ID[coachId] || this.coach;
    this.state.bookmarks = this.state.bookmarks || [];
    this.state.bookmarks.unshift({ id: uid('bm'), text, coachName: c.name, coachId: c.id, at: Date.now() });
    this.state.bookmarks = this.state.bookmarks.slice(0, 50);
    this.save();
    this.toast('记下来了，在进展页能翻到。', this.coach.id);
  }

  removeBookmark(id) {
    this.state.bookmarks = (this.state.bookmarks || []).filter((b) => b.id !== id);
    this.save();
    this.renderView();
    this.afterRender();
  }

  /* ---------- 五指山面板 ---------- */
  fingerCtx() {
    return {
      state: this.state,
      plan: this.state.plan,
      profile: this.state.profile,
      pet: this.state.pet ? petSummary(this.state.pet) : null,
      coach: this.coach,
      coaches: COACHES,
      sessionIndex: this.sessionIndex ?? 0,
      doneSets: this.currentDoneSets(),
      bookmarks: this.state.bookmarks,
    };
  }

  currentDoneSets() {
    const a = this.state.activeSession;
    if (!a) return 0;
    const session = this.state.plan?.sessions?.[a.index];
    if (!session) return 0;
    return session.items.reduce((x, i) => x + (a.doneSets[i.id] || 0), 0);
  }

  openFinger(origin = 'corner', opts = {}) {
    const zone = opts.zone || (this.view === 'adopt' ? 'pet' : this.view);
    this.fingerOrigin = origin;
    try {
      this.finger = buildFingers(zone, this.fingerCtx());
    } catch (e) {
      console.error(e);
      this.toast('五指山暂时伸不出来，稍后再试。', this.coach.id);
      return;
    }
    this.activeFinger = opts.finger || this.finger.fingers[0]?.finger || 'wu';
    this.openDrawer(opts.tab || 'fingers');
    this.renderFingerPane();
    this.switchDrawerTab(opts.tab || 'fingers');
    this.coachSays(this.finger.summary.lead, 0);
  }

  openDrawer(tab = 'fingers') {
    this.closeCoachDrawer();
    if ($('#drawer').hidden) this._drawerReturn = document.activeElement;
    $('#drawer-scrim').hidden = false;
    const d = $('#drawer');
    d.hidden = false;
    d.classList.remove('is-closing');
    $('#drawer-heading').textContent = '五指山';
    $('#drawer-sub').textContent = this.finger ? `${this.finger.summary.lead} · ${this.coach.name}` : '';
    document.body.style.overflow = 'hidden';
    setTimeout(() => { if (!$('#drawer').hidden) $('#drawer-close')?.focus(); }, 60);
    this.syncBackground();
  }

  closeDrawer() {
    const d = $('#drawer');
    if (!d || d.hidden) return;
    d.classList.add('is-closing');
    $('#drawer-scrim').hidden = true;
    setTimeout(() => {
      d.hidden = true;
      d.classList.remove('is-closing');
      this.restoreFocus(this._drawerReturn);
      this._drawerReturn = null;
      this.syncBackground();
    }, 220);
    document.body.style.overflow = '';
  }

  switchDrawerTab(tab) {
    this.chatMode = tab;
    $$('.dtab').forEach((b) => b.classList.toggle('is-active', b.dataset.dtab === tab));
    $('#pane-fingers').hidden = tab !== 'fingers';
    $('#pane-chat').hidden = tab !== 'chat';
    if (tab === 'chat') this.renderChatPane();
  }

  renderFingerPane() {
    const f = this.finger;
    if (!f) return;
    $('#hand-visual').innerHTML = handSVG(this.activeFinger, 224);
    $('#hand-fingers-nav').innerHTML = FINGERS.map((def) => {
      const item = f.fingers.find((x) => x.finger === def.key);
      const on = this.activeFinger === def.key;
      return `<button class="hf-nav ${on ? 'is-on' : ''}" data-hf="${def.key}">
        <span class="hfn-char" style="color:${def.color}">${def.label}</span>
        <span class="hfn-name">${def.name}</span>
      </button>`;
    }).join('');
    $('#drawer-sub').textContent = `${f.summary.lead} · ${f.coach.name}`;
    this.renderFingerDetail();
    this.renderOthers();
    $$('.hand-svg .finger').forEach((node) => {
      node.addEventListener('click', () => {
        if (node.dataset.finger !== 'thumb') {
          this.selectFinger(node.dataset.finger);
        }
      });
    });
  }

  selectFinger(key) {
    this.activeFinger = key;
    const svg = $('#hand-visual svg');
    if (svg) {
      svg.querySelectorAll('.finger').forEach((n) => n.classList.toggle('is-active', n.dataset.finger === key));
    }
    $$('.hf-nav').forEach((n) => n.classList.toggle('is-on', n.dataset.hf === key));
    this.renderFingerDetail();
  }

  renderFingerDetail() {
    const f = this.finger;
    const item = f?.fingers.find((x) => x.finger === this.activeFinger) || f?.fingers[0];
    const host = $('#finger-detail');
    if (!item) { host.innerHTML = ''; return; }
    const sevLabel = { high: '建议立刻处理', mid: '值得改', low: '顺手优化', info: '参考', gain: '可以更好' }[item.severity] || '';
    host.innerHTML = `
      <div class="fd-head">
        <span class="fd-char" style="background:${item.color}">${item.label}</span>
        <div>
          <div class="fd-title">${esc(item.title)}</div>
          <div class="fd-sub">${esc(item.fingerName)} · ${esc(sevLabel)}</div>
        </div>
      </div>
      <div class="fd-body">${esc(item.body)}</div>
      <div class="fd-why">${esc(item.why)}</div>
      <div class="fd-coach">
        <div class="fd-coach-avatar">${coachSVG(this.coach.id, 30)}</div>
        <div class="fd-coach-text"><span class="fd-coach-name">${esc(this.coach.name)}</span>${esc(item.coachNote)}</div>
      </div>
      ${item.petNote ? `<div class="fd-pet-note">🐾 <span>${esc(item.petNote)}</span></div>` : ''}
      <div class="fd-foot">
        ${item.action ? `<button class="btn btn-primary btn-sm" data-act="finger-apply">${esc(item.action.label)} →</button>` : `<span class="tiny muted">这条不需要动手，知道就够了。</span>`}
        <button class="btn btn-ghost btn-sm" data-act="finger-ask">问${esc(this.coach.name)}</button>
        <button class="btn btn-ghost btn-sm" data-act="finger-explore">还有别的改法</button>
      </div>`;
  }

  renderOthers() {
    const others = previewOthers(this.view, this.fingerCtx());
    $('#others-list').innerHTML = others.map(({ coach, line }) => `
      <button class="other-row" data-act="switch-coach" data-coach="${coach.id}">
        <span class="or-avatar">${coachSVG(coach.id, 32)}</span>
        <span>
          <span class="or-name">${esc(coach.name)} <span class="tiny muted" style="font-weight:400">${esc(coach.title)}</span></span>
          <span class="or-line">“${esc(line)}”</span>
        </span>
        <span class="or-go">换他 →</span>
      </button>`).join('');
  }

  applyActiveFinger() {
    const item = this.finger?.fingers.find((x) => x.finger === this.activeFinger);
    if (!item?.action) return;
    const keysBefore = this.state.pet?.bond;
    const res = applyFingerAction(item.action, this);
    if (!res) return;
    if (res.nav) {
      if (res.nav.view) this.go(res.nav.view);
      else if (res.nav.selector) {
        this.closeDrawer();
        const node = document.querySelector(res.nav.selector);
        if (node) node.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return;
    }
    if (res.msg) this.toast(res.msg, this.coach.id);
    if (res.refresh) {
      this.closeDrawer();
      this.renderView();
      this.afterRender();
    }
  }

  renderChatPane() {
    $('#chat-coach-row').innerHTML = COACHES.map((c) => `
      <button class="chat-coach-pill ${c.id === this.coach.id ? 'is-on' : ''}" data-act="switch-coach" data-coach="${c.id}">
        ${coachSVG(c.id, 24)}<span>${esc(c.name)}</span>
      </button>`).join('');
    const log = $('#chat-log');
    const chat = this.state.chat || [];
    if (!chat.length) {
      log.innerHTML = `<div class="msg"><div class="m-avatar">${coachSVG(this.coach.id, 28)}</div><div class="m-bubble">
        <span class="m-name">${esc(this.coach.name)}</span>
        ${esc(phrase(this.coach, 'open', 0))}想问什么直接说。${this.finger ? '也可以先看左边那五根手指。' : ''}
      </div></div>`;
    } else {
      log.innerHTML = chat.slice(-30).map((m) => m.role === 'me'
        ? `<div class="msg me"><div class="m-bubble">${esc(m.text)}</div></div>`
        : `<div class="msg"><div class="m-avatar">${coachSVG(m.coachId || this.coach.id, 28)}</div><div class="m-bubble">
            <span class="m-name">${esc(COACH_BY_ID[m.coachId]?.name || this.coach.name)}</span>${esc(m.text)}
            <div class="m-tools"><button class="m-tool" data-act="save-bookmark" data-text="${esc(m.text)}" data-coach="${m.coachId || this.coach.id}">记一条</button></div>
          </div></div>`).join('');
    }
    log.scrollTop = log.scrollHeight;
    $('#chat-chips').innerHTML = (this.lastSuggestions || ['胸怎么练？', '一周练几次？', `帮我看看${this.state.pet ? this.state.pet.name : '我的宠物'}`])
      .map((q) => `<button class="chip-q" data-act="chat-q" data-q="${esc(q)}">${esc(q)}</button>`).join('');
  }

  pushChat(entry) {
    this.state.chat = this.state.chat || [];
    this.state.chat.push(entry);
    if (this.state.chat.length > 200) this.state.chat = this.state.chat.slice(-200);
    return this.state.chat;
  }

  /** 最近一条教练回复的话题，用于多轮指代 */
  lastChatTopic() {
    const chat = this.state.chat || [];
    for (let i = chat.length - 1; i >= 0; i--) {
      if (chat[i].role === 'coach' && chat[i].topic) return chat[i].topic;
    }
    return null;
  }

  sendChat(text) {
    this.switchDrawerTab('chat');
    const ctx = { ...this.fingerCtx(), coach: this.coach, pet: this.state.pet, lastTopic: this.lastChatTopic() };
    this.state.chat = this.state.chat || [];
    this.pushChat({ role: 'me', text, at: Date.now() });
    let reply;
    try {
      reply = chatReply(text, ctx);
    } catch (e) {
      console.error(e);
      reply = { text: '我刚才走神了，你再说一遍？', suggestions: ['一周练几次？', '减脂怎么吃'] };
    }
    if (!reply) reply = { text: '再说一遍？', suggestions: [] };
    setTimeout(() => {
      this.pushChat({ role: 'coach', text: reply.text, coachId: this.coach.id, topic: reply.topic || null, at: Date.now() });
      this.lastSuggestions = reply.suggestions;
      this.save();
      if (this.chatMode === 'chat') this.renderChatPane();
    }, 420);
    this.renderChatPane();
    this.save();
  }

  /* ---------- 教练 ---------- */
  switchCoach(id) {
    const c = COACH_BY_ID[id];
    if (!c) return;
    this.coach = c;
    this.state.coachId = id;
    this.save();
    this.updateChrome();
    this.closeCoachDrawer();
    if (this.finger) {
      this.openFinger(this.fingerOrigin || 'corner', { zone: this.view === 'adopt' ? 'pet' : this.view });
    }
    if (this.view === 'coach') {
      this.renderView();
      this.afterRender();
    }
    this.toast(`现在是${c.name}教你。语气变了，建议还是同一套。`, c.id);
    this.coachSays(c.voice.open[0] + '又见面了。', 8000);
  }

  openCoachList() {
    if ($('#coach-drawer').hidden) this._coachReturn = document.activeElement;
    const host = $('#coach-list');
    host.innerHTML = COACHES.map((c) => `
      <button class="coach-opt ${c.id === this.coach.id ? 'is-on' : ''}" data-act="switch-coach" data-coach="${c.id}">
        <div class="co-face">${coachSVG(c.id, 46)}</div>
        <div class="co-main">
          <div class="co-name">${esc(c.name)} <span class="co-title">${esc(c.title)}</span></div>
          <div class="co-bio">${esc(c.bio)}</div>
          <div class="co-tags">${c.focus.map((f) => `<span class="pill ghost" style="font-size:10px">${esc(f)}</span>`).join('')}</div>
        </div>
        <div class="co-check">${c.id === this.coach.id ? '✓' : ''}</div>
      </button>`).join('');
    $('#coach-scrim').hidden = false;
    $('#coach-drawer').hidden = false;
    document.body.style.overflow = 'hidden';
    $$('#coach-list [data-act="switch-coach"]').forEach((n) => n.addEventListener('click', () => this.switchCoach(n.dataset.coach)));
    setTimeout(() => { if (!$('#coach-drawer').hidden) $('#coach-drawer-close')?.focus(); }, 60);
    this.syncBackground();
  }

  closeCoachDrawer() {
    const wasOpen = !($('#coach-drawer')?.hidden ?? true);
    const scrim = $('#coach-scrim');
    const drawer = $('#coach-drawer');
    if (scrim) scrim.hidden = true;
    if (drawer) drawer.hidden = true;
    if (($('#drawer')?.hidden ?? true) && !$('#modal-root').innerHTML) document.body.style.overflow = '';
    if (wasOpen) {
      this.restoreFocus(this._coachReturn);
      this._coachReturn = null;
    }
    this.syncBackground();
  }

  toggleAnno(fromDrawer = false) {
    this.annoOpen = !this.annoOpen;
    document.body.classList.toggle('anno-on', this.annoOpen);
    $('#anno-toggle')?.setAttribute('aria-pressed', String(this.annoOpen));
    if (fromDrawer) this.closeDrawer();
    this.afterRender();
    this.toast(this.annoOpen ? '标出来的地方都能改，点一下就让教练伸手。' : '标注关了。', this.coach.id);
  }

  /* ---------- 弹层 ---------- */
  openModal(html, cls = '') {
    this._modalReturn = document.activeElement;
    $('#modal-root').innerHTML = `<div class="modal-wrap"><div class="modal-scrim" data-act="close-modal"></div><div class="modal ${cls}">${html}</div></div>`;
    hydrateEmojiIcons($('#modal-root'));
    document.body.style.overflow = 'hidden';
    $$('#modal-root [data-act="close-modal"]').forEach((n) => n.addEventListener('click', () => this.closeModal()));
    const modal = $('#modal-root .modal');
    if (modal) {
      modal.addEventListener('keydown', (e) => trapFocus(e, modal));
      setTimeout(() => { const f = getFocusable(modal)[0]; if (f) f.focus(); }, 0);
    }
    this.syncBackground();
  }

  closeModal() {
    const had = Boolean($('#modal-root')?.innerHTML);
    $('#modal-root').innerHTML = '';
    if (this._photoModalUrl) {
      URL.revokeObjectURL(this._photoModalUrl);
      this._photoModalUrl = null;
    }
    (this._compareUrls || []).forEach((u) => URL.revokeObjectURL(u));
    this._compareUrls = [];
    document.body.style.overflow = '';
    // 清理残留的模态事件
    if (!$('#drawer')?.hidden) document.body.style.overflow = 'hidden';
    if (had) {
      this.restoreFocus(this._modalReturn);
      this._modalReturn = null;
    }
    this.syncBackground();
  }

  restoreFocus(el) {
    if (!el || !el.isConnected || typeof el.focus !== 'function') return;
    if (el.closest('[aria-hidden="true"]')) return;
    try { el.focus(); } catch (e) { /* 忽略 */ }
  }

  /** 打开任何层时把背后内容从读屏树里移除 */
  syncBackground() {
    const anyOpen = !($('#drawer')?.hidden ?? true) || Boolean($('#modal-root')?.innerHTML) || !($('#coach-drawer')?.hidden ?? true);
    for (const sel of ['#view', '.topbar', '#tabbar', '#coach-corner']) {
      const el = $(sel);
      if (!el) continue;
      if (anyOpen) el.setAttribute('aria-hidden', 'true');
      else el.removeAttribute('aria-hidden');
    }
  }

  announceTimer(text) {
    const el = $('#timer-live');
    if (el) el.textContent = text;
  }

  announceRestCountdown() {
    this.announceTimer(`还剩 ${Math.max(0, this.timer.left)} 秒`);
  }

    this.openModal(`

        <div>

          <h2 style="margin-top:4px">${esc(session.title)}</h2>

            <div class="small muted">${ratio >= 80 ? '它今天很满意。' : '没做完它也认，来了就算。'} 它现在的方向是「${esc(PET_BY_ID[pet.typeId].directionName)}」。</div>
          </div>
        </div>
      </div>` : ''}
      <div class="fd-coach mt">

  finishLine(ratio) {
    const style = this.coach.style;
    if (ratio >= 90) return { roast: '不错，全做完了。明天别装死。', science: '完成度达标，负荷维持，观察恢复。', warm: '你今天做到了，我真的很开心。', drill: '任务完成，合格。' }[style];
    if (ratio >= 60) return { roast: '做了大半，还行。缺的那几组，明天补不补？', science: '完成度略低，建议减少辅助动作以保住主项。', warm: '做得挺好的，剩下的下次再来。', drill: '完成度不足，下次补齐。' }[style];
    return { roast: '这就结束了？我不骂你了，明天继续。', science: '完成度偏低但已记录，比零好。', warm: '来就好，真的。下一次我们多做一组。', drill: '记录在案。下次补。' }[style];
  }

  openOnboarding() {
    if ($('#modal-root').innerHTML) return;
    this.openModal(`
      <div class="onboard">
        <h2>先认识一下：你是哪种练法</h2>
        <p class="ob-sub">六步，一分钟。身体数据可跳过，答完 ${esc(this.coach.name)} 替你排一份。</p>
        <div id="ob-body"></div>
        <div class="ob-dots" id="ob-dots"></div>
        <div class="modal-foot">
          <button class="btn btn-ghost" data-act="close-modal">我随便看看</button>
          <button class="btn btn-primary" data-act="ob-next">下一步 →</button>
        </div>
      </div>
    `);
    this.obStep = 0;
    this.renderObStep();
  }

  obNext() {
    if (this.obStep < 5) {
      this.obStep += 1;
      this.renderObStep();
      return;
    }
    this.state.profile.onboarded = true;
    this.generatePlan();
    this.closeModal();
  }

  renderObStep() {
    const p = this.state.profile;
    const body = $('#ob-body');
    const dots = $('#ob-dots');
    const steps = [
      {
        title: '第一步：目标',
        html: `<div class="ob-options">${Object.entries(GOALS).map(([k, g]) => `<button class="opt-card ${p.goal === k ? 'is-on' : ''}" data-pick="goal" data-val="${k}"><span class="opt-emoji">${g.icon}</span><span class="opt-title">${g.label}</span><span class="opt-desc">${g.blurb}</span></button>`).join('')}</div>`,
      },
      {
        title: '第二步：水平',
        html: `<div class="ob-options">${Object.entries(LEVELS).map(([k, l]) => `<button class="opt-card ${p.level === k ? 'is-on' : ''}" data-pick="level" data-val="${k}"><span class="opt-title">${l.label}</span><span class="opt-desc">${l.months}</span></button>`).join('')}</div>`,
      },
      {
        title: '第三步：一周几次，一次多久',
        html: `<div class="seg" style="margin-bottom:16px">${[2, 3, 4, 5, 6].map((d) => `<button class="seg-opt ${p.days === d ? 'is-on' : ''}" data-pick="days" data-val="${d}">${d} 天</button>`).join('')}</div>
          <div class="field"><label>单次时长 <b id="min-val">${p.minutes} 分钟</b></label><input type="range" min="20" max="90" step="5" value="${p.minutes}" data-range="minutes" /></div>`,
      },
      {
        title: '第四步：身体数据（可跳过）',
        html: `<p class="small muted mb">用来估算热量与蛋白目标，不改变训练动作。</p>
          <div class="ob-body-grid">
            <label class="field"><span>身高 cm</span><input class="input" type="number" data-ob-body="heightCm" value="${p.body?.heightCm ?? ''}" placeholder="175" /></label>
            <label class="field"><span>体重 kg</span><input class="input" type="number" data-ob-body="weightKg" value="${p.body?.weightKg ?? ''}" placeholder="70" /></label>
            <label class="field"><span>年龄</span><input class="input" type="number" data-ob-body="age" value="${p.body?.age ?? ''}" placeholder="25" /></label>
            <label class="field"><span>性别</span><select class="select" data-ob-body="sex"><option value="male" ${p.body?.sex !== 'female' ? 'selected' : ''}>男</option><option value="female" ${p.body?.sex === 'female' ? 'selected' : ''}>女</option></select></label>
          </div>
          <div class="ob-body-hint" id="ob-body-hint"></div>`,
      },
      {
        title: '第五步：挑一只宠物',
        html: `<p class="small muted mb">它会绑定你的训练方向，也会影响教练给你的建议。</p>
          <div class="ob-pet-options">${PETS.map((x) => `<button class="pet-pick ${this.adoptPick === x.id ? 'is-on' : ''}" data-act="pick-pet" data-pet="${x.id}" style="padding:10px">
            ${petMini(x.id, null, 72)}<div class="pp-name" style="font-size:13px">${esc(x.name)}</div><div class="pp-species" style="font-size:10.5px">${esc(x.directionName)}</div>
          </button>`).join('')}</div>`,
      },
      {
        title: '第六步：计划预览',
        html: (() => {
          const preview = generatePlan({ ...p, petId: this.adoptPick });
          const bs = bodySummary(p);
          return `<div class="ob-preview">
            <div class="ob-preview-row"><span>目标</span><b>${esc(GOALS[p.goal].label)} · ${esc(LEVELS[p.level].label)}</b></div>
            <div class="ob-preview-row"><span>频率</span><b>每周 ${p.days} 练 · 单次 ${p.minutes} 分钟</b></div>
            <div class="ob-preview-row"><span>分化</span><b>${esc(preview.splitName)} · ${preview.sessions.length} 天</b></div>
            ${bs.ok ? `<div class="ob-preview-row"><span>热量目标</span><b>${bs.calories} kcal · 蛋白 ${bs.protein}g</b></div>` : '<div class="ob-preview-row"><span>身体目标</span><b>未填，可稍后在计划页补</b></div>'}
            <div class="ob-preview-days">${preview.sessions.map((s, i) => `<div><span>DAY ${i + 1}</span>${esc(s.title)} · ${s.items.length} 个动作</div>`).join('')}</div>
          </div><p class="tiny muted">生成后可在「计划页 → 编辑计划」继续调整动作与组数。</p>`;
        })(),
      },
    ];
    const step = steps[this.obStep];
    body.innerHTML = `<h3 style="font-size:16px;margin-bottom:12px">${step.title}</h3>${step.html}`;
    dots.innerHTML = steps.map((_, i) => `<span class="ob-dot ${i === this.obStep ? 'is-on' : ''}"></span>`).join('');
    $$('#ob-body [data-pick]').forEach((n) => n.addEventListener('click', () => {
      this.pickProfile(n.dataset.pick, n.dataset.val);
      this.renderObStep();
      if (n.dataset.pick === 'goal' && this.obStep === 0) {
        this.state.profile.onboarded = true;
      }
    }));
    $$('#ob-body [data-act="pick-pet"]').forEach((n) => n.addEventListener('click', () => {
      this.adoptPick = n.dataset.pet;
      this.renderObStep();
    }));
    const range = $('#ob-body input[type="range"]');
    if (range) {
      const upd = () => {
        const pct = ((range.value - range.min) / (range.max - range.min)) * 100;
        range.style.setProperty('--fill', pct + '%');
        const v = $('#min-val');
        if (v) v.textContent = `${range.value} 分钟`;
        this.state.profile.minutes = Number(range.value);
      };
      upd();
      range.addEventListener('input', upd);
    }
    $$('#ob-body [data-ob-body]').forEach((inp) => {

        const body = { ...(this.state.profile.body || {}) };

        this.state.profile = { ...this.state.profile, body };
        this.save();
        this.renderObStep();
      });
    });
    const next = $('#modal-root [data-act="ob-next"]');
    if (next) next.textContent = this.obStep === 5 ? '生成计划，开始' : '下一步 →';
  }

  confirmReset() {
    this.openModal(`
      <div class="modal-head">
        <div><span class="eyebrow">危险操作</span><h2>清空全部数据？</h2></div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      <p class="small" style="color:var(--ink-2);line-height:1.7">计划、宠物、训练记录、对话、收藏都会被删掉，不能恢复。建议先导出。</p>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-act="close-modal">算了</button>
        <button class="btn" style="background:var(--cinnabar);color:#fff" data-act="do-reset">确认清空</button>
      </div>
    `);
    $$('#modal-root [data-act="do-reset"]').forEach((n) => n.addEventListener('click', async () => {
      try { await Promise.all([clearPhotos(), clearTracks()]); } catch (e) { /* 本地库可能不可用 */ }
      resetState();
      location.reload();
    }));
  }

  pickImportFile() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.addEventListener('change', async () => {
      const file = input.files?.[0];
      if (!file) return;
      let raw;
      try {
        raw = JSON.parse(await file.text());
      } catch (e) {
        this.toast('读取失败：这不是一个有效的 JSON 文件。', this.coach.id);
        return;
      }
      const preview = validateBackup(raw);
      if (!preview.ok) {
        this.toast(`备份不合法：${preview.errors[0]}`, this.coach.id);
        return;
      }
      this._pendingImport = raw;
      this.openModal(`
        <div class="modal-head">
          <div><span class="eyebrow">导入备份</span><h2 style="margin-top:4px">覆盖当前数据？</h2></div>
          <button class="icon-btn" data-act="close-modal">✕</button>
        </div>
        <p class="small" style="color:var(--ink-2);line-height:1.7">
          将用备份替换当前计划、宠物、训练记录与收藏。当前已有 <b>${this.state.totalSessions || 0}</b> 次训练记录，导入后不可撤销。
        </p>
        <div class="cue-box">备份文件校验通过：${preview.state.plan ? '含计划' : '无计划'} · ${(preview.state.setLogs || []).length} 组重量记录 · 教练 ${esc(preview.state.coachId || 'tanshi')}</div>
        <div class="modal-foot">
          <button class="btn btn-ghost" data-act="close-modal">取消</button>
          <button class="btn btn-primary" data-act="confirm-import">确认导入</button>
        </div>
      `);
    });
    input.click();
  }

  importBackup(raw) {
    const v = validateBackup(raw);
    if (!v.ok) {
      this.toast(`备份不合法：${v.errors[0]}`, this.coach.id);
      return v;
    }
    this.state = markExported({ ...v.state, activeSession: null }, Date.now());

__defs["js/autoreg.js"] = function (module, exports, __require) {
/** RPE 自动调节（P7）：根据上一组 RPE 与完成次数，给下次重量建议 */
const STEP = 2.5;

function roundTo(w, step = STEP) {
  return Math.max(0, Math.round(w / step) * step);
}

/**
 * @param {{weight:number,reps:number,rpe:number,repRange?:number[]}} input
 * @returns {{nextWeight:number, delta:number, reason:string}}
 */
function suggestNextLoad({ weight, reps, rpe, repRange = [8, 12] } = {}) {
  const w = Number(weight) || 0;
  const r = Number(reps) || 0;
  const effort = Number(rpe) || 0;
  if (w <= 0) return { nextWeight: 0, delta: 0, reason: '徒手动作，不加片' };

  if (effort >= 9.5) {
    const next = roundTo(w * 0.95);
    return { nextWeight: next, delta: Math.round((next - w) * 100) / 100, reason: 'RPE 9.5+，降 5% 再练' };
  }
  if (effort >= 9) {
    const next = roundTo(w - STEP);
    return { nextWeight: next, delta: Math.round((next - w) * 100) / 100, reason: 'RPE 9，降一片' };
  }
  const upper = Array.isArray(repRange) && repRange.length >= 2 ? Number(repRange[1]) : 12;
  if (effort > 0 && effort <= 7 && r >= upper) {
    const next = roundTo(w + STEP);
    return { nextWeight: next, delta: Math.round((next - w) * 100) / 100, reason: 'RPE 有余量且达到次数上限，加一片' };
  }
  return { nextWeight: roundTo(w), delta: Math.round((roundTo(w) - w) * 100) / 100, reason: '维持当前重量' };
}


Object.assign(module.exports, { suggestNextLoad });
};

/**
 * 本地备份提醒（P2.5）
 * 纯函数：只回答「现在该不该提醒」，不碰 DOM / localStorage。
 */

const BACKUP_SESSIONS = 20;
const BACKUP_DAYS = 30;
const DAY = 86400000;

/**
 * @param {object} state 存档（只用 totalSessions / backup）
 * @param {number} now 可注入时间，便于测试
 * @returns {{due:boolean, reason:'sessions'|'days'|null, sessionsSince:number, daysSince:number|null}}
 */
function backupStatus(state = {}, now = Date.now()) {
  const total = Number(state.totalSessions) || 0;
  const b = state.backup || {};
  const last = Number(b.lastExportAt) || 0;
  const atExport = Number(b.sessionsAtExport) || 0;
  const sessionsSince = Math.max(0, total - atExport);
  const daysSince = last ? Math.floor((now - last) / DAY) : null;

  // 新用户前 5 次不打扰
  if (total < 5) return { due: false, reason: null, sessionsSince, daysSince };
  if (sessionsSince >= BACKUP_SESSIONS) return { due: true, reason: 'sessions', sessionsSince, daysSince };
  if (last && daysSince >= BACKUP_DAYS) return { due: true, reason: 'days', sessionsSince, daysSince };
  return { due: false, reason: null, sessionsSince, daysSince };
}

/** 标记「刚导出过」，返回副本 */
function markExported(state = {}, now = Date.now()) {
  return {
    ...state,
    backup: { lastExportAt: now, sessionsAtExport: Number(state.totalSessions) || 0 },
  };
}

  if (session.items.some((it) => it.id === ex.id)) return { plan, added: false, msg: '这一天已经有这个动作' };
  session.items.push(itemFromExercise(ex));

}

      rest: String(it.rest || '90s').trim().slice(0, 20),

/** 数据闭环（P23）：体重趋势 × 训练容量，纯函数 */
function mondayKey(date) {

      const row = rows[i];

  H: ['腰先弯，背没锁住', '杠铃离身体太远', '起身时臀部先抬'],
  C: ['塌腰，腰替腹肌干活', '憋气到头晕', '脖子前伸'],
  K: ['一上来冲太快，后程掉速', '步幅过大，落地砸膝', '全程憋气'],
  M: ['弹震式拉伸', '拉到疼还继续', '训练前长时间静态拉伸'],
};

function fallbackMistake(ex) {
  if (ex.joint === 'shoulder') return ['肩关节没对准，耸肩代偿', '动作幅度过大，关节先累'];
  if (ex.joint === 'knee') return ['膝盖内扣', '重心不稳，脚掌离地'];
  if (ex.joint === 'elbow') return ['肘部锁死', '借惯性甩重量'];
  return ['动作太快，失去控制', '重量优先于动作质量'];
}

function exerciseDetail(id, setLogs = [], { limit = 4 } = {}) {
  const ex = getExercise(id);
  if (!ex) return null;
  const history = historyFor(setLogs, id);
  const pr = bestSetFor(setLogs, id);
  const recent = history.slice(-5).reverse();
  const alternatives = EXERCISES.filter((e) => e.id !== id
    && e.pattern === ex.pattern
    && (e.muscles || []).some((m) => (ex.muscles || []).includes(m))
    && (e.equipment || []).some((eq) => (ex.equipment || []).includes(eq)))
    .sort((a, b) => Math.abs((a.level || 1) - (ex.level || 1)) - Math.abs((b.level || 1) - (ex.level || 1)))
    .slice(0, limit)
    .map((e) => ({ id: e.id, name: e.name, level: e.level, equipment: e.equipment }));
  return {
    exercise: ex,
    cue: ex.tags?.join(' · ') || '动作质量优先于重量。',
    mistakes: MISTAKES[ex.pattern] || fallbackMistake(ex),
    alternatives,
    pr: pr ? { ...pr, e1rm: e1rm(pr.weight, pr.reps) } : null,
    recent,
    sets: history.length,
    volume: history.reduce((sum, e) => sum + (Number(e.weight) || 0) * (Number(e.reps) || 0), 0),
  };
}


Object.assign(module.exports, { exerciseDetail });
};
