/**
 * 键盘快捷键（P1）
 *
 * 纯函数：给定按键事件与上下文，返回动作名；不碰 DOM。
 * 原则：输入框不劫持、弹层打开时不穿透、Esc 永远关最上层。
 */

const FINGER_KEYS = ['wu', 'shan', 'xiang', 'xi', 'xin'];

const SHORTCUT_LIST = [
  { key: '空格', desc: '训练页：开始 / 暂停组间计时' },
  { key: '1 – 5', desc: '五指山抽屉内：切换武 / 山 / 相 / 息 / 心' },
  { key: 'N', desc: '训练页：跳到下一组未完成的动作' },
  { key: '/', desc: '打开教练对话' },
  { key: 'A', desc: '显示 / 隐藏「这里能改」标注' },
  { key: '?', desc: '打开这张快捷键表' },
  { key: 'Esc', desc: '关闭最上层弹层 / 抽屉' },
];

/**
 * @param {{key:string, shift?:boolean, ctrl?:boolean, meta?:boolean, alt?:boolean}} e
 * @param {{inEditable:boolean, view:string, drawerOpen:boolean, modalOpen:boolean, hasPlan:boolean, activeSession:boolean}} ctx
 * @returns {string|null} 动作名
 */
function resolveShortcut(e, ctx) {
  const key = e.key;
  const mod = Boolean(e.ctrlKey || e.metaKey || e.altKey || e.ctrl || e.meta || e.alt);
  const shift = Boolean(e.shiftKey || e.shift);
  if (mod) return null;

  // 输入中：只允许 Esc 关闭
  if (ctx.inEditable) return key === 'Escape' ? 'close-layer' : null;

  // 弹层：只允许 Esc，避免空格误触背后计时器
  if (ctx.modalOpen) return key === 'Escape' ? 'close-layer' : null;

  if (key === 'Escape') return ctx.drawerOpen ? 'close-layer' : null;

  // “?” 在不同键盘布局下可能是 key='?'，也可能是 Shift+/（code=Slash）
  if (key === '?' || ((key === '/' || e.code === 'Slash') && shift)) return 'open-shortcuts';
  if (key === '/') return 'open-chat';
  if (key === 'a' || key === 'A') return 'toggle-anno';

  // 抽屉打开时数字键切手指
  if (ctx.drawerOpen) {
    const idx = Number(key) - 1;
    if (Number.isInteger(idx) && idx >= 0 && idx < FINGER_KEYS.length) return `finger:${FINGER_KEYS[idx]}`;
    return null;
  }

  // 训练页专属
  if (ctx.view === 'train' && ctx.activeSession) {
    if (key === ' ') return 'timer-toggle';
    if (key === 'n' || key === 'N') return 'next-set';
  }

  return null;
}

/* 存储与状态 */
const KEY = 'wuzhishan_tanshi_v1';

const DEFAULT_PROFILE = {
  goal: 'muscle',

  days: 3,
  minutes: 45,
  equipment: ['none', 'mat', 'dumbbell'],

}

  return {
    version: 1,
    profile: { ...DEFAULT_PROFILE },
    plan: null,
    pet: null,
    coachId: 'tanshi',
    sessions: {},        // 日期 → {sessionKey, doneSets, totalSets, ratio, minutes}
    setLogs: [],         // 每组重量×次数记录（P1）
    streak: 0,
    bestStreak: 0,
    lastTrainedDate: null,
    totalSessions: 0,
    weekSessions: 0,
    weekStart: startOfWeek(),
    bookmarks: [],
    chat: [],            // {role, coachId, text, at}
    backup: { lastExportAt: 0, sessionsAtExport: 0 },
    settings: { anno: false, sound: false },
    activeSession: null, // {index, date, doneSets:{itemId:count}}
    seenTips: [],
    createdAt: Date.now(),
  };
}

function migrate(s) {
  const base = freshState();
  const merged = {
    ...base,
    ...s,
    profile: { ...base.profile, ...(s.profile || {}) },
    settings: { ...base.settings, ...(s.settings || {}) },
    bookmarks: Array.isArray(s.bookmarks) ? s.bookmarks : [],
    chat: Array.isArray(s.chat) ? s.chat : [],
    setLogs: Array.isArray(s.setLogs) ? s.setLogs : [],
    backup: { ...base.backup, ...(s.backup || {}) },
  };
  return merged;
}

/**
 * 校验一份备份能否安全导入。
 * 坏文件必须拒绝，以免把现有好数据冲掉；可纠正的脏字段（数组变字符串等）自动纠正。
 * @returns {{ok:boolean, state?:object, errors:string[]}}
 */
function validateBackup(raw) {
  const errors = [];
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
    return { ok: false, errors: ['备份必须是一个 JSON 对象'] };
  }
  const known = ['profile', 'plan', 'pet', 'sessions', 'setLogs', 'bookmarks', 'chat', 'coachId', 'version', 'streak', 'totalSessions'];
  if (!known.some((k) => Object.prototype.hasOwnProperty.call(raw, k))) {
    return { ok: false, errors: ['没有可识别的存档字段'] };
  }
  if (raw.profile !== undefined && (typeof raw.profile !== 'object' || raw.profile === null || Array.isArray(raw.profile))) {
    errors.push('profile 结构不正确');
  }
  if (raw.plan !== undefined && raw.plan !== null) {
    if (typeof raw.plan !== 'object' || Array.isArray(raw.plan) || !Array.isArray(raw.plan.sessions)) errors.push('plan 结构不正确');
  }
  if (raw.sessions !== undefined && (typeof raw.sessions !== 'object' || raw.sessions === null || Array.isArray(raw.sessions))) {
    errors.push('sessions 结构不正确');
  }
  if (raw.pet !== undefined && raw.pet !== null && (typeof raw.pet !== 'object' || Array.isArray(raw.pet))) {
    errors.push('pet 结构不正确');
  }
  if (errors.length) return { ok: false, errors };
  try {
    const copy = JSON.parse(JSON.stringify(raw));
    return { ok: true, state: migrate(copy), errors: [] };
  } catch (e) {
    return { ok: false, errors: ['备份无法解析：' + e.message] };
  }
}

function saveState(state) {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    return true;
  } catch (e) {

    return false;

  const date = new Date(d);
  date.setHours(0, 0, 0, 0);

  date.setDate(date.getDate() - day);
  return date.getTime();
}

function todayKey(d = new Date()) {
  const date = new Date(d);

}

function daysBetween(a, b) {
  return Math.round((new Date(b).setHours(0, 0, 0, 0) - new Date(a).setHours(0, 0, 0, 0)) / 86400000);
}

function uid(prefix = 'id') {

      </div>

          <button class="btn btn-sm btn-ghost" data-act="reset-data" style="color:var(--cinnabar)">清空全部数据</button>
        </div>
      </div>
    </div>
  </div>`;
}

function heatmapData(state, weeksCount) {
  const sessions = state.sessions || {};
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  const start = new Date(today);
  start.setDate(start.getDate() - ((weeksCount - 1) * 7 + ((start.getDay() + 6) % 7)));
  const weeks = [];
  for (let w = 0; w < weeksCount; w++) {
    const col = [];
    for (let d = 0; d < 7; d++) {
      const date = new Date(start);
      date.setDate(start.getDate() + w * 7 + d);
      const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      const info = sessions[key];
      const ratio = info?.ratio || 0;
      const level = ratio === 0 ? 0 : ratio < 40 ? 1 : ratio < 70 ? 2 : ratio < 95 ? 3 : 4;
      col.push({ date: key, ratio, level, today: key === todayStr });
    }
    weeks.push(col);
  }
  return weeks;
}

function weeklyReview(app, logs) {
  const s = app.state;
  const target = s.plan?.days || 3;
  const done = s.weekSessions || 0;
  const coach = app.coach;
  if (done === 0) {
    return {
      roast: '这周零记录。我不问你为什么，我只问：明天几点？',
      science: '本周训练量 0，数据不足以评估。建议下周至少完成 2 次有效训练。',
      warm: '这周没练也没关系，真的。下周我们从一次开始，好吗？',
      drill: '本周零完成度。下周任务：三次，缺一补一。',
    }[coach.style];
  }
  if (done >= target) {
    return {
      roast: `${done} 次，达标。别以为这是你努力，是你终于开始正常了。下周保持，我就少说两句。`,
      science: `${done}/${target} 次达标。建议保持负荷，观察 2 周后再增加变量。`,
      warm: `${done} 次！你做到了。下周还是这个节奏，不用加码。`,
      drill: `${done}/${target}，合格。保持，不许加戏。`,
    }[coach.style];
  }
  return {
    roast: `才 ${done} 次。差 ${target - done} 次，别跟说没时间，你有时间刷手机。`,
    science: `${done}/${target} 次，低于计划剂量 ${Math.round(((target - done) / target) * 100)}%。建议优先补齐频率，而非增加单次强度。`,
    warm: `已经 ${done} 次了，比上周的自己强。再补 ${target - done} 次就完整了，补不上也没关系。`,
    drill: `完成 ${done}/${target}，欠 ${target - done} 次。下周补上。`,
  }[coach.style];
}


Object.assign(module.exports, { renderProgress });
