.photo-compare:hover { background: #ffffff; }
.photo-compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo-compare-grid figure { margin: 0; }
.photo-compare-grid img { width: 100%; border-radius: 10px; display: block; }
.photo-compare-grid figcaption { font-size: 11px; color: var(--ink-3); margin-top: 4px; text-align: center; }
@media (max-width: 640px) { .photo-compare-grid { grid-template-columns: 1fr; } }
/* 专注目标 / 顶栏倒计时 / 音乐进度 */
.focus-goal-bar { height: 6px; border-radius: 999px; background: #ececea; overflow: hidden; margin: 4px 0 8px; }
.focus-goal-bar i { display: block; height: 100%; background: var(--ink); border-radius: 999px; }
.focus-countdown { border: 1px solid var(--line); background: #ffffff; color: var(--ink); border-radius: 999px; font-size: 11px; padding: 4px 10px; margin-left: 8px; cursor: pointer; font-variant-numeric: tabular-nums; }
.focus-countdown[hidden] { display: none; }
.music-dock-info { display: flex; flex-direction: column; gap: 3px; min-width: 160px; }
.music-dock-progress { display: flex; align-items: center; gap: 6px; }
.music-dock-progress input { width: 120px; accent-color: #ffffff; }
.music-dock-progress span { font-size: 9.5px; opacity: .7; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 74px; }
.music-dock-btn.is-on { background: #ffffff; color: #151515; }
music-dock .music-dock-btn { flex: none; }
@media (max-width: 640px) { .focus-countdown { display: none; } .music-dock-info { min-width: 0; flex: 1; } .music-dock-progress input { width: 80px; } }
.music-card.is-drop { outline: 2px dashed var(--ink); outline-offset: 4px; }
.focus-goal-bar { margin-top: 2px; }

/* MET 每日代谢（辅助，折叠） */
.met-fold { padding: 0; overflow: hidden; }
.met-summary-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; cursor: pointer; list-style: none; }
.met-summary-head::-webkit-details-marker { display: none; }
.met-summary-head .card-title { margin: 0; }
.met-summary-num { font: 700 15px/1 var(--font-mono); color: var(--ink); }
.met-body { padding: 0 18px 16px; }
.met-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 14px; margin: 10px 0; font-size: 11.5px; color: var(--ink-2); }
.met-grid b { color: var(--ink); }
.met-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0 8px; }
.met-controls .select { max-width: 300px; }
.met-controls .input { width: 80px; }
.met-list { display: flex; flex-direction: column; gap: 5px; }
.met-chip { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 9px; background: var(--paper-2); border-radius: 8px; font-size: 11.5px; color: var(--ink-2); }
.met-chip b { color: var(--ink); }
@media (max-width: 640px) { .met-grid { grid-template-columns: 1fr 1fr; } .met-controls .select { max-width: none; flex: 1 1 100%; } }
/* 短视频文案导入 */
.video-text { width: 100%; min-height: 132px; resize: vertical; line-height: 1.7; }
.video-hint { margin-top: 6px; }
.video-preview { margin-top: 10px; }
.video-error { padding: 10px 12px; border-radius: 10px; background: #fbeee9; color: #9b3d2e; font-size: 12.5px; line-height: 1.7; }
.video-result-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
.video-items { display: flex; flex-direction: column; gap: 2px; margin: 8px 0; }
.video-items div { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
.video-items span { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-3); }
.video-items b { font-weight: 700; }
.video-items em { margin-left: auto; font-style: normal; color: var(--ink-3); }
.video-unmatched { font-size: 11px; color: #9b3d2e; margin: 6px 0; }


/* ============ PixPet 伴侣舞台 / 教练灵动胶囊 / 五指山抽屉 ============ */

/* ---------- 宠物插画 ---------- */
.pet-svg { display: block; overflow: visible; width: 100%; height: auto; }
.pet-svg .pet-head,
.pet-svg .pet-tail,
.pet-svg .pet-ear,
.pet-svg .pet-eyes,
.pet-svg .pet-crown,
.pet-svg .pet-aura { transform-box: fill-box; }
.pet-svg .pet-head { transform-origin: 50% 82%; }
.pet-svg .pet-tail { transform-origin: 12% 55%; }
.pet-svg .pet-ear-l { transform-origin: 70% 90%; }
.pet-svg .pet-ear-r { transform-origin: 30% 90%; }
.pet-svg .pet-eyes { transform-origin: center; animation: pet-blink 5.8s steps(1, end) infinite; }
.pet-svg.is-animated .pet-head { animation: pet-head-bob 2.2s steps(2, end) infinite; }
.pet-svg.is-animated .pet-tail { animation: pet-tail-wag 1.4s steps(2, end) infinite; }
.pet-svg.is-animated .pet-ear-l { animation: pet-ear-twitch 3.8s steps(2, end) infinite; }
.pet-svg.is-animated .pet-ear-r { animation: pet-ear-twitch 3.8s steps(2, end) 0.35s infinite; }
.pet-svg.is-animated .pet-shadow { animation: shadow-breathe 2.2s steps(2, end) infinite; }
.pet-svg.is-animated .pet-aura { animation: aura-pulse 3.4s ease-in-out infinite; }
.pet-svg.is-animated .pet-hearts { animation: float-up 2.2s steps(6, end) infinite; }
.pet-svg.is-animated .pet-sweat { animation: sweat-drop 1.8s steps(5, end) infinite; }
.pet-svg.is-animated .pet-zzz text { animation: zzz-float 2.8s ease-in-out infinite; }
.pet-svg.is-animated .pet-zzz text:nth-child(2) { animation-delay: 0.4s; }
.pet-svg.is-animated .pet-zzz text:nth-child(3) { animation-delay: 0.8s; }
.pet-svg.is-animated .pet-crown { animation: crown-bob 2.2s steps(2, end) infinite; }
.pet-svg.is-animated .pet-dust rect { animation: dust-float 5.4s steps(4, end) infinite; }
.pet-svg.is-animated .pet-dust rect:nth-child(2) { animation-delay: 1.2s; }
.pet-svg.is-animated .pet-dust rect:nth-child(3) { animation-delay: 2.4s; }
.pet-svg.is-animated .pet-dust rect:nth-child(4) { animation-delay: 3.6s; }
.pet-svg.is-animated .pet-dust rect:nth-child(5) { animation-delay: 4.8s; }
.pet-svg.mood-tired .pet-head { animation-duration: 6s; }
.pet-svg.mood-hungry .pet-head { animation-name: pet-wobble; animation-duration: 2.6s; }
.pet-svg.mood-bored .pet-tail { animation-duration: 4.6s; }

@keyframes pet-head-bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -3px; } }
@keyframes pet-tail-wag { 0%, 100% { rotate: -4deg; } 50% { rotate: 5deg; } }
@keyframes pet-ear-twitch { 0%, 90%, 100% { rotate: 0deg; } 94% { rotate: -6deg; } 98% { rotate: 2deg; } }
@keyframes pet-blink { 0%, 93%, 100% { scale: 1 1; } 96% { scale: 1 0.08; } }
@keyframes shadow-breathe { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.17; } }
@keyframes aura-pulse { 0%, 100% { opacity: 0.7; scale: 1; } 50% { opacity: 1; scale: 1.04; } }
@keyframes float-up { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 0.9; } 100% { opacity: 0; transform: translateY(-22px); } }
@keyframes sweat-drop { 0% { opacity: 0; transform: translateY(-4px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(14px); } }
@keyframes zzz-float { 0%, 100% { opacity: 0.15; transform: translateY(2px); } 50% { opacity: 0.85; transform: translateY(-6px); } }
@keyframes pet-wobble { 0%, 100% { rotate: 0deg; } 25% { rotate: -1.2deg; } 75% { rotate: 1.2deg; } }
@keyframes crown-bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -3px; } }
@keyframes dust-float { 0%, 100% { translate: 0 0; opacity: 0.25; } 50% { translate: 0 -8px; opacity: 0.7; } }

/* 待机小动作 */
.pet-stage-inner.idle-yawn .pet-head { animation: idle-yawn 2.4s ease-in-out; }
.pet-stage-inner.idle-scratch .pet-head { animation: idle-scratch-head 2.4s ease-in-out; }
.pet-stage-inner.idle-scratch .pet-ear-l { animation: idle-scratch-ear 2.4s ease-in-out; }
.pet-stage-inner.idle-pace .pet-head { animation: idle-pace 2.4s ease-in-out; }
.pet-stage-inner.idle-pace .pet-tail { animation: idle-pace-tail 2.4s ease-in-out; }
.pet-stage-inner.idle-sniff .pet-head { animation: idle-sniff 2.4s ease-in-out; }
.pet-stage-inner.idle-stretch .pet-head { animation: idle-stretch 2.4s ease-in-out; }
.pet-stage-inner.idle-stretch .pet-ear-l,
.pet-stage-inner.idle-stretch .pet-ear-r { animation: idle-stretch-ear 2.4s ease-in-out; }
@keyframes idle-yawn { 0%, 100% { translate: 0 0; rotate: 0deg; } 35%, 70% { translate: 0 5px; rotate: -2deg; } }
@keyframes idle-scratch-head { 0%, 100% { rotate: 0deg; } 25% { rotate: 4deg; } 55% { rotate: -3deg; } 80% { rotate: 2deg; } }
@keyframes idle-scratch-ear { 0%, 100% { rotate: 0deg; } 20% { rotate: -18deg; } 40% { rotate: 8deg; } 60% { rotate: -14deg; } 80% { rotate: 4deg; } }
@keyframes idle-pace { 0%, 100% { translate: 0 0; } 25% { translate: -6px 0; } 50% { translate: 0 0; } 75% { translate: 6px 0; } }
@keyframes idle-pace-tail { 0%, 100% { rotate: -6deg; } 50% { rotate: 10deg; } }
@keyframes idle-sniff { 0%, 100% { translate: 0 0; rotate: 0deg; } 30%, 65% { translate: 0 7px; rotate: 5deg; } }
@keyframes idle-stretch { 0%, 100% { translate: 0 0; } 45%, 70% { translate: 0 -7px; } }
@keyframes idle-stretch-ear { 0%, 100% { rotate: 0deg; } 45%, 70% { rotate: -7deg; } }
@media (prefers-reduced-motion: reduce) {
  .pet-stage-inner[class*="idle-"] * { animation: none !important; }
  .pet-svg.is-animated *, .pet-svg .pet-eyes { animation: none !important; }
}

/* PixPet 宠物舞台 */
.pet-stage {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 6px 0 4px; min-height: 0;
}
.pet-figure-btn {
  width: 100%; max-width: 390px; padding: 10px 0 0; border: 0; background: none; cursor: pointer;
  border-radius: 24px; display: grid; place-items: center; -webkit-tap-highlight-color: transparent;
}
.pet-figure-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
.pet-stage-inner { position: relative; width: 100%; display: grid; place-items: center; transform-origin: bottom center; transition: transform 0.35s var(--spring); }
.pet-stage-inner .pet-character { transition: translate 0.9s var(--ease); }
.pet-stage-inner[data-behavior="sleep"] .pet-head { translate: 0 8px; rotate: -4deg; }
.pet-stage-inner[data-behavior="sleep"] .pet-ear { rotate: -10deg; }
.pet-stage-inner[data-behavior="hungry"] .pet-head { translate: 0 7px; rotate: 3deg; }
.pet-stage-inner[data-behavior="sulk"] .pet-head { translate: 0 7px; rotate: -6deg; }
.pet-stage-inner[data-behavior="sulk"] .pet-tail { rotate: -14deg; }
.pet-stage-inner[data-behavior="celebrate"] { animation: behave-hop 0.7s var(--ease) infinite; }
.pet-stage-inner[data-behavior="play"] .pet-tail { animation: pet-tail-wag 0.7s ease-in-out infinite; }
.pet-stage-inner[data-behavior="play"] .pet-head { animation: pet-head-bob 1.2s ease-in-out infinite; }
.pet-stage-inner[data-behavior="sleep"]::after {
  content: "z z z"; position: absolute; right: 13%; top: 16%;
  font: 700 18px var(--font-mono); color: var(--ink); opacity: .45;
  animation: zzz-float 2.8s ease-in-out infinite;
}
@keyframes behave-hop { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-10px); } }
.pet-figure-btn:hover .pet-stage-inner { transform: scale(1.02) translateY(-2px); }
.pet-stage-inner .pet-svg { max-width: 340px; }
.pet-stage.is-happy .pet-stage-inner,
.pet-stage.is-tapped .pet-stage-inner { animation: hop 0.6s var(--spring); }
.pet-stage-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.pet-line {
  background: rgba(255, 255, 255, 0.92); border: 1px solid var(--line);
  padding: 7px 15px; border-radius: 999px; font-size: 13px; line-height: 1.5;
  box-shadow: var(--shadow-s); max-width: 100%; text-align: center;
}
.pet-line.is-pop { animation: line-pop 0.35s var(--spring); }
@keyframes line-pop { 0% { transform: scale(0.95); } 55% { transform: scale(1.03); } 100% { transform: scale(1); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px) scale(1.03); } 70% { transform: translateY(0) scale(0.98); } }
@keyframes care-fly { 0% { opacity: 0; transform: translate(-50%, 0) scale(0.7); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -90px) scale(1.2); } }

.pet-stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pet-stat {
  background: var(--paper-2);
  border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px;
}
.pet-stat .ps-top { display: flex; align-items: center; gap: 6px; }
.pet-stat .ps-ico { display: inline-flex; align-items: center; color: var(--ink-3); }
.pet-stat .ps-label { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
.pet-stat .ps-val { margin-left: auto; font-size: 19px; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1; }
.pet-stat .ps-bar { height: 5px; border-radius: 999px; background: rgba(17, 17, 17, 0.08); margin-top: 9px; overflow: hidden; }
.pet-stat .ps-bar i { display: block; height: 100%; border-radius: 999px; transition: width 0.6s var(--ease); }
.ps-bar i.sat { background: var(--ink); }
.ps-bar i.mood { background: #3D3D3A; }
.ps-bar i.energy { background: #666662; }
.ps-bar i.bond { background: var(--ink); }

/* 衣橱 */
.wardrobe { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.wardrobe-label { font-size: 11.5px; color: var(--ink-3); font-weight: 650; letter-spacing: .04em; }
.outfit-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: rgba(255, 255, 255, 0.78); font-size: 12px; color: var(--ink-2);
  transition: all .2s var(--spring); cursor: pointer;
}
.outfit-chip i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-block; }
.outfit-chip:hover:not(:disabled) { border-color: var(--ink); transform: translateY(-1px); background: #fff; }
.outfit-chip.is-on { border-color: var(--ink); background: var(--ink); color: #fff; font-weight: 650; }
.outfit-chip.is-on i { border-color: #fff; }
.outfit-chip.is-locked { opacity: .42; cursor: not-allowed; }

/* 进化动画 */
.pet-stage.is-evolving .pet-stage-inner { animation: evolve-pop 1.6s var(--ease); }
.pet-stage.is-evolving::after {
  content: "✦ ✦ ✦"; position: absolute; left: 50%; top: 16%;
  transform: translateX(-50%); font-size: 22px; color: var(--gold); letter-spacing: 8px;
  animation: evolve-spark 1.6s ease-out both; pointer-events: none;
}
@keyframes evolve-pop {
  0% { transform: scale(1); filter: brightness(1); }
  18% { transform: scale(0.94); filter: brightness(1.5); }
  42% { transform: scale(1.08); filter: brightness(1.9); }
  70% { transform: scale(1.02); filter: brightness(1.2); }
  100% { transform: scale(1); filter: brightness(1); }
}
@keyframes evolve-spark {
  0% { opacity: 0; transform: translateX(-50%) translateY(8px) scale(.8); }
  25% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) translateY(-26px) scale(1.2); }
}

/* PixPet Dock 风格照顾栏 */
.care-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.care-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 11px 6px; border-radius: 16px; border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.72); transition: all 0.2s var(--spring);
}
.care-btn:hover { background: #fff; transform: translateY(-2px); box-shadow: var(--shadow-s); border-color: var(--line-strong); }
.care-btn:active { transform: scale(0.93); }
.care-btn .cb-icon { font-size: 20px; line-height: 1; }
.care-btn .cb-name { font-size: 12px; font-weight: 650; }
.care-btn .cb-cost { font-size: 10px; color: var(--ink-3); font-family: var(--font-mono); }
.care-btn.is-dim { opacity: 0.45; }
@media (max-width: 640px) { .care-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.pet-pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.pet-pick {
  position: relative; padding: 14px 14px 12px; border-radius: var(--radius-l);
  border: 1px solid var(--line); background: rgba(255, 255, 255, 0.72);
  text-align: center; transition: all 0.22s var(--spring); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.pet-pick > svg { flex: none; }
.pet-pick:hover { transform: translateY(-3px); box-shadow: var(--shadow); background: #fff; border-color: var(--line-strong); }
.pet-pick:hover > svg { animation: px-hop 0.45s steps(2, end) infinite; }
.pet-pick.is-on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink), var(--shadow); background: #fff; }
.pet-pick.is-locked { opacity: 0.45; }
.pet-pick .pp-name { font-weight: 750; margin-top: 4px; font-size: 15px; }
.pet-pick .pp-species { font-size: 11.5px; color: var(--ink-3); }
.pet-pick .pp-dir { margin-top: 6px; font-size: 11px; }


/* ---------- 教练角落 ---------- */
.coach-corner {
  position: fixed; right: clamp(12px, 2.4vw, 28px); bottom: calc(var(--tabbar-h) + 18px);
  z-index: 90; display: flex; align-items: flex-end; gap: 10px; pointer-events: none;
}
.coach-corner > * { pointer-events: auto; }
.coach-bubble {
  max-width: 300px; background: var(--ink); color: var(--paper);
  padding: 10px 14px; border-radius: 16px 16px 4px 16px; font-size: 13px; line-height: 1.55;
  box-shadow: var(--shadow); position: relative;
  animation: bubble-in 0.6s var(--ease) 0.4s both;
  transition: opacity 0.3s, transform 0.3s var(--ease);
}
.coach-bubble::after {
  content: ""; position: absolute; right: -5px; bottom: 0; width: 10px; height: 10px;
  background: var(--ink); clip-path: polygon(0 0, 100% 100%, 0 100%);
}
.coach-bubble.is-quiet { opacity: 0; transform: translateY(6px); pointer-events: none; }
@keyframes bubble-in { from { opacity: 0; transform: translateY(10px) scale(0.94); } to { opacity: 1; transform: none; } }
.coach-avatar-btn {
  position: relative; width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.8);
  background: linear-gradient(160deg, #f6e0b8, #e0b06a);
  box-shadow: 0 8px 24px rgba(17, 17, 17, 0.25), 0 0 0 0 rgba(17, 17, 17, 0.5);
  display: grid; place-items: center; padding: 0; transition: transform 0.25s var(--ease);
  animation: coach-glow 3.2s ease-out infinite;
}
.coach-avatar-btn:hover { transform: scale(1.06) rotate(-3deg); }
.coach-avatar-btn:active { transform: scale(0.96); }
.coach-avatar-inner { width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; border-radius: 50%; }
.coach-avatar-inner svg { width: 100%; height: 100%; }
.coach-hand-badge {
  position: absolute; right: -6px; bottom: -4px; font-size: 20px;
  filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3));
  animation: hand-tilt 4s var(--ease) infinite;
}
.coach-mobile-label {
  display: none; position: absolute; left: 50%; bottom: -17px; transform: translateX(-50%);
  background: var(--ink); color: var(--paper); font-size: 9.5px; line-height: 1.5;
  padding: 0 7px; border-radius: 999px; white-space: nowrap; pointer-events: none;
}
@keyframes coach-glow {
  0% { box-shadow: 0 8px 24px rgba(17, 17, 17, 0.25), 0 0 0 0 rgba(17, 17, 17, 0.55); }
  70% { box-shadow: 0 8px 24px rgba(17, 17, 17, 0.25), 0 0 0 18px rgba(17, 17, 17, 0); }
  100% { box-shadow: 0 8px 24px rgba(17, 17, 17, 0.25), 0 0 0 0 rgba(17, 17, 17, 0); }
}
@media (max-width: 640px) {
  .coach-bubble { display: none; }
  .coach-corner { bottom: calc(var(--tabbar-h) + 20px); right: 12px; }
  .coach-avatar-btn { width: 52px; height: 52px; }
  .coach-mobile-label { display: block; }
  .toast-root { bottom: calc(var(--tabbar-h) + 84px); }
}

/* ---------- 抽屉 ---------- */
.drawer-scrim { position: fixed; inset: 0; background: rgba(17, 17, 17, 0.38); backdrop-filter: blur(2px); z-index: 110; animation: fade-in 0.25s both; }
.drawer {
  position: fixed; z-index: 120; top: 0; right: 0; bottom: 0;
  width: min(460px, 100vw); background: linear-gradient(180deg, #fbf7ee, var(--paper));
  box-shadow: -20px 0 60px rgba(17, 17, 17, 0.22);
  display: flex; flex-direction: column;
  animation: drawer-in 0.4s var(--ease) both;
  border-left: 1px solid var(--line);
}
.drawer-right { width: min(420px, 100vw); }
@keyframes drawer-in { from { transform: translateX(28px); opacity: 0.4; } to { transform: none; opacity: 1; } }
.drawer.is-closing { animation: drawer-out 0.25s ease-in both; }

.drawer-head {

/**
 * 可访问性工具（P1）
 * 纯函数计算焦点环绕；DOM 查询单独提供，便于测试。
 */

const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),iframe,[tabindex]:not([tabindex="-1"])';

function wrapIndex(i, len) {
  if (!len || len <= 0) return 0;
  return ((i % len) + len) % len;
}

function trapTarget(current, length, shift) {
  return wrapIndex(current + (shift ? -1 : 1), length);
}

/** 取容器内可聚焦元素（不依赖 offsetParent，jsdom 也能用） */
function getFocusable(root) {
  if (!root) return [];
  return [...root.querySelectorAll(FOCUSABLE)].filter((el) => {
    if (el.disabled || el.hidden) return false;
    if (el.getAttribute('aria-hidden') === 'true') return false;
    return true;
  });
}

/** 处理 Tab / Shift+Tab 的焦点陷阱 */
function trapFocus(event, root, doc = globalThis.document) {
  if (event.key !== 'Tab' || event.defaultPrevented) return;
  const list = getFocusable(root);
  if (!list.length) return;
  const idx = list.indexOf(doc.activeElement);
  if (idx === -1) {
    event.preventDefault();
    list[0].focus();
    return;
  }
  event.preventDefault();
  list[trapTarget(idx, list.length, event.shiftKey)].focus();
}


Object.assign(module.exports, { FOCUSABLE, wrapIndex, trapTarget, getFocusable, trapFocus });
};

const { getExercise } = __require("data/exercises.js");

const MUSCLE_GROUPS = [
  { key: 'chest', label: '胸', muscles: ['chest'], color: '#111111' },
  { key: 'back', label: '背', muscles: ['back'], color: '#3D3D3B' },
  { key: 'legs', label: '腿', muscles: ['quads', 'hamstrings', 'glutes', 'calves'], color: '#5C5C58' },
  { key: 'shoulders', label: '肩', muscles: ['shoulders'], color: '#7B7B76' },
  { key: 'arms', label: '手臂', muscles: ['biceps', 'triceps', 'grip'], color: '#9B9B95' },
  { key: 'core', label: '核心', muscles: ['core'], color: '#BCBCB6' },
];

const DAY = 86400000;

function parseKey(key) {
  const [y, m, d] = String(key || '').split('-').map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}

function keyOf(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

function mondayOf(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const shift = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - shift);
  return d;
}

function weekKeys(now, weeks) {
  const current = mondayOf(new Date(now));
  const out = [];
  for (let i = weeks - 1; i >= 0; i--) {
    const d = new Date(current.getTime() - i * 7 * DAY);
    out.push({ key: keyOf(d), label: `${d.getMonth() + 1}/${d.getDate()}` });
  }
  return out;
}

function musclesFor(exerciseId) {
  const ex = getExercise(exerciseId);
  return Array.isArray(ex?.muscles) ? ex.muscles : [];
}

function weeklyMuscleVolume(setLogs = [], { now = Date.now(), weeks = 8 } = {}) {
  const keys = weekKeys(now, weeks);
  const index = new Map(keys.map((w, i) => [w.key, i]));
  const rows = keys.map((w) => {
    const values = Object.fromEntries(MUSCLE_GROUPS.map((g) => [g.key, 0]));
    return { key: w.key, label: w.label, values, total: 0 };
  });
  for (const l of Array.isArray(setLogs) ? setLogs : []) {
    const d = parseKey(l.date);
    if (!d) continue;
    const i = index.get(keyOf(mondayOf(d)));
    if (i === undefined) continue;
    const volume = (Number(l.weight) || 0) * (Number(l.reps) || 0);
    if (!volume) continue;
    const muscles = musclesFor(l.exerciseId);
    for (const g of MUSCLE_GROUPS) {
      if (g.muscles.some((m) => muscles.includes(m))) {
        rows[i].values[g.key] += volume;
      }
    }
    rows[i].total += volume;
  }
  const max = rows.reduce((m, r) => Math.max(m, r.total), 0);
  return { weeks: rows, max, groups: MUSCLE_GROUPS };
}

function prTimeline(setLogs = [], { limit = 5 } = {}) {
  const byExercise = new Map();
  const logs = [...(Array.isArray(setLogs) ? setLogs : [])].sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')) || (a.at || 0) - (b.at || 0));
  for (const l of logs) {
    if (!l.exerciseId) continue;
    const entry = byExercise.get(l.exerciseId) || { exerciseId: l.exerciseId, name: l.exerciseName || l.exerciseId, events: [], best: 0 };
    const e = Math.round((Number(l.weight) || 0) * (1 + (Number(l.reps) || 0) / 30));
    if (e > entry.best) {
      entry.best = e;
      entry.events.push({ date: l.date, weight: Number(l.weight) || 0, reps: Number(l.reps) || 0, e1rm: e });
    }
    byExercise.set(l.exerciseId, entry);
  }
  return [...byExercise.values()]
    .filter((e) => e.events.length)
    .sort((a, b) => String(b.events.at(-1).date) .localeCompare(String(a.events.at(-1).date)))
    .slice(0, limit);
}

/** 近 N 周的计划次数 vs 实际次数 */
function adherenceTrend(state = {}, { now = Date.now(), weeks = 8 } = {}) {

  const sessions = state.sessions && typeof state.sessions === 'object' ? state.sessions : {};
  const rows = keys.map((w) => {
    const actual = Object.keys(sessions).filter((k) => String(k) >= w.key && String(k) < keyOf(new Date(parseKey(w.key).getTime() + 7 * DAY))).length;

  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;

/** 导出训练记录为 CSV（带 BOM，Excel 直接打开） */
function toCSV(setLogs = []) {
  const rows = [...(Array.isArray(setLogs) ? setLogs : [])].sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')) || (a.at || 0) - (b.at || 0));

  }

}

const VIEWS = { home: renderHome, plan: renderPlan, train: renderTrain, focus: renderFocus, custom: renderCustomPlan, exercise: renderExercise, pet: renderPet, adopt: renderAdopt, coach: renderCoach, progress: renderProgress };

class App {
  constructor() {
    this.state = loadState();
    this.coach = COACH_BY_ID[this.state.coachId] || COACH_BY_ID[DEFAULT_COACH_ID];
    this.view = 'home';
    this.planTab = 0;
    this.sessionIndex = 0;
    this.finger = null;      // 当前五指山数据
    this.fingerOrigin = null; // 触发来源元素，用于关闭时恢复
    this.activeFinger = null;
    this.adoptPick = this.state.pet?.typeId || 'dog';
    this.timer = { running: false, left: 60, total: 60, handle: null };
    const restored = restorePomodoroFocus(this.state.focusRuntime, this.state.focusSettings, Date.now());
    this.focus = restored.timer;
    this._focusExpired = restored.expired;
    if (restored.expired) this.state.focusRuntime = null;
    this._focusTimer = null;
    this.focusZen = false;
    this.music = { tracks: [], queue: [], index: -1, currentId: null, currentUrl: null, playing: false, embed: this.state.musicEmbed || '' };
    this.audio = null;
    this.workoutFocusOpen = false;
    this.exerciseDetailId = null;
    this.exerciseReturn = 'train';
    this.photoCompare = [];
    this.sessionClock = 0;
    this.clockHandle = null;
    this.tickHandle = null;
    this.chatMode = 'fingers';
    this.annoOpen = false;
    this.todayKey = todayKey();
    this.state.metActivities = (this.state.metActivities || []).filter((a) => a.date === this.todayKey);
  }

  /* ---------- 生命周期 ---------- */
  boot() {
    this.state.pet = this.state.pet ? tickPet(this.state.pet) : this.state.pet;
    this.syncWeek();
    initPwa();
    this.installAvailable = canInstall();
    window.addEventListener('wuzhishan-installable', () => {
      this.installAvailable = true;
      if (this.view === 'home') {
        this.renderView();
        this.afterRender();
      }
    });
    setTimeout(() => this.maybeNotify(), 2500);
    if (this.focus.running) this.startFocusTick();
    if (this._focusExpired) setTimeout(() => this.toast('上一格专注已经结束，按开始再来一格。', this.coach.id), 900);
    this.routeFromHash();
    this.bindGlobal();
    this.updateChrome();
    this.startClock();
    this.startPetTick();
    if (!this.state.profile.onboarded && !this.state.plan) {
      setTimeout(() => this.openOnboarding(), 700);
    } else {
      setTimeout(() => this.coachSays(this.greeting(), 0), 1200);
    }
    this.save();
  }

  save() {
    return this.flushSave();
  }

  /** 高频操作（打卡）用 150ms 合并写盘，减少 localStorage 同步写 */
  saveSoon() {
    clearTimeout(this._saveTimer);
    this._saveTimer = setTimeout(() => this.flushSave(), 150);
  }

  flushSave() {
    clearTimeout(this._saveTimer);
    this._saveTimer = null;
    const ok = saveState(this.state);
    if (!ok) this.showStorageWarning();
    return ok;
  }

  /** 存档失败时给出可见告警（隐私模式 / 配额满 / 被禁用） */
  showStorageWarning() {
    if ($('.storage-warn')) return;
    const bar = document.createElement('div');
    bar.className = 'storage-warn';
    bar.innerHTML = `<span>⚠️ 存档失败：浏览器存储可能已满或被禁用。请先去「进展」页导出备份。</span><button class="storage-warn-x" aria-label="关闭提示">✕</button>`;
    bar.querySelector('.storage-warn-x').addEventListener('click', () => bar.remove());
    document.body.appendChild(bar);
  }

  startClock() {
    clearInterval(this.clockHandle);
    this.clockHandle = setInterval(() => {
      if (this.state.activeSession && !this.state.activeSession.finished) {
        this.sessionClock += 1;
        const el = $('#session-clock');
        if (el) el.textContent = fmtSec(this.sessionClock);
      }
    }, 1000);
  }

  startPetTick() {
    clearInterval(this.tickHandle);
    this.tickHandle = setInterval(() => {
      if (this.state.pet) {
        this.state.pet = tickPet(this.state.pet);
        this.save();
        if (this.view === 'pet' || this.view === 'home') {
          // 每 5 分钟轻量刷新面板数据，不打断动画
          if (Date.now() % 300000 < 31000) this.updateChrome();
        }
      }
    }, 60000);
  }

  syncWeek() {
    const ws = startOfWeek();
    if (this.state.weekStart !== ws) {
      this.state.weekStart = ws;
      this.state.weekSessions = 0;
    }
    if (this.state.lastTrainedDate) {
      const d = daysBetween(new Date(this.state.lastTrainedDate), new Date());
      if (d > 1) {
        this.state.streak = 0;
      }
    }
  }

  /* ---------- 路由 ---------- */
  routeFromHash() {
    const hash = (location.hash || '#home').replace('#', '');
    const name = VIEWS[hash] ? hash : 'home';
    this.go(name, { skipHash: true });
    if (location.hash !== `#${name}`) history.replaceState(null, '', `#${name}`);
  }

  go(view, opts = {}) {
    if (!VIEWS[view]) view = 'home';
    if (view === 'adopt' && this.state.pet && !opts.force) {
      // 已有宠物时也允许进，用作换宠
    }
    this.view = view;
    if (!opts.skipHash) history.replaceState(null, '', `#${view}`);
    this.renderView();
    this.updateNav();
    $('#view').scrollIntoView({ block: 'start', behavior: 'instant' });
    window.scrollTo({ top: 0, behavior: 'instant' });
    this.closeDrawer();
    this.closeCoachDrawer();
    this.updateCoachCorner();
    this.afterRender();
  }

  renderView() {
    const root = $('#view');
    const fn = VIEWS[this.view];
    if (this.view === 'train' && this.state.plan) this.ensureSession();
    try {
      root.innerHTML = fn(this);
      hydrateEmojiIcons(root);
    } catch (e) {
      console.error(e);
      root.innerHTML = `<div class="page"><div class="card"><h3>这一页出错了</h3><p class="small muted">${esc(e.message)}</p><button class="btn btn-sm btn-ghost mt" data-nav="home">回首页</button></div></div>`;
    }
    document.body.classList.toggle('no-plan', !this.state.plan);
    document.body.classList.toggle('focus-view', this.view === 'focus');
  }

  updateNav() {
    $$('[data-nav]').forEach((a) => {
      const target = a.dataset.nav;
      const on = target === this.view || (this.view === 'adopt' && target === 'pet');
      a.classList.toggle('is-active', on);
    });
  }

  updateChrome() {
    const chip = $('#coach-chip');
    if (chip) {
      chip.innerHTML = `${coachSVG(this.coach.id, 30)}<span><span class="cc-name">${esc(this.coach.name)}</span><span class="cc-title">${esc(this.coach.title)}</span></span>`;
      chip.onclick = () => this.openCoachList();
    }
    const inner = $('#coach-avatar-inner');
    if (inner) inner.innerHTML = coachSVG(this.coach.id, 62);
    this.updateCoachCorner();
    const toggle = $('#anno-toggle');
    if (toggle) toggle.setAttribute('aria-pressed', String(this.annoOpen));
  }

  updateCoachCorner() {
    const text = this.cornerLine();
    const bubble = $('#coach-bubble');
    if (bubble) {
      $('#coach-bubble-text').textContent = text;
      bubble.classList.remove('is-quiet');
    }
  }

  cornerLine() {
    const s = this.state;
    const pet = s.pet;
    const lines = {
      home: pet ? `${pet.name}在等你。今天这页有 5 个地方能改。` : '先领一只宠物，再谈计划。',
      plan: s.plan ? '这计划我看过了，有地方不对。点我。' : '计划空着，先定目标。',
      train: '练的时候别刷手机。有组间的空，不如问我。',
      pet: pet ? `${pet.name}的状态我都看着。点我，我告诉你它缺什么。` : '去领一只。',
      coach: '想换人？点我，五个教练随你挑。',
      progress: '记录不会骗人。要不要看看哪周你偷懒了？',
      adopt: '选宠物别选好看的，选你练得动的。',
    }[this.view] || '点我，伸只手看看。';
    return lines;
  }

  coachSays(text, dur = 6000) {
    const bubble = $('#coach-bubble');
    if (!bubble) return;
    $('#coach-bubble-text').textContent = text;
    bubble.classList.remove('is-quiet');
    clearTimeout(this._bubbleT);
    if (dur > 0) this._bubbleT = setTimeout(() => bubble.classList.add('is-quiet'), dur);
  }

  greeting() {
    const s = this.state;
    const style = this.coach.style;
    if (!s.plan) {
      return { roast: '没计划？行，先给你排一个，别问东问西。', science: '缺少训练变量。先建立基线。', warm: '我们先做一个简单的计划，好么？', drill: '无计划。立即建立。' }[style];
    }
    if (!s.pet) {
      return { roast: '计划有了，宠物没有。它比你会催你。', science: '计划已就绪，缺一个外部监督变量。', warm: '要不要领一只宠物？它会陪着你。', drill: '计划就绪。配一只宠物，执行更有约束。' }[style];
    }
    return {
      roast: `${s.pet.name}在看着你。练不练？`,
      science: '数据齐了。今天按计划执行。',
      warm: '今天也一起，慢慢来。',
      drill: '开始执行。',
    }[style];
  }

  /* ---------- 全局事件 ---------- */
  bindGlobal() {
    document.addEventListener('click', (e) => {
      const nav = e.target.closest('[data-nav]');
      if (nav) {
        e.preventDefault();
        this.go(nav.dataset.nav);
        return;
      }
      const pick = e.target.closest('[data-pick]');
      if (pick) {
        this.pickProfile(pick.dataset.pick, pick.dataset.val);
        return;
      }
      const tab = e.target.closest('[data-tab]');
      if (tab) {
        this.planTab = Number(tab.dataset.tab);
        this.renderView();
        this.afterRender();
        return;
      }
      const act = e.target.closest('[data-act]');
      if (act) {
        e.preventDefault();
        this.handleAction(act, e);
        return;
      }
      // 五指山内部：手指导航 / 直接点手指
      const hf = e.target.closest('.hf-nav');
      if (hf && hf.dataset.hf) {
        this.selectFinger(hf.dataset.hf);
        return;
      }
      const fingerNode = e.target.closest('.hand-svg .finger');
      if (fingerNode && fingerNode.dataset.finger && fingerNode.dataset.finger !== 'thumb') {
        this.selectFinger(fingerNode.dataset.finger);
        return;
      }
      // 标注模式：点标注块 → 打开五指山
      if (this.annoOpen) {
        const anno = e.target.closest('.anno-target');
        if (anno) {
          e.preventDefault();
          const map = { goal: 'shan', days: 'shan', equipment: 'wu', 'exercise-list': 'wu', 'today-session': 'xi', 'pet-bond': 'xin', heatmap: 'shan', 'session-structure': 'shan', warmup: 'xi' };
          this.openFinger('anno', { zone: this.view === 'adopt' ? 'pet' : this.view, finger: map[anno.dataset.anno] || null });
          return;
        }
      }
    });

    window.addEventListener('hashchange', () => {
      const name = (location.hash || '#home').replace('#', '');
      if (name !== this.view && VIEWS[name]) this.go(name, { skipHash: true });
    });

    // 关页 / 切后台时把延迟写盘刷掉，避免丢最后一次打卡
    window.addEventListener('pagehide', () => this.flushSave());
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') this.flushSave();
    });

    $('#coach-avatar')?.addEventListener('click', () => this.openFinger('corner'));
    $('#drawer-close')?.addEventListener('click', () => this.closeDrawer());
    $('#drawer-scrim')?.addEventListener('click', () => this.closeDrawer());
    $('#coach-drawer-close')?.addEventListener('click', () => this.closeCoachDrawer());
    $('#coach-scrim')?.addEventListener('click', () => this.closeCoachDrawer());
    $('#drawer')?.addEventListener('keydown', (e) => trapFocus(e, $('#drawer')));
    $('#coach-drawer')?.addEventListener('keydown', (e) => trapFocus(e, $('#coach-drawer')));
    $('#anno-toggle')?.addEventListener('click', () => this.toggleAnno());
    $('#drawer-anno')?.addEventListener('click', () => this.toggleAnno(true));

    $$('.dtab').forEach((btn) => btn.addEventListener('click', () => this.switchDrawerTab(btn.dataset.dtab)));

    $('#chat-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = $('#chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      this.sendChat(text);
    });

    const musicVol = $('#music-volume');
    if (musicVol) musicVol.addEventListener('input', () => this.setMusicVolume(musicVol.value));

    document.addEventListener('keydown', (e) => {
      if (this.focusZen && e.key === 'Escape') {
        e.preventDefault();
        this.toggleFocusZen();
        return;
      }
      const action = resolveShortcut(e, this.shortcutContext(e));
      if (!action) return;
      e.preventDefault();
      this.runShortcut(action);
    });
  }

  shortcutContext(e) {
    const el = e?.target;
    const tag = el?.tagName;
    const inEditable = Boolean(el && (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable));
    return {
      inEditable,
      view: this.view,
      drawerOpen: !($('#drawer')?.hidden ?? true),
      modalOpen: Boolean($('#modal-root')?.innerHTML),
      hasPlan: Boolean(this.state.plan),
      activeSession: Boolean(this.state.activeSession && !this.state.activeSession.finished),
    };
  }

  runShortcut(action) {
    if (action === 'close-layer') {
      if ($('#modal-root')?.innerHTML) this.closeModal();
      else this.closeDrawer();
      return;
    }
    if (action === 'open-shortcuts') { this.openShortcutsModal(); return; }
    if (action === 'focus-toggle') { this.focus.running ? this.focusPause() : this.focusStart(); return; }
    if (action === 'focus-reset') { this.focusReset(); return; }
    if (action === 'focus-skip') { this.focusSkip(); return; }
    if (action === 'focus-zen') { this.toggleFocusZen(); return; }
    if (action === 'open-chat') { this.openFinger('corner', { tab: 'chat' }); return; }
    if (action === 'toggle-anno') { this.toggleAnno(); return; }
    if (action === 'timer-toggle') {
      this.toggleTimer();
      this.toast(this.timer.running ? '计时开始。' : '计时暂停。', this.coach.id);
      return;
    }
    if (action === 'next-set') {
      const card = $('.exercise-card.is-current') || $('.exercise-card:not(.is-done)');
      if (card) { card.scrollIntoView({ block: 'center', behavior: 'smooth' }); this.toast('下一组在眼前了。', this.coach.id); }
      else this.toast('今天的组都完成了。', this.coach.id);
      return;
    }
    if (action.startsWith('finger:')) {
      const finger = action.split(':')[1];
      if (!$('#drawer') || $('#drawer').hidden) this.openFinger('corner', { finger });
      else this.selectFinger(finger);
    }
  }

  openReportModal(kind) {
    const report = buildReport(this.state, { kind, coach: this.coach });
    const html = renderReportHTML(report, { coach: this.coach });
    this.lastReportHTML = html;
    this.lastReportName = `wuzhishan-${kind}-${report.range.from}.html`;
    this.openModal(`
      <div class="modal-head">
        <div>
          <span class="eyebrow">训练报告</span>
          <h2 style="margin-top:4px">${esc(report.kindLabel)} · ${esc(report.range.from)} 至 ${esc(report.range.to)}</h2>
          <p class="small muted">${report.summary.sessions} 次训练 · ${report.summary.volume}kg 容量 · 完成度 ${Math.round(report.summary.compliance * 100)}%</p>
        </div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      <iframe id="report-frame" class="report-frame" title="训练报告预览"></iframe>
      <div class="modal-foot" style="flex-wrap:wrap;gap:8px">
        <button class="btn btn-ghost" data-act="close-modal">关闭</button>
        <button class="btn btn-ghost" data-act="download-report">下载 HTML</button>
        <button class="btn btn-primary" data-act="print-report">打印 / 存为 PDF</button>
      </div>
    `);
    const frame = $('#report-frame');
    if (frame) frame.srcdoc = html;
  }

  printReport() {
    const frame = $('#report-frame');
    try {
      frame.contentWindow.focus();
      frame.contentWindow.print();
    } catch (e) {
      this.toast('浏览器阻止了打印，请下载 HTML 后用 Ctrl+P。', this.coach.id);
    }
  }

  downloadReport() {
    if (!this.lastReportHTML) return;
    const blob = new Blob([this.lastReportHTML], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = this.lastReportName || 'wuzhishan-report.html';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    this.toast('报告已下载，打开后 Ctrl+P 可存 PDF。', this.coach.id);
  }

  openShortcutsModal() {
    this.openModal(`
      <div class="modal-head">
        <div>
          <span class="eyebrow">键盘</span>
          <h2 style="margin-top:4px">快捷键</h2>
          <p class="small muted">输入框里不会触发；弹层打开时只响应 Esc。</p>
        </div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      <div class="kbd-list">
        ${SHORTCUT_LIST.map((s) => `<div class="kbd-row"><kbd>${esc(s.key)}</kbd><span>${esc(s.desc)}</span></div>`).join('')}
      </div>
      <div class="modal-foot"><button class="btn btn-primary" data-act="close-modal">知道了</button></div>
    `);
  }

  afterRender() {
    this.renderMusicDock();
    if (this.workoutFocusOpen) this.renderWorkoutFocus();
    this.renderPetCorner();
    // 标注模式保留
    document.body.classList.toggle('anno-on', this.annoOpen);
    $$('[data-anno]').forEach((node) => node.classList.add('anno-target'));
    // 滑块的视觉填充
    $$('input[type="range"]').forEach((r) => {
      const upd = () => {
        const pct = ((r.value - r.min) / (r.max - r.min)) * 100;
        r.style.setProperty('--fill', pct + '%');
      };
      upd();
      r.addEventListener('input', upd);
      r.addEventListener('change', () => this.pickProfile(r.dataset.range || 'minutes', Number(r.value)));
    });
    $$('[data-body]').forEach((inp) => {
      inp.addEventListener('change', () => this.setBodyField(inp.dataset.body, inp.value));
    });
    $$('[data-custom]').forEach((inp) => {
      inp.addEventListener('change', () => {
        if (!this.customDraft) return;
        const si = Number(inp.dataset.si);
        const ii = Number(inp.dataset.ii);
        const field = inp.dataset.field;
        const kind = inp.dataset.custom;
        if (kind === 'plan-title') this.customDraft.splitName = inp.value.slice(0, 20);
        else if (kind === 'session-title') this.customDraft.sessions[si].title = inp.value.slice(0, 20);
        else if (kind === 'session-minutes') this.customDraft.sessions[si].minutes = Math.max(10, Math.min(120, Number(inp.value) || 45));
        else if (kind === 'item' && field) this.customDraft = updateItem(this.customDraft, si, ii, { [field]: field === 'sets' ? Number(inp.value) : inp.value });
      });
    });
    const templateImport = $('#template-import');
    if (templateImport) templateImport.addEventListener('change', () => {
      const file = templateImport.files?.[0];
      if (file) this.importTemplateFile(file);
      templateImport.value = '';
    });
    $$('.drag-handle').forEach((handle) => {
      handle.addEventListener('pointerdown', (e) => {
        if (e.button && e.button !== 0) return;
        e.preventDefault();
        const row = handle.closest('.custom-item');
        if (!row) return;
        const from = { si: Number(row.dataset.si), ii: Number(row.dataset.ii) };
        row.classList.add('is-dragging');
        const findTarget = (ev) => {
          const el = document.elementFromPoint?.(ev.clientX, ev.clientY);
          return el?.closest?.('.custom-item') || null;
        };
        const move = (ev) => {
          const over = findTarget(ev);
          $$('.custom-item').forEach((r) => r.classList.toggle('drag-over', r === over && r !== row));
        };
        const up = (ev) => {
          document.removeEventListener('pointermove', move);
          document.removeEventListener('pointerup', up);
          const target = findTarget(ev);
          row.classList.remove('is-dragging');
          $$('.custom-item').forEach((r) => r.classList.remove('drag-over'));
          if (target) {
            const to = { si: Number(target.dataset.si), ii: Number(target.dataset.ii) };
            if (to.si === from.si && to.ii !== from.ii) this.customReorder(from.si, from.ii, to.ii);
          }
        };
        document.addEventListener('pointermove', move);
        document.addEventListener('pointerup', up, { once: true });
      });
    });
    const photoInput = $('#photo-input');
    if (photoInput) {
      photoInput.addEventListener('change', () => {
        const file = photoInput.files?.[0];
        if (file) this.addPhotoFile(file);
        photoInput.value = '';
      });
    }
    if (this.view === 'progress') {
      const bodyDate = $('#body-log-date');
      if (bodyDate && !bodyDate.value) bodyDate.value = this.todayKey;
      this.loadPhotos();
    }
    if (this.view === 'focus') {
      const intentEl = $('#focus-intent');
      if (intentEl) intentEl.addEventListener('change', () => this.setFocusIntent(intentEl.value));
      const autoEl = $('#focus-auto-start');
      if (autoEl) autoEl.addEventListener('change', () => { this.state.focusAutoStart = autoEl.checked; this.save(); this.toast(autoEl.checked ? '会自动开始下一段。' : '不再自动开始。', this.coach.id); });
      const soundEl = $('#focus-sound');
      if (soundEl) soundEl.addEventListener('change', () => { this.state.focusSound = soundEl.checked; this.save(); });
      const themeEl = $('#focus-theme');
      if (themeEl) themeEl.addEventListener('change', () => { this.state.focusTheme = themeEl.value; this.save(); this.renderView(); this.afterRender(); });
      this.patchFocus();
      const musicImport = $('#music-import');
      if (musicImport) musicImport.addEventListener('change', () => {
        const files = [...(musicImport.files || [])];
        if (files.length) this.importMusicFiles(files);
        musicImport.value = '';
      });
      const musicM3u = $('#music-m3u');
      if (musicM3u) musicM3u.addEventListener('change', () => {
        const file = musicM3u.files?.[0];
        if (file) this.importMusicPlaylist(file);
        musicM3u.value = '';
      });
      const goalSel = $('#focus-goal');
      if (goalSel) goalSel.addEventListener('change', () => { this.state.focusGoal = Number(goalSel.value) || 4; this.save(); this.renderView(); this.afterRender(); });
      const filterEl = $('#music-filter');
      if (filterEl) filterEl.addEventListener('input', () => { this.musicFilter = filterEl.value; this.renderMusicList(); });
      const musicCard = $('.music-card');
      if (musicCard) {
        musicCard.addEventListener('dragover', (e) => { e.preventDefault(); musicCard.classList.add('is-drop'); });
        musicCard.addEventListener('dragleave', () => musicCard.classList.remove('is-drop'));
        musicCard.addEventListener('drop', (e) => {
          e.preventDefault();
          musicCard.classList.remove('is-drop');
          const files = [...(e.dataTransfer?.files || [])];
          if (files.length) this.importMusicFiles(files);
        });
      }
      this.loadMusicTracks();
      if (this.focus.running) this.startFocusTick();
    }
    if (this.view === 'pet' && this.state.pet) {
      this.checkPetEvolution();
      this.startPetBehavior();
    } else {
      this.stopPetBehavior();
      this.stopPetIdle();
    }
  }

  /* ---------- 档案交互 ---------- */
  pickProfile(key, val) {
    const p = { ...this.state.profile };
    if (key === 'equipment') {
      const set = new Set(p.equipment);
      set.has(val) ? set.delete(val) : set.add(val);
      p.equipment = [...set];
      if (!p.equipment.length) p.equipment = ['none'];
    } else if (key === 'injuries') {
      const set = new Set(p.injuries);
      set.has(val) ? set.delete(val) : set.add(val);
      p.injuries = [...set];
    } else if (key === 'minutes' || key === 'days') {
      p[key] = Number(val);
    } else {
      p[key] = val;
    }
    this.state.profile = p;
    this.save();
    if (key === 'minutes') {
      const v = $('#min-val');
      if (v) v.textContent = `${val} 分钟`;
      const pm = $('.preview-mini .pm-list');
      if (pm) this.renderView(), this.afterRender();
      return;
    }
    this.renderView();
    this.afterRender();
  }

  generatePlan() {
    const p = this.state.profile;
    if (!this.state.pet && this.adoptPick) this.adoptSilently(this.adoptPick);
    this.state.plan = generatePlan({ ...p, petId: this.state.pet?.typeId });
    this.state.generatedPlan = JSON.parse(JSON.stringify(this.state.plan));
    this.state.profile.onboarded = true;
    this.state.profile.petId = this.state.pet?.typeId || p.petId;
    this.state.activeSession = null;
    this.sessionClock = 0;
    this.planTab = 0;
    this.sessionIndex = 0;
    this.save();
    this.go('plan');
    const issues = analyzePlan(this.state.plan, p);
    const line = issues.length
      ? `排好了。但抽空看我给你挑的 ${issues.length} 个毛病。`
      : '排好了。别急着夸我，先练两周。';
    this.toast(line, this.coach.id);
    this.coachSays(line);
  }

  /** 静默创建宠物（引导流程用），不弹出换宠提示 */
  adoptSilently(typeId) {
    const p = PET_BY_ID[typeId];
    if (!p) return;
    this.state.pet = newPetState(typeId, p.name);
    this.state.profile.petId = typeId;
    this.adoptPick = typeId;
  }

  regeneratePlan() {
    const p = this.state.profile;
    this.state.plan = generatePlan({ ...p, petId: this.state.pet?.typeId });
    this.state.generatedPlan = JSON.parse(JSON.stringify(this.state.plan));
    // 新计划可能换了天数/动作，旧的进行中会话必须作废，否则结课时会取到不存在的课
    this.state.activeSession = null;
    this.sessionClock = 0;
    this.sessionIndex = 0;
    this.save();
    this.renderView();
    this.afterRender();
    this.toast('计划重排了。', this.coach.id);
  }

  /* ---------- 会话 ---------- */
  startSession(index = 0) {
    if (!this.state.plan) return this.go('plan');
    const idx = index % this.state.plan.sessions.length;
    const cur = this.state.activeSession;
    if (cur && cur.index === idx && !cur.finished) {
      this.go('train');
      return;
    }
    // 今天练过同一课、且这一课已经有记录：从上次的进度继续，而不是清零
    const todayLog = this.state.sessions?.[this.todayKey];
    let doneSets = {};
    if (cur && cur.finished && cur.index === idx && cur.date === this.todayKey) {
      doneSets = this.clampDoneSets(cur.doneSets, this.state.plan.sessions[idx]);
    }
    this.state.activeSession = {
      index: idx,
      date: this.todayKey,
      doneSets,
      finished: false,
      startedAt: Date.now(),
    };
    this.sessionIndex = idx;
    this.sessionClock = 0;
    this.save();
    this.go('train');
    this.coachSays(doneSets && Object.keys(doneSets).length ? '接着上次的进度。' : '开始。第一个动作先做两组找感觉。');
  }

  setSessionIndex(idx) {
    if (!this.state.plan) return;
    this.sessionIndex = idx;
    this.startSession(idx);
  }

  /** 直接进训练页也能开始：没有进行中的会话就创建一个；已在今天练完就只展示，不重置 */
  ensureSession() {
    const plan = this.state.plan;
    if (!plan) return null;
    const a = this.state.activeSession;
    if (a && !a.finished) return a;
    const idx = (this.sessionIndex ?? 0) % plan.sessions.length;
    const doneToday = this.state.sessions?.[this.todayKey];
    if (a && a.finished && a.date === this.todayKey && a.index === idx) return a; // 保留已完成视图
    if (!a && doneToday && doneToday.ratio >= 100) {
      // 今天已经练满，不自动开新课，等用户点「再练一次」
      return null;
    }
    this.state.activeSession = { index: idx, date: this.todayKey, doneSets: {}, finished: false, startedAt: Date.now() };
    this.sessionIndex = idx;
    this.sessionClock = 0;
    this.save();
    return this.state.activeSession;
  }

  currentDoneMap() {
    return this.state.activeSession?.doneSets || {};
  }

  countDone(session, idx) {
    const map = this.state.sessions?.[`${this.todayKey}_d${idx}`]?.doneSets || this.currentDoneMap();
    if (!session) return 0;
    return session.items.reduce((a, i) => a + (map[i.id] || 0), 0);
  }

  toggleSet(itemId, setIdx) {
    const a = this.state.activeSession;
    if (!a) return;
    const keepY = window.scrollY || 0;
    const cur = a.doneSets[itemId] || 0;
    a.doneSets[itemId] = setIdx < cur ? setIdx : setIdx + 1;
    this.saveSoon();
    this.renderView();
    this.afterRender();
    window.scrollTo(0, keepY);
  }

  completeSet(itemId) {
    const a = this.state.activeSession;
    if (!a) return;
    a.doneSets[itemId] = (a.doneSets[itemId] || 0) + 1;
    this.saveSoon();
    const plan = this.state.plan;
    const session = plan.sessions[a.index];
    const item = session.items.find((i) => i.id === itemId);
    const done = session.items.reduce((x, i) => x + (a.doneSets[i.id] || 0), 0);
    const total = session.items.reduce((x, i) => x + i.sets, 0);
    if (item && item.rest) {
      const sec = parseRestSec(item.rest);
      if (sec) this.startTimer(sec);
    }
    if (done >= total) {
      this.coachSays('全做完了。按结束记录，别再加戏。');
      this.toast('全部组数完成，点「结束并记录」。', this.coach.id);
    }
    this.renderView();
    this.afterRender();
    const cur = $('#ex-' + itemId);
    if (cur) cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  finishSession() {
    const a = this.state.activeSession;
    if (!a) return;
    const plan = this.state.plan;
    const session = plan?.sessions?.[a.index];
    // 计划可能已被重新生成 / 变短，旧会话找不到对应的课：安全收尾，不崩
    if (!session) {
      this.state.activeSession = null;
      this.sessionClock = 0;
      this.save();
      this.toast('这节课已经不在当前计划里了，已结束本次会话。', this.coach.id);
      this.go('train');
      return;
    }
    const rawDone = session.items.reduce((x, i) => x + (a.doneSets[i.id] || 0), 0);
    const total = session.items.reduce((x, i) => x + i.sets, 0);
    const done = Math.min(rawDone, total);
    const ratio = total ? Math.min(100, Math.round((done / total) * 100)) : 0;
    const key = this.todayKey;
    const prev = this.state.sessions[key] || { ratio: 0, doneSets: 0, sessionsToday: 0 };
    this.state.sessions[key] = {
      title: session.title,
      doneSets: Math.min((prev.doneSets || 0) + done, (prev.totalSets || 0) + total),
      totalSets: total,
      ratio: Math.min(100, Math.max(prev.ratio || 0, ratio)),
      minutes: Math.round(this.sessionClock / 60),
      at: Date.now(),
      sessionsToday: (prev.sessionsToday || 0) + 1,
    };
    this.state.totalSessions = (this.state.totalSessions || 0) + 1;
    this.state.weekSessions = (this.state.weekSessions || 0) + 1;
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const last = this.state.lastTrainedDate;
    if (!last) this.state.streak = 1;
    else {
      const d = daysBetween(new Date(last), new Date());
      this.state.streak = d <= 1 ? (this.state.streak || 0) + 1 : 1;
    }
    this.state.bestStreak = Math.max(this.state.bestStreak || 0, this.state.streak);
    this.state.lastTrainedDate = key;
    this.state.activeSession = { ...a, finished: true };
    this.save();

    const before = this.state.pet;
    if (this.state.pet) {
      const res = onWorkoutDone(this.state.pet, { ratio: ratio / 100, minutes: Math.round(this.sessionClock / 60) });
      this.state.pet = res.pet;
      this.save();
      this.toast(`记录完成。${this.state.pet.name} 羁绊 +${res.bondGain}`, this.coach.id);
    } else {
      this.toast('记录完成。', this.coach.id);
    }
    this.openFinishModal({ session, done, total, ratio, bondGain: this.state.pet ? this.state.pet.bond - (before?.bond || 0) : 0 });
    this.stopTimer();
    this.renderView();
    this.afterRender();
  }

  setPlanTab(i) {
    this.planTab = i;
    if (this.state.plan?.sessions?.[i]) {
      this.sessionIndex = i;
    }
    this.renderView();
    this.afterRender();
  }

  /* ---------- 计时器 ---------- */
  startTimer(sec) {
    this.stopTimer();
    this.timer = { running: true, left: sec, total: sec, handle: null };
    this.announceTimer(`休息 ${sec} 秒开始`);
    this.timer.handle = setInterval(() => {
      this.timer.left -= 1;
      if (this.timer.left <= 0) {
        this.stopTimer();
        this.timer.left = 0;
        this.timer.running = false;
        this.updateTimerUI();
        this.announceTimer('休息结束，下一组');
        this.toast('休息结束，下一组。', this.coach.id);
        this.beep();
        return;
      }
      if (this.timer.left === 10) this.announceRestCountdown();
      this.updateTimerUI();
    }, 1000);
    this.updateTimerUI();
  }

  stopTimer() {
    if (this.timer.handle) clearInterval(this.timer.handle);
    this.timer.handle = null;
    this.timer.running = false;
  }

  toggleTimer() {
    if (this.timer.running) {
      this.stopTimer();
    } else {
      this.startTimer(this.timer.left > 0 ? this.timer.left : 60);
    }
    this.updateTimerUI();
  }

  resetTimer() {
    this.stopTimer();
    this.timer.left = this.timer.total || 60;
    this.updateTimerUI();
  }

  updateTimerUI() {
    const t = $('#rt-time');
    if (t) t.textContent = fmtSec(this.timer.left);
    const btn = $('#timer-toggle');
    if (btn) btn.textContent = this.timer.running ? '暂停' : '开始';
    const box = $('#rest-timer');
    if (box) box.classList.toggle('is-running', this.timer.running);
  }

  /* ---------- 番茄钟 ---------- */
  toggleFocusZen() {
    this.focusZen = !this.focusZen;
    document.body.classList.toggle('focus-zen', this.focusZen);
    this.renderView();
    this.afterRender();
  }

  focusStart() {
    if (this.focus.left <= 0) this.focus = switchMode(this.focus, this.focus.mode);
    this.focus = startFocus(this.focus, Date.now());
    if (this.music.pausedForBreak && this.music.currentId) {
      this.music.pausedForBreak = false;
      this.playMusic(this.music.currentId);
    }
    this.state.focusSettings = { ...this.focus.settings };
    this.save();
    this.saveFocusRuntime();
    this.startFocusTick();
    this.patchFocus();
  }

  focusPause() {
    this.focus = pauseFocus(this.focus, Date.now());
    this.stopFocusTick();
    this.saveFocusRuntime();
    this.patchFocus();
  }

  focusReset() {
    this.stopFocusTick();
    this.focus = switchMode(this.focus, this.focus.mode);
    this.saveFocusRuntime();
    this.patchFocus();
  }

  focusSkip() {
    this.finishFocus(true);
  }

  focusMode(mode) {
    if (!MODES[mode]) return;
    this.stopFocusTick();
    this.focus = switchMode(this.focus, mode, this.state.focusSettings);
    this.saveFocusRuntime();
    this.renderView();
    this.afterRender();
  }

  focusPreset(mode, minutes) {
    if (!MODES[mode]) return;
    this.focus = setDuration(this.focus, mode, minutes);
    this.state.focusSettings = { ...this.focus.settings };
    this.saveFocusRuntime();
    this.renderView();
    this.afterRender();
    this.toast(`${MODES[mode].label}时长改为 ${minutes} 分钟。`, this.coach.id);
  }

  setFocusIntent(value) {
    this.state.focusIntent = String(value || '').trim().slice(0, 40);
    this.save();
  }

  saveFocusRuntime() {
    this.state.focusRuntime = serializeFocus(this.focus);
    this.save();
  }

  startFocusTick() {
    this.stopFocusTick();
    if (!this.focus.running) return;
    this._focusTimer = setInterval(() => this.focusTick(), 1000);
    this.patchFocus();
  }

  stopFocusTick() {
    if (this._focusTimer) clearInterval(this._focusTimer);
    this._focusTimer = null;
    this.focusZen = false;
    this.music = { tracks: [], queue: [], index: -1, currentId: null, currentUrl: null, playing: false, embed: this.state.musicEmbed || '' };
    this.audio = null;
    this.workoutFocusOpen = false;
    this.exerciseDetailId = null;
    this.exerciseReturn = 'train';
    this.photoCompare = [];
  }

  focusTick() {
    const { timer, done } = tickFocus(this.focus, Date.now());
    this.focus = timer;
    if (done) {
      this.finishFocus(false);
      return;
    }
    this.patchFocus();
  }

  finishFocus(skipped = false) {
    const wasFocus = this.focus.mode === 'focus' && !skipped;
    this.stopFocusTick();
    if (wasFocus) {
      const rec = { date: this.todayKey, minutes: this.focus.settings.focus, at: Date.now() };
      this.state.focusHistory = [...(this.state.focusHistory || []), rec].slice(-500);
      this.state.focusSettings = { ...this.focus.settings };
      this.save();
    }
    this.focus = completeFocus(this.focus);
    this.saveFocusRuntime();
    if (this.view === 'focus') {
      this.renderView();
      this.afterRender();
    }
    if (wasFocus) {
      this.toast('一个番茄完成，休息一下。', this.coach.id);
      this.coachSays('专注这一格完成了。休息不是偷懒，是下一组的准备。');
      notifyDue('专注结束', '这一格完成了，起来走两步。');
      if (this.state.focusSound !== false) this.beep();
      if (this.state.musicDuck !== false && this.audio && !this.audio.paused) {
        this.audio.pause();
        this.music.pausedForBreak = true;
      }
    } else if (!skipped) {
      this.toast('休息结束，回到专注。', this.coach.id);
      if (this.state.focusSound !== false) this.beep();
    }
    if (!skipped && this.state.focusAutoStart && this.view === 'focus') {
      setTimeout(() => { if (this.view === 'focus' && !this.focus.running) this.focusStart(); }, 700);
    }
  }

  patchFocus() {
    const clock = $('#focus-clock');
    if (!clock) return;
    const t = this.focus;
    const mode = MODES[t.mode] || MODES.focus;
    clock.textContent = formatClock(t.left);
    const ring = $('#focus-ring');
    if (ring) {
      const circ = 2 * Math.PI * 52;
      ring.setAttribute('stroke-dashoffset', String((circ * (1 - progressOf(t))).toFixed(1)));
    }
    const status = $('#focus-status');
    if (status) {
      status.textContent = t.running ? `${mode.label}中 · 别碰手机` : t.left === 0 ? '这一格结束' : '准备好就开始';
    }
    const btn = $('#focus-toggle');
    if (btn) {
      btn.dataset.act = t.running ? 'focus-pause' : 'focus-start';
      btn.innerHTML = t.running ? '❚❚' : '▶';
      btn.setAttribute('aria-label', t.running ? '暂停' : '开始');
    }
    const chip = $('#focus-countdown');
    if (chip) {
      chip.hidden = !t.running;
      chip.textContent = t.running ? `🍅 ${formatClock(t.left)}` : '';
    }
    document.title = t.running ? `${formatClock(t.left)} · 专注 · 五指山` : '五指山 · 谭师道场';
    const cycle = $('#focus-cycle');
    if (cycle) {
      const cycles = t.settings?.cycles || 4;
      const done = (t.cycle || 0) % cycles;
      cycle.innerHTML = `${Array.from({ length: cycles }, (_, i) => `<span class="focus-dot ${i < done ? 'is-on' : ''}"></span>`).join('')}<span class="tiny muted">${done}/${cycles}</span>`;
    }
  }

  beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.08, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.start(); o.stop(ctx.currentTime + 0.42);
    } catch (e) { /* 静默 */ }
  }

  /* ---------- 宠物 ---------- */
  care(action) {
    if (!this.state.pet) return this.go('adopt');
    const res = interact(this.state.pet, action);
    if (!res.ok) {
      this.toast(res.msg, this.coach.id);
      return;
    }
    this.state.pet = res.pet;
    this.save();
    this.toast(res.msg, this.coach.id);
    const stage = $('#pet-stage');
    if (stage) {
      stage.classList.add('is-happy');
      this.animateCare(action);
    }
    // 局部更新：只改受影响的节点，不整页重绘，避免打断待机/行为
    this.patchPetView();
    const stage2 = $('#pet-stage');
    if (stage2) stage2.classList.add('is-happy');
    setTimeout(() => { const s2 = $('#pet-stage'); if (s2) s2.classList.remove('is-happy'); }, 700);
  }

  patchPetView() {
    const pet = this.state.pet;
    if (!pet) return;
    const ps = petSummary(pet);
    const s = this.state;
    const sub = $('[data-role="pet-sub"]');
    if (sub) sub.textContent = `${ps.type.species} · ${ps.stage.name} · 羁绊 ${Math.round(pet.bond)}`;

    const moodInfo = MOODS[ps.mood];
    const pill = $('.pet-mood-pill');
    if (pill && moodInfo) {
      pill.className = `pill pet-mood-pill ${ps.mood === 'hungry' ? 'red' : ps.mood === 'ecstatic' ? 'gold' : 'jade'}`;
      pill.textContent = `${moodInfo.emoji} ${moodInfo.label}`;
    }

    $$('.ap-dot').forEach((el, i) => el.classList.toggle('is-on', i < (pet.carePoints || 0)));

    for (const [key, val] of [['sat', pet.satiety], ['mood', pet.mood], ['energy', pet.energy]]) {
      const card = $(`[data-stat="${key}"]`);
      if (!card) continue;
      const v = Math.max(0, Math.min(100, Math.round(Number(val) || 0)));
      const num = card.querySelector('.ps-val');
      if (num) num.textContent = v;
      const bar = card.querySelector('.ps-bar i');
      if (bar) bar.style.width = `${v}%`;
    }

    const bestWeight = (s.setLogs || []).reduce((m, l) => Math.max(m, Number(l.weight) || 0), 0);
    const stageInner = $('#pet-stage-inner');
    if (stageInner) {
      stageInner.innerHTML = petSVG(pet.typeId, {
        pet, size: 268, scene: true, outfit: activeOutfit(pet),
        meta: { streak: s.streak || 0, weekSessions: s.weekSessions || 0, totalSessions: s.totalSessions || 0, bestWeight },
      });
    }

    const line = $('.pet-line');
    if (line) {
      line.textContent = `“${petLine(pet)}”`;
      this._petBaseLine = line.textContent;
    }

    const bond = $('[data-role="bond-track"]');
    if (bond) {
      bond.innerHTML = `<div class="bt-row"><span>${esc(ps.stage.name)}</span><span>${ps.nextStage ? `下一阶段「${esc(ps.nextStage.name)}」还差 ${ps.nextStage.min - Math.round(pet.bond)}` : '已满级'}</span></div>
        <div class="bt-bar"><i style="width:${Math.round(ps.stageProgress * 100)}%"></i></div>`;
    }
    const tags = $('[data-role="pet-stage-tags"]');
    if (tags) {
      tags.innerHTML = `<span class="pill ghost">${esc(ps.stage.name)}</span><span class="pill ghost">羁绊 ${Math.round(pet.bond)}</span><span class="pill ghost">点它一下</span>`;
    }
    const cp = $('[data-role="care-points"]');
    if (cp) cp.textContent = `行动点 ${pet.carePoints || 0}/5`;
    $$('.care-btn').forEach((b) => b.classList.toggle('is-dim', (pet.carePoints || 0) < (Number(b.dataset.cost) || 0)));

    this.checkPetEvolution();
    this.applyPetBehavior(this.petBehaviorNow());
  }

  tapPet() {
    const pet = this.state.pet;
    if (!pet) return;
    const lines = {
      ecstatic: ['它开心得原地转圈，差点撞到你。', '它把肚皮翻给你，这是最高信任。'],
      happy: ['它把头往你手心里顶。', '它眯起眼，尾巴拍了两下地板。'],
      calm: ['它看了你一眼，又靠过来一点。', '它安静地待着，但没走开。'],
      bored: ['它打了个哈欠，示意你该带它练了。', '它把屁股对着你——不是讨厌你，是无聊。'],
      hungry: ['它盯着你的手，发现没有吃的，有点失望。', '它舔了舔鼻子，提醒你它饿了。'],
      tired: ['它半睁着眼蹭了蹭你，然后继续睡。', '它翻了个身，把爪子搭在你手上。'],
    };
    const mood = moodOf(pet);
    const pool = lines[mood] || lines.calm;
    const line = pool[Math.floor(Math.random() * pool.length)];
    const stage = $('#pet-stage');
    if (stage) {
      stage.classList.add('is-tapped');
      setTimeout(() => stage.classList.remove('is-tapped'), 700);
    }
    const lineEl = $('.pet-line');
    if (lineEl) {
      lineEl.textContent = `“${line}”`;
      lineEl.classList.remove('is-pop');
      void lineEl.offsetWidth;
      lineEl.classList.add('is-pop');
    }
    this.animateCare('pet');
    this.coachSays(line);
  }

  animateCare(action) {
    const stage = $('#pet-stage');
    if (!stage) return;
    const icons = { feed: '🍖', play: '🎾', pet: '❤️', bath: '🛁', rest: '💤' };
    const fly = document.createElement('div');
    fly.className = 'care-fly';
    fly.textContent = icons[action] || '✨';
    fly.style.cssText = 'position:absolute;left:50%;top:70%;font-size:26px;z-index:5;pointer-events:none;transform:translateX(-50%);animation:care-fly .9s ease-out forwards;';
    stage.appendChild(fly);
    setTimeout(() => fly.remove(), 950);
  }

  /* ---------- 宠物行为状态机 ---------- */
  petBehaviorNow() {
    return pickPetBehavior(this.state.pet || {}, {
      trainedToday: Boolean(this.state.sessions?.[this.todayKey]),
      streak: this.state.streak || 0,
    });
  }

  startPetBehavior() {
    this.stopPetBehavior();
    if (this.view !== 'pet' || !this.state.pet) return;
    this._petBaseLine = $('.pet-line')?.textContent || '';
    const tick = () => {
      if (this.view !== 'pet' || !$('#pet-stage-inner')) return;
      this.applyPetBehavior(this.petBehaviorNow());
      this._petBehaviorTimer = setTimeout(tick, 9000 + Math.random() * 5000);
    };
    this._petBehaviorTimer = setTimeout(tick, 1200);
  }

  stopPetBehavior() {
    clearTimeout(this._petBehaviorTimer);
    this._petBehaviorTimer = null;
  }

  applyPetBehavior(b) {
    const inner = $('#pet-stage-inner');
    if (!inner || !b) return;
    inner.dataset.behavior = b.key;
    const ch = inner.querySelector('.pet-character');
    if (ch) ch.style.translate = `${b.x}px 0`;
    const line = $('.pet-line');
    if (b.line && line) {
      line.textContent = `“${b.line}”`;
      line.classList.remove('is-pop');
      void line.offsetWidth;
      line.classList.add('is-pop');
    } else if (!b.line && line && this._petBaseLine) {
      line.textContent = this._petBaseLine;
    }
    if (b.key === 'idle') this.petIdleTick();
  }

  repairStreak() {
    const check = canRepairStreak(this.state);
    if (!check.ok) {
      this.toast(check.reason, this.coach.id);
      return;
    }
    this.state = repairStreak(this.state, Date.now());
    this.save();
    this.renderView();
    this.afterRender();
    this.toast('补签成功。连续天数回来了，下次别断。', this.coach.id);
  }

  async enableRemind() {
    if (typeof Notification === 'undefined') {
      this.toast('这个浏览器不支持通知。先收藏页面吧。', this.coach.id);
      return;
    }
    let permission = 'denied';
    try {
      permission = await Notification.requestPermission();
    } catch (e) {
      permission = 'denied';
    }
    this.state.settings = { ...this.state.settings, remind: permission === 'granted' };
    this.save();
    this.renderView();
    this.afterRender();
    if (permission === 'granted') {
      this.toast('提醒开了。三天没练，我会喊你。', this.coach.id);
      this.maybeNotify();
    } else {
      this.toast('没开成。你可以在浏览器设置里允许通知后再试。', this.coach.id);
    }
  }

  async installApp() {
    const ok = await promptInstall();
    this.installAvailable = canInstall();
    if (ok) this.toast('安装入口已打开。装到桌面，打开更快。', this.coach.id);
    else this.toast('浏览器还没给安装入口，多访问两次再试。', this.coach.id);
    this.renderView();
    this.afterRender();
  }

  maybeNotify() {
    if (!this.state.settings?.remind) return;
    if (typeof Notification === 'undefined') return;
    const decision = shouldNotify(this.state, {
      permission: Notification.permission,
      lastNotified: this.state.lastRemindedDate || '',
    });
    if (!decision.notify) return;
    notifyDue(decision.title, decision.body);
    this.state.lastRemindedDate = this.todayKey;
    this.save();
  }

  exportCsv() {
    const csv = toCSV(this.state.setLogs || []);
    this.lastCsv = csv;
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `wuzhishan-log-${todayKey()}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    this.toast('CSV 导出了，Excel 能直接开。', this.coach.id);
  }

  setOutfit(key) {
    if (!this.state.pet) return;
    if (!canUseOutfit(key, this.state)) {
      this.toast('这件还没解锁。多练几次。', this.coach.id);
      return;
    }
    this.state.pet = { ...this.state.pet, outfit: { key } };
    this.save();
    this.renderView();
    this.afterRender();
    this.toast('换好了。', this.coach.id);
  }

  checkPetEvolution() {
    const pet = this.state.pet;
    if (!pet) return;
    const stage = stageOf(pet.bond).stage;
    if (this._petStageSeen && stage > this._petStageSeen) {
      const el = $('#pet-stage');
      if (el) {
        el.classList.add('is-evolving');
        setTimeout(() => el.classList.remove('is-evolving'), 2200);
      }
      this.coachSays('它长大了。别光看着，继续练。');
    }
    this._petStageSeen = stage;
  }

  setBodyField(key, val) {
    const body = { ...(this.state.profile.body || {}) };
    if (key === 'sex' || key === 'activity') {
      body[key] = val;
    } else {
      const n = Number(val);
      body[key] = val === '' || !Number.isFinite(n) ? undefined : n;
    }
    this.state.profile = { ...this.state.profile, body };
    this.save();
    this.renderView();
    this.afterRender();
  }

  async addPhotoFile(file) {
    const date = $('#photo-date')?.value || this.todayKey;
    const angle = $('#photo-angle')?.value || 'front';
    const status = $('#photo-status');
    if (!/^image\//.test(file.type || '')) {
      this.toast('只能选图片文件。', this.coach.id);
      return;
    }
    if (status) status.textContent = '压缩中…';
    try {
      const blob = await compressImage(file);
      await addPhoto({ blob, date, angle });
      if (status) status.textContent = '';
      this.toast('照片已存到本机。', this.coach.id);
      await this.loadPhotos();
    } catch (e) {
      if (status) status.textContent = '';
      this.toast(e.message || '照片保存失败。', this.coach.id);
    }
  }

  async loadPhotos() {
    const grid = $('#photo-grid');
    if (!grid) return;
    const dateInput = $('#photo-date');
    if (dateInput && !dateInput.value) dateInput.value = this.todayKey;
    try {
      const rows = await listPhotos();
      (this._photoUrls || []).forEach((u) => URL.revokeObjectURL(u));
      this._photoUrls = [];
      if (!rows.length) {
        grid.innerHTML = '<span class="small muted">还没有照片。第一次记录，之后才有对比。</span>';
        return;
      }
      grid.innerHTML = rows.map((r) => {
        const url = URL.createObjectURL(r.blob);
        this._photoUrls.push(url);
        const angleLabel = PHOTO_ANGLES.find((a) => a.key === r.angle)?.label || '';
        return `<div class="photo-item ${this.photoCompare.includes(r.id) ? 'is-compare' : ''}">
          <button class="photo-thumb" data-act="photo-view" data-id="${r.id}" title="查看大图"><img src="${url}" alt="${esc(r.date)} ${esc(angleLabel)}" /></button>
          <span class="photo-meta">${esc(r.date.slice(5))} · ${esc(angleLabel)}</span>
          <button class="photo-compare" data-act="photo-compare" data-id="${r.id}" title="选入对比">${this.photoCompare.includes(r.id) ? '已选' : '对比'}</button>
          <button class="photo-del" data-act="photo-delete" data-id="${r.id}" title="删除这张">×</button>
        </div>`;
      }).join('');
    } catch (e) {
      grid.innerHTML = '<span class="small muted">当前浏览器不支持本地照片存储，或照片库读取失败。</span>';
    }
  }

  async togglePhotoCompare(id) {
    const at = this.photoCompare.indexOf(id);
    if (at >= 0) this.photoCompare.splice(at, 1);
    else {
      if (this.photoCompare.length >= 2) this.photoCompare.shift();
      this.photoCompare.push(id);
    }
    if (this.photoCompare.length === 2) {
      await this.openPhotoCompare();
    } else {
      await this.loadPhotos();
      this.toast('再选一张，就能并排对比。', this.coach.id);
    }
  }

  async openPhotoCompare() {
    try {
      const rows = await Promise.all(this.photoCompare.map((id) => getPhoto(id)));
      if (rows.some((r) => !r)) return this.toast('有照片找不到了，重新选一下。', this.coach.id);
      const urls = rows.map((r) => URL.createObjectURL(r.blob));
      this._compareUrls = urls;
      this.openModal(`
        <div class="modal-head">
          <div><span class="eyebrow">照片对比</span><h2>${rows[0].date} → ${rows[1].date}</h2></div>
          <button class="icon-btn" data-act="close-modal">✕</button>
        </div>
        <div class="photo-compare-grid">${rows.map((r, i) => `<figure><img src="${urls[i]}" alt="${esc(r.date)} ${esc(r.angle)}" /><figcaption>${esc(r.date)} · ${esc(PHOTO_ANGLES.find((a) => a.key === r.angle)?.label || '')}</figcaption></figure>`).join('')}</div>
        <p class="tiny muted mt-s">同一角度、相近光线下的对比更有参考价值。照片只存本机。</p>
      `);
      this.photoCompare = [];
      await this.loadPhotos();
    } catch (e) {
      this.toast('照片对比打开失败。', this.coach.id);
    }
  }

  async exportAllBackup() {
    try {
      const entries = [
        { name: 'wuzhishan-backup.json', data: JSON.stringify({ format: 'wuzhishan-backup', version: 1, exportedAt: new Date().toISOString(), state: this.state }, null, 2) },
        { name: 'README.txt', data: '五指山完整备份\n\n- wuzhishan-backup.json：文字数据（可在应用「导入备份」恢复）\n- photos/：进度照片（原图）\n- music/：本地音乐（原文件）\n\n照片与音乐需手动放回或重新导入；JSON 不包含媒体。\n' },
      ];
      const photos = await listPhotos();
      for (const p of photos) {
        const buf = await p.blob.arrayBuffer();
        entries.push({ name: `photos/${p.date}-${p.angle}-${p.id}.jpg`, data: new Uint8Array(buf) });
      }
      const tracks = await listTracks();
      for (const meta of tracks) {
        const row = await getTrack(meta.id);
        if (!row?.blob) continue;
        const buf = await row.blob.arrayBuffer();
        const name = String(row.file || `${row.name}.mp3`).replace(/[\\/:*?"<>|]/g, '_');
        entries.push({ name: `music/${name}`, data: new Uint8Array(buf) });
      }
      const bytes = createZip(entries);
      const blob = new Blob([bytes], { type: 'application/zip' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `wuzhishan-backup-${this.todayKey}.zip`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      this.toast(`完整备份 ZIP 已导出：${entries.length} 个文件。`, this.coach.id);
    } catch (e) {
      this.toast('完整备份失败：' + (e.message || '浏览器限制'), this.coach.id);
    }
  }

  async openPhotoModal(id) {
    try {
      const row = await getPhoto(id);
      if (!row) return this.toast('照片找不到了。', this.coach.id);
      const url = URL.createObjectURL(row.blob);
      this._photoModalUrl = url;
      const angleLabel = PHOTO_ANGLES.find((a) => a.key === row.angle)?.label || '';
      this.openModal(`
        <div class="modal-head">
          <div><span class="eyebrow">进度照片</span><h2>${esc(row.date)} · ${esc(angleLabel)}</h2></div>
          <button class="icon-btn" data-act="close-modal">✕</button>
        </div>
        <img src="${url}" alt="进度照片" style="width:100%;border-radius:12px;display:block" />
        <p class="tiny muted mt-s">只存在本机，导出 JSON 不包含照片。</p>
      `);
    } catch (e) {
      this.toast('照片读取失败。', this.coach.id);
    }
  }

  async deletePhotoById(id) {
    try {
      await deletePhoto(id);
      await this.loadPhotos();
      this.toast('照片删了。', this.coach.id);
    } catch (e) {
      this.toast('删除失败。', this.coach.id);
    }
  }

  async clearAllPhotos() {
    if (!window.confirm('清空全部进度照片？不能恢复。')) return;
    try {
      await clearPhotos();
      await this.loadPhotos();
      this.toast('照片清空了。', this.coach.id);
    } catch (e) {
      this.toast('清空失败。', this.coach.id);
    }
  }

  /* ---------- 音乐 ---------- */
  ensureAudio() {
    if (!this.audio) {
      this.audio = new Audio();
      this.audio.volume = Number(this.state.musicVolume) || 0.8;
      this.audio.addEventListener('ended', () => this.onMusicEnded());
      this.audio.addEventListener('play', () => { this.music.playing = true; try { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; } catch (e) { /* ignore */ } this.renderMusicDock(); });
