      pet: pet ? `${pet.name}的状态我都看着。点我，我告诉你它缺什么。` : '去领一只。',
      coach: '想换人？点我，五个教练随你挑。',
      progress: '记录不会骗人。要不要看看哪周你偷懒了？',
      adopt: '选宠物别选好看的，选你练得动的。',
    }[this.view] || '点我，伸只手看看。';
    return lines;
  }

  coachSays(text, dur = 6000) {
    const bubble = $('#coach-bubble');
    if (!bubble) return;
    $('#coach-bubble-text').textContent = text;
    bubble.classList.remove('is-quiet');
    clearTimeout(this._bubbleT);
    if (dur > 0) this._bubbleT = setTimeout(() => bubble.classList.add('is-quiet'), dur);
  }

  greeting() {
    const s = this.state;
    const style = this.coach.style;
    if (!s.plan) {
      return { roast: '没计划？行，先给你排一个，别问东问西。', science: '缺少训练变量。先建立基线。', warm: '我们先做一个简单的计划，好么？', drill: '无计划。立即建立。' }[style];
    }
    if (!s.pet) {
      return { roast: '计划有了，宠物没有。它比你会催你。', science: '计划已就绪，缺一个外部监督变量。', warm: '要不要领一只宠物？它会陪着你。', drill: '计划就绪。配一只宠物，执行更有约束。' }[style];
    }
    return {
      roast: `${s.pet.name}在看着你。练不练？`,
      science: '数据齐了。今天按计划执行。',
      warm: '今天也一起，慢慢来。',
      drill: '开始执行。',
    }[style];
  }

  /* ---------- 全局事件 ---------- */
  bindGlobal() {
    document.addEventListener('click', (e) => {
      const nav = e.target.closest('[data-nav]');
      if (nav) {
        e.preventDefault();
        this.go(nav.dataset.nav);
        return;
      }
      const pick = e.target.closest('[data-pick]');
      if (pick) {
        this.pickProfile(pick.dataset.pick, pick.dataset.val);
        return;
      }
      const tab = e.target.closest('[data-tab]');
      if (tab) {
        this.planTab = Number(tab.dataset.tab);
        this.renderView();
        this.afterRender();
        return;
      }
      const act = e.target.closest('[data-act]');
      if (act) {
        e.preventDefault();
        this.handleAction(act, e);
        return;
      }
      // 五指山内部：手指导航 / 直接点手指
      const hf = e.target.closest('.hf-nav');
      if (hf && hf.dataset.hf) {
        this.selectFinger(hf.dataset.hf);
        return;
      }
      const fingerNode = e.target.closest('.hand-svg .finger');
      if (fingerNode && fingerNode.dataset.finger && fingerNode.dataset.finger !== 'thumb') {
        this.selectFinger(fingerNode.dataset.finger);
        return;
      }
      // 标注模式：点标注块 → 打开五指山
      if (this.annoOpen) {
        const anno = e.target.closest('.anno-target');
        if (anno) {
          e.preventDefault();
          const map = { goal: 'shan', days: 'shan', equipment: 'wu', 'exercise-list': 'wu', 'today-session': 'xi', 'pet-bond': 'xin', heatmap: 'shan', 'session-structure': 'shan', warmup: 'xi' };
          this.openFinger('anno', { zone: this.view === 'adopt' ? 'pet' : this.view, finger: map[anno.dataset.anno] || null });
          return;
        }
      }
    });

    window.addEventListener('hashchange', () => {
      const name = (location.hash || '#home').replace('#', '');
      if (name !== this.view && VIEWS[name]) this.go(name, { skipHash: true });
    });

    // 关页 / 切后台时把延迟写盘刷掉，避免丢最后一次打卡
    window.addEventListener('pagehide', () => this.flushSave());
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') this.flushSave();
    });

    $('#coach-avatar')?.addEventListener('click', () => this.openFinger('corner'));
    $('#drawer-close')?.addEventListener('click', () => this.closeDrawer());
    $('#drawer-scrim')?.addEventListener('click', () => this.closeDrawer());
    $('#coach-drawer-close')?.addEventListener('click', () => this.closeCoachDrawer());
    $('#coach-scrim')?.addEventListener('click', () => this.closeCoachDrawer());
    $('#drawer')?.addEventListener('keydown', (e) => trapFocus(e, $('#drawer')));
    $('#coach-drawer')?.addEventListener('keydown', (e) => trapFocus(e, $('#coach-drawer')));
    $('#anno-toggle')?.addEventListener('click', () => this.toggleAnno());
    $('#drawer-anno')?.addEventListener('click', () => this.toggleAnno(true));

    $$('.dtab').forEach((btn) => btn.addEventListener('click', () => this.switchDrawerTab(btn.dataset.dtab)));

    $('#chat-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = $('#chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      this.sendChat(text);
    });

    document.addEventListener('keydown', (e) => {
      const action = resolveShortcut(e, this.shortcutContext(e));
      if (!action) return;
      e.preventDefault();
      this.runShortcut(action);
    });
  }

  shortcutContext(e) {
    const el = e?.target;
    const tag = el?.tagName;
    const inEditable = Boolean(el && (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable));
    return {
      inEditable,
      view: this.view,
      drawerOpen: !($('#drawer')?.hidden ?? true),
      modalOpen: Boolean($('#modal-root')?.innerHTML),
      hasPlan: Boolean(this.state.plan),
      activeSession: Boolean(this.state.activeSession && !this.state.activeSession.finished),
    };
  }

  runShortcut(action) {
    if (action === 'close-layer') {
      if ($('#modal-root')?.innerHTML) this.closeModal();
      else this.closeDrawer();
      return;
    }
    if (action === 'open-shortcuts') { this.openShortcutsModal(); return; }
    if (action === 'open-chat') { this.openFinger('corner', { tab: 'chat' }); return; }
    if (action === 'toggle-anno') { this.toggleAnno(); return; }
    if (action === 'timer-toggle') {
      this.toggleTimer();
      this.toast(this.timer.running ? '计时开始。' : '计时暂停。', this.coach.id);
      return;
    }
    if (action === 'next-set') {
      const card = $('.exercise-card.is-current') || $('.exercise-card:not(.is-done)');
      if (card) { card.scrollIntoView({ block: 'center', behavior: 'smooth' }); this.toast('下一组在眼前了。', this.coach.id); }
      else this.toast('今天的组都完成了。', this.coach.id);
      return;
    }
    if (action.startsWith('finger:')) {
      const finger = action.split(':')[1];
      if (!$('#drawer') || $('#drawer').hidden) this.openFinger('corner', { finger });
      else this.selectFinger(finger);
    }
  }

  openReportModal(kind) {
    const report = buildReport(this.state, { kind, coach: this.coach });
    const html = renderReportHTML(report, { coach: this.coach });
    this.lastReportHTML = html;
    this.lastReportName = `wuzhishan-${kind}-${report.range.from}.html`;
    this.openModal(`
      <div class="modal-head">
        <div>
          <span class="eyebrow">训练报告</span>
          <h2 style="margin-top:4px">${esc(report.kindLabel)} · ${esc(report.range.from)} 至 ${esc(report.range.to)}</h2>
          <p class="small muted">${report.summary.sessions} 次训练 · ${report.summary.volume}kg 容量 · 完成度 ${Math.round(report.summary.compliance * 100)}%</p>
        </div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      <iframe id="report-frame" class="report-frame" title="训练报告预览"></iframe>
      <div class="modal-foot" style="flex-wrap:wrap;gap:8px">
        <button class="btn btn-ghost" data-act="close-modal">关闭</button>
        <button class="btn btn-ghost" data-act="download-report">下载 HTML</button>
        <button class="btn btn-primary" data-act="print-report">打印 / 存为 PDF</button>
      </div>
    `);
    const frame = $('#report-frame');
    if (frame) frame.srcdoc = html;
  }

  printReport() {
    const frame = $('#report-frame');
    try {
      frame.contentWindow.focus();
      frame.contentWindow.print();
    } catch (e) {
      this.toast('浏览器阻止了打印，请下载 HTML 后用 Ctrl+P。', this.coach.id);
    }
  }

  downloadReport() {
    if (!this.lastReportHTML) return;
    const blob = new Blob([this.lastReportHTML], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = this.lastReportName || 'wuzhishan-report.html';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    this.toast('报告已下载，打开后 Ctrl+P 可存 PDF。', this.coach.id);
  }

  openShortcutsModal() {
    this.openModal(`
      <div class="modal-head">
        <div>
          <span class="eyebrow">键盘</span>
          <h2 style="margin-top:4px">快捷键</h2>
          <p class="small muted">输入框里不会触发；弹层打开时只响应 Esc。</p>
        </div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      <div class="kbd-list">
        ${SHORTCUT_LIST.map((s) => `<div class="kbd-row"><kbd>${esc(s.key)}</kbd><span>${esc(s.desc)}</span></div>`).join('')}
      </div>
      <div class="modal-foot"><button class="btn btn-primary" data-act="close-modal">知道了</button></div>
    `);
  }

  afterRender() {
    // 标注模式保留
    document.body.classList.toggle('anno-on', this.annoOpen);
    $$('[data-anno]').forEach((node) => node.classList.add('anno-target'));
    // 滑块的视觉填充
    $$('input[type="range"]').forEach((r) => {
      const upd = () => {
        const pct = ((r.value - r.min) / (r.max - r.min)) * 100;
        r.style.setProperty('--fill', pct + '%');
      };
      upd();
      r.addEventListener('input', upd);
      r.addEventListener('change', () => this.pickProfile(r.dataset.range || 'minutes', Number(r.value)));
    });
  }

  /* ---------- 档案交互 ---------- */
  pickProfile(key, val) {
    const p = { ...this.state.profile };
    if (key === 'equipment') {
      const set = new Set(p.equipment);
      set.has(val) ? set.delete(val) : set.add(val);
      p.equipment = [...set];
      if (!p.equipment.length) p.equipment = ['none'];
    } else if (key === 'injuries') {
      const set = new Set(p.injuries);
      set.has(val) ? set.delete(val) : set.add(val);
      p.injuries = [...set];
    } else if (key === 'minutes' || key === 'days') {
      p[key] = Number(val);
    } else {
      p[key] = val;
    }
    this.state.profile = p;
    this.save();
    if (key === 'minutes') {
      const v = $('#min-val');
      if (v) v.textContent = `${val} 分钟`;
      const pm = $('.preview-mini .pm-list');
      if (pm) this.renderView(), this.afterRender();
      return;
    }
    this.renderView();
    this.afterRender();
  }

  generatePlan() {
    const p = this.state.profile;
    if (!this.state.pet && this.adoptPick) this.adoptSilently(this.adoptPick);
    this.state.plan = generatePlan({ ...p, petId: this.state.pet?.typeId });
    this.state.profile.onboarded = true;
    this.state.profile.petId = this.state.pet?.typeId || p.petId;
    this.state.activeSession = null;
    this.sessionClock = 0;
    this.planTab = 0;
    this.sessionIndex = 0;
    this.save();
    this.go('plan');
    const issues = analyzePlan(this.state.plan, p);
    const line = issues.length
      ? `排好了。但抽空看我给你挑的 ${issues.length} 个毛病。`
      : '排好了。别急着夸我，先练两周。';
    this.toast(line, this.coach.id);
    this.coachSays(line);
  }

  /** 静默创建宠物（引导流程用），不弹出换宠提示 */
  adoptSilently(typeId) {
    const p = PET_BY_ID[typeId];
    if (!p) return;
    this.state.pet = newPetState(typeId, p.name);
    this.state.profile.petId = typeId;
    this.adoptPick = typeId;
  }

  regeneratePlan() {
    const p = this.state.profile;
    this.state.plan = generatePlan({ ...p, petId: this.state.pet?.typeId });
    // 新计划可能换了天数/动作，旧的进行中会话必须作废，否则结课时会取到不存在的课
    this.state.activeSession = null;
    this.sessionClock = 0;
    this.sessionIndex = 0;
    this.save();
    this.renderView();
    this.afterRender();
    this.toast('计划重排了。', this.coach.id);
  }

  /* ---------- 动作 ---------- */
  handleAction(node, e) {
    const act = node.dataset.act;
    switch (act) {
      case 'generate-plan': this.generatePlan(); break;
      case 'goto-builder': this.state.plan = null; this.save(); this.renderView(); this.afterRender(); break;
      case 'start-today': this.startSession(this.state.plan ? (new Date().getDay() % this.state.plan.sessions.length) : 0); break;
      case 'goto-session': this.planTab = Number(node.dataset.idx) || 0; this.go('plan'); break;
      case 'goto-train': this.go('train'); break;
      case 'open-finger': {
        const zone = node.dataset.zone || this.view;
        const finger = node.dataset.finger || null;
        this.openFinger('inline', { zone, finger });
        break;
      }
      case 'open-chat': this.openFinger('corner', { tab: 'chat' }); break;
      case 'finger-apply': this.applyActiveFinger(); break;
      case 'finger-ask': {
        const item = this.finger?.fingers.find((x) => x.finger === this.activeFinger);
        this.switchDrawerTab('chat');
        this.sendChat(`关于「${item?.title || '当前这条建议'}」，我该怎么做？`);
        break;
      }
      case 'finger-explore': {
        this.switchDrawerTab('chat');
        this.sendChat('这块地方还有别的改法吗？');
        break;
      }
      case 'ob-next': this.obNext(); break;
      case 'chat-q': this.sendChat(node.dataset.q); break;
      case 'goto-pet': this.closeModal(); this.go(this.state.pet ? 'pet' : 'adopt'); break;
      case 'open-adopt': this.go('adopt'); break;
      case 'open-coach-list': this.openCoachList(); break;
      case 'switch-coach': this.switchCoach(node.dataset.coach); break;
      case 'swap': {
        const si = Number(node.dataset.session);
        this.openSwapModal(si, node.dataset.item);
        break;
      }
      case 'show-cue': this.showCue(node.dataset.item); break;
      case 'log-set': this.openLogSetModal(node.dataset.item); break;
      case 'save-set-log': {
        const mark = node.dataset.mark !== '0';
        this.saveSetLog(node.dataset.item, mark);
        break;
      }
      case 'skip-weight': {
        const id = node.dataset.item;
        this.closeModal();
        this.completeSet(id);
        this.toast('已记一组（未记重量）。', this.coach.id);
        break;
      }
      case 'apply-swap':
        this.applySwap(Number(node.dataset.session), node.dataset.item, node.dataset.new);
        break;
      case 'save-cue-goto': {
        const text = $('#modal-root .cue-box')?.textContent?.trim();
        this.saveBookmark(text || '动作全程可控，宁可慢，不要晃。', this.coach.id);
        this.closeModal();
        break;
      }
      case 'toggle-set': {
        const item = node.dataset.item;
        const setIdx = Number(node.dataset.set);
        this.toggleSet(item, setIdx);
        break;
      }
      case 'complete-set': this.completeSet(node.dataset.item); break;
      case 'finish-session': this.finishSession(); break;
      case 'switch-day': this.setSessionIndex(Number(node.dataset.idx)); break;
      case 'timer-toggle': this.toggleTimer(); break;
      case 'timer-reset': this.resetTimer(); break;
      case 'start-timer': this.startTimer(Number(node.dataset.sec) || 60); break;
      case 'care': this.care(node.dataset.care); break;
      case 'pick-pet': this.pickPet(node.dataset.pet); break;
      case 'adopt': this.adoptPet(); break;
      case 'switch-pet-view': this.switchPetView(node.dataset.pet); break;
      case 'export-data': this.exportData(); break;
      case 'reset-data': this.confirmReset(); break;
      case 'remove-bookmark': this.removeBookmark(node.dataset.id); break;
      case 'save-bookmark': this.saveBookmark(node.dataset.text, node.dataset.coach); break;
      case 'close-modal': this.closeModal(); break;
      case 'regen-from-modal': break;
      case 'cycle-week': this.openCycleWeekModal(Number(node.dataset.week)); break;
      case 'apply-cycle-week': this.applyCycleWeek(Number(node.dataset.week)); break;
      case 'undo-cycle': this.undoCycleWeek(); break;
      case 'set-cycle': {
        const n = Number(node.dataset.weeks);
        if (![4, 8, 12].includes(n) || !this.state.plan) break;
        this.state.plan.cycleWeeks = n;
        this.state.plan.cycleWeek = Math.min(this.state.plan.cycleWeek || 1, n);
        this.save();
        this.renderView();
        this.afterRender();
        this.toast(`周期改成 ${n} 周。`, this.coach.id);
        break;
      }
      case 'open-shortcuts': this.openShortcutsModal(); break;
      case 'report-week': this.openReportModal('week'); break;
      case 'report-month': this.openReportModal('month'); break;
      case 'import-data': this.pickImportFile(); break;
      case 'confirm-import': {
        const raw = this._pendingImport;
        this._pendingImport = null;
        this.closeModal();
        if (raw) this.importBackup(raw);
        break;
      }
      case 'print-report': this.printReport(); break;
      case 'download-report': this.downloadReport(); break;
      case 'open-plan': this.go('plan'); break;
      case 'coach-says-more': this.openFinger('corner', { tab: 'chat' }); break;
      default: console.debug('未接动作', act);
    }
  }

  /* ---------- 会话 ---------- */
  startSession(index = 0) {
    if (!this.state.plan) return this.go('plan');
    const idx = index % this.state.plan.sessions.length;
    const cur = this.state.activeSession;
    if (cur && cur.index === idx && !cur.finished) {
      this.go('train');
      return;
    }
    // 今天练过同一课、且这一课已经有记录：从上次的进度继续，而不是清零
    const todayLog = this.state.sessions?.[this.todayKey];
    let doneSets = {};
    if (cur && cur.finished && cur.index === idx && cur.date === this.todayKey) {
      doneSets = this.clampDoneSets(cur.doneSets, this.state.plan.sessions[idx]);
    }
    this.state.activeSession = {
      index: idx,
      date: this.todayKey,
      doneSets,
      finished: false,
      startedAt: Date.now(),
    };
    this.sessionIndex = idx;
    this.sessionClock = 0;
    this.save();
    this.go('train');
    this.coachSays(doneSets && Object.keys(doneSets).length ? '接着上次的进度。' : '开始。第一个动作先做两组找感觉。');
  }

  setSessionIndex(idx) {
    if (!this.state.plan) return;
    this.sessionIndex = idx;
    this.startSession(idx);
  }

  /** 直接进训练页也能开始：没有进行中的会话就创建一个；已在今天练完就只展示，不重置 */
  ensureSession() {
    const plan = this.state.plan;
    if (!plan) return null;
    const a = this.state.activeSession;
    if (a && !a.finished) return a;
    const idx = (this.sessionIndex ?? 0) % plan.sessions.length;
    const doneToday = this.state.sessions?.[this.todayKey];
    if (a && a.finished && a.date === this.todayKey && a.index === idx) return a; // 保留已完成视图
    if (!a && doneToday && doneToday.ratio >= 100) {
      // 今天已经练满，不自动开新课，等用户点「再练一次」
      return null;
    }
    this.state.activeSession = { index: idx, date: this.todayKey, doneSets: {}, finished: false, startedAt: Date.now() };
    this.sessionIndex = idx;
    this.sessionClock = 0;
    this.save();
    return this.state.activeSession;
  }

  currentDoneMap() {
    return this.state.activeSession?.doneSets || {};
  }

  countDone(session, idx) {
    const map = this.state.sessions?.[`${this.todayKey}_d${idx}`]?.doneSets || this.currentDoneMap();
    if (!session) return 0;
    return session.items.reduce((a, i) => a + (map[i.id] || 0), 0);
  }

  toggleSet(itemId, setIdx) {
    const a = this.state.activeSession;
    if (!a) return;
    const keepY = window.scrollY || 0;
    const cur = a.doneSets[itemId] || 0;
    a.doneSets[itemId] = setIdx < cur ? setIdx : setIdx + 1;
    this.saveSoon();
    this.renderView();
    this.afterRender();
    window.scrollTo(0, keepY);
  }

  completeSet(itemId) {
    const a = this.state.activeSession;
    if (!a) return;
    a.doneSets[itemId] = (a.doneSets[itemId] || 0) + 1;
    this.saveSoon();
    const plan = this.state.plan;
    const session = plan.sessions[a.index];
    const item = session.items.find((i) => i.id === itemId);
    const done = session.items.reduce((x, i) => x + (a.doneSets[i.id] || 0), 0);
    const total = session.items.reduce((x, i) => x + i.sets, 0);
    if (item && item.rest) {
      const sec = parseRestSec(item.rest);
      if (sec) this.startTimer(sec);
    }
    if (done >= total) {
      this.coachSays('全做完了。按结束记录，别再加戏。');
      this.toast('全部组数完成，点「结束并记录」。', this.coach.id);
    }
    this.renderView();
    this.afterRender();
    const cur = $('#ex-' + itemId);
    if (cur) cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  finishSession() {
    const a = this.state.activeSession;
    if (!a) return;
    const plan = this.state.plan;
    const session = plan?.sessions?.[a.index];
    // 计划可能已被重新生成 / 变短，旧会话找不到对应的课：安全收尾，不崩
    if (!session) {
      this.state.activeSession = null;
      this.sessionClock = 0;
      this.save();
      this.toast('这节课已经不在当前计划里了，已结束本次会话。', this.coach.id);
      this.go('train');
      return;
    }
    const rawDone = session.items.reduce((x, i) => x + (a.doneSets[i.id] || 0), 0);
    const total = session.items.reduce((x, i) => x + i.sets, 0);
    const done = Math.min(rawDone, total);
    const ratio = total ? Math.min(100, Math.round((done / total) * 100)) : 0;
    const key = this.todayKey;
    const prev = this.state.sessions[key] || { ratio: 0, doneSets: 0, sessionsToday: 0 };
    this.state.sessions[key] = {
      title: session.title,
      doneSets: Math.min((prev.doneSets || 0) + done, (prev.totalSets || 0) + total),
      totalSets: total,
      ratio: Math.min(100, Math.max(prev.ratio || 0, ratio)),
      minutes: Math.round(this.sessionClock / 60),
      at: Date.now(),
      sessionsToday: (prev.sessionsToday || 0) + 1,
    };
    this.state.totalSessions = (this.state.totalSessions || 0) + 1;
    this.state.weekSessions = (this.state.weekSessions || 0) + 1;
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const last = this.state.lastTrainedDate;
    if (!last) this.state.streak = 1;
    else {
      const d = daysBetween(new Date(last), new Date());
      this.state.streak = d <= 1 ? (this.state.streak || 0) + 1 : 1;
    }
    this.state.bestStreak = Math.max(this.state.bestStreak || 0, this.state.streak);
    this.state.lastTrainedDate = key;
    this.state.activeSession = { ...a, finished: true };
    this.save();

    const before = this.state.pet;
    if (this.state.pet) {
      const res = onWorkoutDone(this.state.pet, { ratio: ratio / 100, minutes: Math.round(this.sessionClock / 60) });
      this.state.pet = res.pet;
      this.save();
      this.toast(`记录完成。${this.state.pet.name} 羁绊 +${res.bondGain}`, this.coach.id);
    } else {
      this.toast('记录完成。', this.coach.id);
    }
    this.openFinishModal({ session, done, total, ratio, bondGain: this.state.pet ? this.state.pet.bond - (before?.bond || 0) : 0 });
    this.stopTimer();
    this.renderView();
    this.afterRender();
  }

  setPlanTab(i) {
    this.planTab = i;
    if (this.state.plan?.sessions?.[i]) {
      this.sessionIndex = i;
    }
    this.renderView();
    this.afterRender();
  }

  /* ---------- 计时器 ---------- */
  startTimer(sec) {
    this.stopTimer();
    this.timer = { running: true, left: sec, total: sec, handle: null };
    this.announceTimer(`休息 ${sec} 秒开始`);
    this.timer.handle = setInterval(() => {
      this.timer.left -= 1;
      if (this.timer.left <= 0) {
        this.stopTimer();
        this.timer.left = 0;
        this.timer.running = false;
        this.updateTimerUI();
        this.announceTimer('休息结束，下一组');
        this.toast('休息结束，下一组。', this.coach.id);
        this.beep();
        return;
      }
      if (this.timer.left === 10) this.announceRestCountdown();
      this.updateTimerUI();
    }, 1000);
    this.updateTimerUI();
  }

  stopTimer() {
    if (this.timer.handle) clearInterval(this.timer.handle);
    this.timer.handle = null;
    this.timer.running = false;
  }

  toggleTimer() {
    if (this.timer.running) {
      this.stopTimer();
    } else {
      this.startTimer(this.timer.left > 0 ? this.timer.left : 60);
    }
    this.updateTimerUI();
  }

  resetTimer() {
    this.stopTimer();
    this.timer.left = this.timer.total || 60;
    this.updateTimerUI();
  }

  updateTimerUI() {
    const t = $('#rt-time');
    if (t) t.textContent = fmtSec(this.timer.left);
    const btn = $('#timer-toggle');
    if (btn) btn.textContent = this.timer.running ? '暂停' : '开始';
    const box = $('#rest-timer');
    if (box) box.classList.toggle('is-running', this.timer.running);
  }

  beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.08, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.start(); o.stop(ctx.currentTime + 0.42);
    } catch (e) { /* 静默 */ }
  }

  /* ---------- 宠物 ---------- */
  care(action) {
    if (!this.state.pet) return this.go('adopt');
    const res = interact(this.state.pet, action);
    if (!res.ok) {
      this.toast(res.msg, this.coach.id);
      return;
    }
    this.state.pet = res.pet;
    this.save();
    this.toast(res.msg, this.coach.id);
    const stage = $('#pet-stage');
    if (stage) {
      stage.classList.add('is-happy');
      setTimeout(() => stage.classList.remove('is-happy'), 700);
      this.animateCare(action);
    }
    this.renderView();
    this.afterRender();
    const stage2 = $('#pet-stage');
    if (stage2) stage2.classList.add('is-happy');
    setTimeout(() => { const s2 = $('#pet-stage'); if (s2) s2.classList.remove('is-happy'); }, 700);
  }

  animateCare(action) {
    const stage = $('#pet-stage');
    if (!stage) return;
    const icons = { feed: '🍖', play: '🎾', pet: '❤️', bath: '🛁', rest: '💤' };
    const fly = document.createElement('div');
    fly.className = 'care-fly';
    fly.textContent = icons[action] || '✨';
    fly.style.cssText = 'position:absolute;left:50%;top:70%;font-size:26px;z-index:5;pointer-events:none;transform:translateX(-50%);animation:care-fly .9s ease-out forwards;';
    stage.appendChild(fly);
    setTimeout(() => fly.remove(), 950);
  }

  pickPet(id) {
    this.adoptPick = id;
    this.renderView();
    this.afterRender();
  }

  adoptPet() {
    const id = this.adoptPick || 'dog';
    const p = PET_BY_ID[id];
    const existing = this.state.pet;
    if (existing && existing.typeId === id) {
      this.toast(`${p.name}已经是你的了。`, this.coach.id);
      this.go('pet');
      return;
    }
    const keepName = existing && existing.typeId === id;
    this.state.pet = newPetState(id, keepName ? existing.name : p.name);
    if (existing) {
      // 换宠物：保留部分羁绊，表示它记得你
      this.state.pet.bond = Math.round((existing.bond || 0) * 0.3);
      this.state.pet.totalCare = Math.round((existing.totalCare || 0) * 0.5);
    }
    this.state.profile.petId = id;
    this.state.profile.onboarded = true;
    this.save();
    this.toast(`${p.name}跟着你了。它认${p.directionName}。`, this.coach.id);
    this.go('pet');
    if (this.state.plan) {
      this.state.plan.petId = id;
      this.state.plan.petDirection = p.direction;
      this.save();
    }
  }

  switchPetView(id) {
    // 在宠物页预览不同宠物（不换，只切预览）
    this.adoptPick = id;
    this.toast(`这是「${PET_BY_ID[id].name}」的样子。想换就去「换一只养」。`, this.coach.id);
    this.go('adopt');
  }

  /* ---------- 换动作 / 要点 / 收藏 ---------- */
  openSwapModal(sessionIndex, itemId) {
    const plan = this.state.plan;
    if (!plan) return;
    const session = plan.sessions[sessionIndex];
    const item = session?.items.find((i) => i.id === itemId);
    if (!item) return;
    const sug = suggestSwap(plan, sessionIndex, itemId, { injuries: plan.injuries, level: plan.level, equipment: plan.equipment });
    const candidates = this.swapCandidates(item, session).filter((c) => c.id !== sug?.ex?.id);
    this.openModal(`
      <div class="modal-head">
        <div>
          <span class="eyebrow">换动作</span>
          <h2 style="margin-top:4px">${esc(item.name)} 做不了？</h2>
          <p class="small muted">同模式替代，保持训练结构不变。</p>
        </div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      ${sug ? `<div class="card flat" style="border-left:3px solid var(--ochre)">
        <div class="card-title">🖐️ ${esc(this.coach.name)}推荐</div>
        <div class="row-between mt-s">
          <div>
            <div style="font-weight:700">${esc(sug.ex.name)}</div>
            <div class="tiny muted">${esc(sug.reason)}</div>
          </div>
          <button class="btn btn-sm btn-primary" data-act="apply-swap" data-session="${sessionIndex}" data-item="${itemId}" data-new="${sug.ex.id}">用这个</button>
        </div>
      </div>` : ''}
      ${candidates.length ? `<div class="mini-title mt">其他替代动作（自动匹配）</div>
      <div class="stack">
        ${candidates.map((c) => `<div class="row-between" style="padding:8px 10px;border:1px solid var(--line);border-radius:10px;gap:10px">
          <div style="min-width:0">
            <b class="small">${esc(c.name)}</b>
            <div class="tiny muted">${esc(c.reason)} · ${esc(c.equip)}</div>
          </div>
          <button class="btn btn-sm btn-ghost" data-act="apply-swap" data-session="${sessionIndex}" data-item="${itemId}" data-new="${c.id}">换成它</button>
        </div>`).join('')}
      </div>` : `<div class="tiny muted mt">${sug ? '当前器械与伤病条件下，这是最合适的一个了。' : '当前器械与伤病条件下，没有更合适的同类动作——可以换个部位练，或先休息。'}</div>`}
      <div class="modal-foot"><button class="btn btn-ghost" data-act="close-modal">算了，继续练</button></div>
    `);
  }

  swapCandidates(item, session) {
    const used = session.items.map((i) => i.id).filter((id) => id !== item.id);
    const gear = this.state.profile.equipment || ['none'];
    const plan = this.state.plan;
    const injuries = (plan?.injuries || []).flatMap((k) => INJURIES[k]?.avoid || []);
    const level = LEVELS[this.state.profile.level]?.cap ?? 3;
    return findSubstitutes(item.id, {
      equipment: gear,
      injuries,
      level,
      exclude: used,
      limit: 6,
    }).map((r) => ({
      id: r.ex.id,
      name: r.ex.name,
      equip: r.ex.equipment.map((g) => EQUIPMENTS[g] || g).join(' / '),
      reason: r.reason,
    }));
  }

  applySwap(sessionIndex, itemId, newId) {
    if (!newId) return;
    const plan = this.state.plan;
    const old = plan.sessions[sessionIndex].items.find((i) => i.id === itemId);
    replaceItem(plan, sessionIndex, itemId, newId);
    this.save();
    this.closeModal();
    this.toast(`换成了「${getExercise(newId)?.name}」。`, this.coach.id);
    this.renderView();
    this.afterRender();
  }

  showCue(itemId) {
    const ex = getExercise(itemId);
    if (!ex) return;
    const item = this.state.plan?.sessions?.flatMap((s) => s.items).find((i) => i.id === itemId);
    this.openModal(`
      <div class="modal-head">

      <div class="modal-foot">

        <button class="btn btn-primary" data-act="save-cue-goto">让教练存一条要点</button>

  cueLine(ex, item) {
    const style = this.coach.style;
    const base = item?.cue || '动作全程可控';
    return {
      roast: `${base}。就这么点事，你还能做错？做错就降重量，别硬撑。`,
      science: `${base}。建议用 70% 重量先做 2 组，确认轨迹稳定再加。`,
      warm: `${base}。做慢一点，感受它，没关系的。`,
      drill: `${base}。执行。`,
    }[style];
  }

  /** 某动作的历史：上次一组 + 最好一组（供计划页/训练页提示） */
  historyForItem(itemId) {
    const logs = this.state.setLogs || [];
    return { last: lastSetFor(logs, itemId), pr: bestSetFor(logs, itemId) };
  }

  openLogSetModal(itemId) {
    const plan = this.state.plan;
    const session = this.state.activeSession;
    const item = plan?.sessions?.flatMap((s) => s.items).find((i) => i.id === itemId);
    if (!item) return;
    const { last, pr } = this.historyForItem(itemId);
    const repsFromPlan = parseInt(item.reps, 10) || 8;
    const ci = this.cycleInfo();
    const suggested = ci ? recommendLoad(this.state.setLogs || [], itemId, ci.week.loadPct) : null;
    const weightVal = last?.weight ?? suggested ?? '';
    const repsVal = last?.reps ?? repsFromPlan;
    const doneNow = session?.doneSets?.[itemId] || 0;
    this.openModal(`
      <div class="modal-head">
        <div>
          <span class="eyebrow">记一组 · 第 ${doneNow + 1} / ${item.sets} 组</span>
          <h2 style="margin-top:4px">${esc(item.name)}</h2>
          <p class="small muted">${esc(item.reps)} · 组间 ${esc(item.rest)} · RPE ${esc(item.rpe)}</p>
        </div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      <div class="grid grid-2">
        <div class="field">
          <label for="log-weight">重量（kg）</label>
          <input class="input" id="log-weight" type="number" inputmode="decimal" min="0" max="500" step="0.5" value="${weightVal}" placeholder="比如 60" />
        </div>
        <div class="field">
          <label for="log-reps">次数</label>
          <input class="input" id="log-reps" type="number" inputmode="numeric" min="1" max="100" step="1" value="${repsVal}" />
        </div>
      </div>
      <div class="tiny muted mt-s" style="line-height:1.7">
        ${last ? `上次：${last.weight}kg × ${last.reps}（估算 1RM ${e1rm(last.weight, last.reps)}）` : '这是第一次记这个动作。'}
        ${pr ? ` · 最好：${pr.weight}kg × ${pr.reps}（估算 1RM ${e1rm(pr.weight, pr.reps)}）` : ''}
        ${suggested ? `<br/><span style="color:var(--ochre);font-weight:700">本周建议 ${suggested}kg</span> · 第 ${ci.week.week} 周 ${Math.round(ci.week.loadPct * 100)}% 强度` : ''}
      </div>
      <div class="modal-foot" style="flex-wrap:wrap;gap:8px">
        <button class="btn btn-ghost" data-act="skip-weight" data-item="${itemId}">不记重量，只完成</button>
        <button class="btn btn-ghost" data-act="close-modal">取消</button>
        <button class="btn btn-primary" data-act="save-set-log" data-item="${itemId}" data-mark="1">保存并完成这组</button>
      </div>
    `, 'is-hand');
    setTimeout(() => $('#log-weight')?.focus(), 60);
  }

  saveSetLog(itemId, markDone = true) {
    const item = this.state.plan?.sessions?.flatMap((s) => s.items).find((i) => i.id === itemId);
    const session = this.state.activeSession;
    const rawWeight = $('#log-weight')?.value;
    const rawReps = $('#log-reps')?.value;
    const entry = addSetLog(this.state, {
      date: this.todayKey,
      sessionIndex: session?.index ?? 0,
      exerciseId: itemId,
      exerciseName: item?.name || itemId,
      setIndex: (session?.doneSets?.[itemId] || 0) + 1,
      weight: Number(rawWeight),
      reps: Number(rawReps),
    });
    if (!entry) {
      this.toast('重量 0–500kg、次数 1–100 才算数。', this.coach.id);
      return;
    }
    this.save();
    this.closeModal();
    if (markDone) this.completeSet(itemId);
    else { this.renderView(); this.afterRender(); }
    this.toast(`记下了：${entry.weight}kg × ${entry.reps}`, this.coach.id);
  }

  /** 当前周期信息：第几周、本周处方、整条周期 */
  cycleInfo() {
    const plan = this.state.plan;
    if (!plan) return null;
    const weeks = plan.cycleWeeks || 8;
    const cycle = buildCycle({ weeks, goal: plan.goal });
    const index = weekIndexFor(plan);
    return { cycle, index, week: cycle[index - 1] || cycle[0], summary: cycleSummary(cycle[index - 1] || cycle[0]) };
  }

  openCycleWeekModal(weekNo) {
    const info = this.cycleInfo();
    if (!info) return;
    const week = info.cycle[weekNo - 1];
    if (!week) return;
    const plan = this.state.plan;
    const applied = applyWeek(plan, week);
    const rows = plan.sessions.map((s, i) => {
      const base = s.items.reduce((a, it) => a + it.sets, 0);
      const now = applied.sessions[i].items.reduce((a, it) => a + it.sets, 0);
      return `<div class="row-between small" style="padding:4px 0;border-bottom:1px dashed var(--line)">
        <span>DAY ${i + 1} · ${esc(s.title.split(' · ')[0])}</span>
        <span class="muted">${base} 组 → <b style="color:var(--ink)">${now} 组</b></span>
      </div>`;
    }).join('');
    this.openModal(`
      <div class="modal-head">
        <div>
          <span class="eyebrow">周期处方 · 第 ${week.week} 周</span>
          <h2 style="margin-top:4px">${esc(week.label)}${week.isDeload ? ' · 减载' : ''}</h2>
          <p class="small muted">强度 ${Math.round(week.loadPct * 100)}% · 组数 ×${week.setsMult} · 目标 RPE ${week.rpe}</p>
        </div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      <div class="cue-box" style="margin-top:0">${esc(week.note)}</div>
      <div class="mini-title mt">这一周每天会变成</div>
      ${rows}
      <div class="tiny muted mt-s">应用后只改组数与 RPE 目标，不动动作与器械；随时可以再应用别的周。</div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-act="close-modal">先不应用</button>
        <button class="btn btn-primary" data-act="apply-cycle-week" data-week="${week.week}">应用第 ${week.week} 周处方</button>
      </div>
    `, 'is-hand');
  }

  /** 把已完成的组数夹到当前计划允许的范围，防止减载后出现 143% 完成率 */
  clampDoneSets(doneMap = {}, session) {
    const out = {};
    if (!session) return out;
    for (const item of session.items) {
      const n = Number(doneMap[item.id] || 0);
      out[item.id] = Math.max(0, Math.min(n, item.sets));
    }
    return out;
  }

  applyCycleWeek(weekNo) {
    const info = this.cycleInfo();
    if (!info) return;
    const week = info.cycle[weekNo - 1];
    if (!week) return;
    const applied = applyWeek(this.state.plan, week);
    this.state.plan.sessions = applied.sessions;
    this.state.plan.cycleWeek = week.week;
    const a = this.state.activeSession;
    if (a) {
      const session = this.state.plan.sessions[a.index];
      if (session) a.doneSets = this.clampDoneSets(a.doneSets, session);
    }
    this.save();
    this.closeModal();
    this.renderView();
    this.afterRender();
    this.toast(`已应用第 ${weekNo} 周处方：组数 ×${week.setsMult}，RPE ${week.rpe}。`, this.coach.id);
  }

  undoCycleWeek() {
    const plan = this.state.plan;
    if (!plan) return;
    const restored = restoreBase(plan);
    this.state.plan.sessions = restored.sessions;
    this.state.plan.cycleWeek = 1;
    const a = this.state.activeSession;
    if (a) {
      const session = this.state.plan.sessions[a.index];
      if (session) a.doneSets = this.clampDoneSets(a.doneSets, session);
    }
    this.save();
    this.renderView();
    this.afterRender();
    this.toast('已恢复基础组数与 RPE。', this.coach.id);
  }

  saveBookmark(text, coachId) {
    if (!text) return;
    const c = COACH_BY_ID[coachId] || this.coach;
    this.state.bookmarks = this.state.bookmarks || [];
    this.state.bookmarks.unshift({ id: uid('bm'), text, coachName: c.name, coachId: c.id, at: Date.now() });
    this.state.bookmarks = this.state.bookmarks.slice(0, 50);
    this.save();
    this.toast('记下来了，在进展页能翻到。', this.coach.id);
  }

  removeBookmark(id) {
    this.state.bookmarks = (this.state.bookmarks || []).filter((b) => b.id !== id);
    this.save();
    this.renderView();
    this.afterRender();
  }

  /* ---------- 五指山面板 ---------- */
  fingerCtx() {
    return {
      state: this.state,
      plan: this.state.plan,
      profile: this.state.profile,
      pet: this.state.pet ? petSummary(this.state.pet) : null,
      coach: this.coach,
      coaches: COACHES,
      sessionIndex: this.sessionIndex ?? 0,
      doneSets: this.currentDoneSets(),
      bookmarks: this.state.bookmarks,
    };
  }

  currentDoneSets() {
    const a = this.state.activeSession;
    if (!a) return 0;
    const session = this.state.plan?.sessions?.[a.index];
    if (!session) return 0;
    return session.items.reduce((x, i) => x + (a.doneSets[i.id] || 0), 0);
  }

  openFinger(origin = 'corner', opts = {}) {
    const zone = opts.zone || (this.view === 'adopt' ? 'pet' : this.view);
    this.fingerOrigin = origin;
    try {
      this.finger = buildFingers(zone, this.fingerCtx());
    } catch (e) {
      console.error(e);
      this.toast('五指山暂时伸不出来，稍后再试。', this.coach.id);
      return;
    }
    this.activeFinger = opts.finger || this.finger.fingers[0]?.finger || 'wu';
    this.openDrawer(opts.tab || 'fingers');
    this.renderFingerPane();
    this.switchDrawerTab(opts.tab || 'fingers');
    this.coachSays(this.finger.summary.lead, 0);
  }

  openDrawer(tab = 'fingers') {
    this.closeCoachDrawer();
    if ($('#drawer').hidden) this._drawerReturn = document.activeElement;
    $('#drawer-scrim').hidden = false;
    const d = $('#drawer');
    d.hidden = false;
    d.classList.remove('is-closing');
    $('#drawer-heading').textContent = '五指山';
    $('#drawer-sub').textContent = this.finger ? `${this.finger.summary.lead} · ${this.coach.name}` : '';
    document.body.style.overflow = 'hidden';
    setTimeout(() => { if (!$('#drawer').hidden) $('#drawer-close')?.focus(); }, 60);
    this.syncBackground();
  }

  closeDrawer() {
    const d = $('#drawer');
    if (!d || d.hidden) return;
    d.classList.add('is-closing');
    $('#drawer-scrim').hidden = true;
    setTimeout(() => {
      d.hidden = true;
      d.classList.remove('is-closing');
      this.restoreFocus(this._drawerReturn);
      this._drawerReturn = null;
      this.syncBackground();
    }, 220);
    document.body.style.overflow = '';
  }

  switchDrawerTab(tab) {
    this.chatMode = tab;
    $$('.dtab').forEach((b) => b.classList.toggle('is-active', b.dataset.dtab === tab));
    $('#pane-fingers').hidden = tab !== 'fingers';
    $('#pane-chat').hidden = tab !== 'chat';
    if (tab === 'chat') this.renderChatPane();
  }

  renderFingerPane() {
    const f = this.finger;
    if (!f) return;
    $('#hand-visual').innerHTML = handSVG(this.activeFinger, 224);
    $('#hand-fingers-nav').innerHTML = FINGERS.map((def) => {
      const item = f.fingers.find((x) => x.finger === def.key);
      const on = this.activeFinger === def.key;
      return `<button class="hf-nav ${on ? 'is-on' : ''}" data-hf="${def.key}">
        <span class="hfn-char" style="color:${def.color}">${def.label}</span>
        <span class="hfn-name">${def.name}</span>
      </button>`;
    }).join('');
    $('#drawer-sub').textContent = `${f.summary.lead} · ${f.coach.name}`;
    this.renderFingerDetail();
    this.renderOthers();
    $$('.hand-svg .finger').forEach((node) => {
      node.addEventListener('click', () => {
        if (node.dataset.finger !== 'thumb') {
          this.selectFinger(node.dataset.finger);
        }
      });
    });
  }

  selectFinger(key) {
    this.activeFinger = key;
    const svg = $('#hand-visual svg');
    if (svg) {
      svg.querySelectorAll('.finger').forEach((n) => n.classList.toggle('is-active', n.dataset.finger === key));
    }
    $$('.hf-nav').forEach((n) => n.classList.toggle('is-on', n.dataset.hf === key));
    this.renderFingerDetail();
  }

  renderFingerDetail() {
    const f = this.finger;
    const item = f?.fingers.find((x) => x.finger === this.activeFinger) || f?.fingers[0];
    const host = $('#finger-detail');
    if (!item) { host.innerHTML = ''; return; }
    const sevLabel = { high: '建议立刻处理', mid: '值得改', low: '顺手优化', info: '参考', gain: '可以更好' }[item.severity] || '';
    host.innerHTML = `
      <div class="fd-head">
        <span class="fd-char" style="background:${item.color}">${item.label}</span>
        <div>
          <div class="fd-title">${esc(item.title)}</div>
          <div class="fd-sub">${esc(item.fingerName)} · ${esc(sevLabel)}</div>
        </div>
      </div>
      <div class="fd-body">${esc(item.body)}</div>
      <div class="fd-why">${esc(item.why)}</div>
      <div class="fd-coach">
        <div class="fd-coach-avatar">${coachSVG(this.coach.id, 30)}</div>
        <div class="fd-coach-text"><span class="fd-coach-name">${esc(this.coach.name)}</span>${esc(item.coachNote)}</div>
      </div>
      ${item.petNote ? `<div class="fd-pet-note">🐾 <span>${esc(item.petNote)}</span></div>` : ''}
      <div class="fd-foot">
        ${item.action ? `<button class="btn btn-primary btn-sm" data-act="finger-apply">${esc(item.action.label)} →</button>` : `<span class="tiny muted">这条不需要动手，知道就够了。</span>`}
        <button class="btn btn-ghost btn-sm" data-act="finger-ask">问${esc(this.coach.name)}</button>
        <button class="btn btn-ghost btn-sm" data-act="finger-explore">还有别的改法</button>
      </div>`;
  }

  renderOthers() {
    const others = previewOthers(this.view, this.fingerCtx());
    $('#others-list').innerHTML = others.map(({ coach, line }) => `
      <button class="other-row" data-act="switch-coach" data-coach="${coach.id}">
        <span class="or-avatar">${coachSVG(coach.id, 32)}</span>
        <span>
          <span class="or-name">${esc(coach.name)} <span class="tiny muted" style="font-weight:400">${esc(coach.title)}</span></span>
          <span class="or-line">“${esc(line)}”</span>
        </span>
        <span class="or-go">换他 →</span>
      </button>`).join('');
  }

  applyActiveFinger() {
    const item = this.finger?.fingers.find((x) => x.finger === this.activeFinger);
    if (!item?.action) return;
    const keysBefore = this.state.pet?.bond;
    const res = applyFingerAction(item.action, this);
    if (!res) return;
    if (res.nav) {
      if (res.nav.view) this.go(res.nav.view);
      else if (res.nav.selector) {
        this.closeDrawer();
        const node = document.querySelector(res.nav.selector);
        if (node) node.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return;
    }
    if (res.msg) this.toast(res.msg, this.coach.id);
    if (res.refresh) {
      this.closeDrawer();
      this.renderView();
      this.afterRender();
    }
  }

  renderChatPane() {
    $('#chat-coach-row').innerHTML = COACHES.map((c) => `
      <button class="chat-coach-pill ${c.id === this.coach.id ? 'is-on' : ''}" data-act="switch-coach" data-coach="${c.id}">
        ${coachSVG(c.id, 24)}<span>${esc(c.name)}</span>
      </button>`).join('');
    const log = $('#chat-log');
    const chat = this.state.chat || [];
    if (!chat.length) {
      log.innerHTML = `<div class="msg"><div class="m-avatar">${coachSVG(this.coach.id, 28)}</div><div class="m-bubble">
        <span class="m-name">${esc(this.coach.name)}</span>
        ${esc(phrase(this.coach, 'open', 0))}想问什么直接说。${this.finger ? '也可以先看左边那五根手指。' : ''}
      </div></div>`;
    } else {
      log.innerHTML = chat.slice(-30).map((m) => m.role === 'me'
        ? `<div class="msg me"><div class="m-bubble">${esc(m.text)}</div></div>`
        : `<div class="msg"><div class="m-avatar">${coachSVG(m.coachId || this.coach.id, 28)}</div><div class="m-bubble">
            <span class="m-name">${esc(COACH_BY_ID[m.coachId]?.name || this.coach.name)}</span>${esc(m.text)}
            <div class="m-tools"><button class="m-tool" data-act="save-bookmark" data-text="${esc(m.text)}" data-coach="${m.coachId || this.coach.id}">记一条</button></div>
          </div></div>`).join('');
    }
    log.scrollTop = log.scrollHeight;
    $('#chat-chips').innerHTML = (this.lastSuggestions || ['胸怎么练？', '一周练几次？', `帮我看看${this.state.pet ? this.state.pet.name : '我的宠物'}`])
      .map((q) => `<button class="chip-q" data-act="chat-q" data-q="${esc(q)}">${esc(q)}</button>`).join('');
  }

  pushChat(entry) {
    this.state.chat = this.state.chat || [];
    this.state.chat.push(entry);
    if (this.state.chat.length > 200) this.state.chat = this.state.chat.slice(-200);
    return this.state.chat;
  }

  /** 最近一条教练回复的话题，用于多轮指代 */
  lastChatTopic() {
    const chat = this.state.chat || [];
    for (let i = chat.length - 1; i >= 0; i--) {
      if (chat[i].role === 'coach' && chat[i].topic) return chat[i].topic;
    }
    return null;
  }

  sendChat(text) {
    this.switchDrawerTab('chat');
    const ctx = { ...this.fingerCtx(), coach: this.coach, pet: this.state.pet, lastTopic: this.lastChatTopic() };
    this.state.chat = this.state.chat || [];
    this.pushChat({ role: 'me', text, at: Date.now() });
    let reply;
    try {
      reply = chatReply(text, ctx);
    } catch (e) {
      console.error(e);
      reply = { text: '我刚才走神了，你再说一遍？', suggestions: ['一周练几次？', '减脂怎么吃'] };
    }
    if (!reply) reply = { text: '再说一遍？', suggestions: [] };
    setTimeout(() => {
      this.pushChat({ role: 'coach', text: reply.text, coachId: this.coach.id, topic: reply.topic || null, at: Date.now() });
      this.lastSuggestions = reply.suggestions;
      this.save();
      if (this.chatMode === 'chat') this.renderChatPane();
    }, 420);
    this.renderChatPane();
    this.save();
  }

  /* ---------- 教练 ---------- */
  switchCoach(id) {
    const c = COACH_BY_ID[id];
    if (!c) return;
    this.coach = c;
    this.state.coachId = id;
    this.save();
    this.updateChrome();
    this.closeCoachDrawer();
    if (this.finger) {
      this.openFinger(this.fingerOrigin || 'corner', { zone: this.view === 'adopt' ? 'pet' : this.view });
    }
    if (this.view === 'coach') {
      this.renderView();
      this.afterRender();
    }
    this.toast(`现在是${c.name}教你。语气变了，建议还是同一套。`, c.id);
    this.coachSays(c.voice.open[0] + '又见面了。', 8000);
  }

  openCoachList() {
    if ($('#coach-drawer').hidden) this._coachReturn = document.activeElement;
    const host = $('#coach-list');
    host.innerHTML = COACHES.map((c) => `
      <button class="coach-opt ${c.id === this.coach.id ? 'is-on' : ''}" data-act="switch-coach" data-coach="${c.id}">
        <div class="co-face">${coachSVG(c.id, 46)}</div>
        <div class="co-main">
          <div class="co-name">${esc(c.name)} <span class="co-title">${esc(c.title)}</span></div>
          <div class="co-bio">${esc(c.bio)}</div>
          <div class="co-tags">${c.focus.map((f) => `<span class="pill ghost" style="font-size:10px">${esc(f)}</span>`).join('')}</div>
        </div>
        <div class="co-check">${c.id === this.coach.id ? '✓' : ''}</div>
      </button>`).join('');
    $('#coach-scrim').hidden = false;
    $('#coach-drawer').hidden = false;
    document.body.style.overflow = 'hidden';
    $$('#coach-list [data-act="switch-coach"]').forEach((n) => n.addEventListener('click', () => this.switchCoach(n.dataset.coach)));
    setTimeout(() => { if (!$('#coach-drawer').hidden) $('#coach-drawer-close')?.focus(); }, 60);
    this.syncBackground();
  }

  closeCoachDrawer() {
    const wasOpen = !($('#coach-drawer')?.hidden ?? true);
    const scrim = $('#coach-scrim');
    const drawer = $('#coach-drawer');
    if (scrim) scrim.hidden = true;
    if (drawer) drawer.hidden = true;
    if (($('#drawer')?.hidden ?? true) && !$('#modal-root').innerHTML) document.body.style.overflow = '';
    if (wasOpen) {
      this.restoreFocus(this._coachReturn);
      this._coachReturn = null;
    }
    this.syncBackground();
  }

  toggleAnno(fromDrawer = false) {
    this.annoOpen = !this.annoOpen;
    document.body.classList.toggle('anno-on', this.annoOpen);
    $('#anno-toggle')?.setAttribute('aria-pressed', String(this.annoOpen));
    if (fromDrawer) this.closeDrawer();
    this.afterRender();
    this.toast(this.annoOpen ? '标出来的地方都能改，点一下就让教练伸手。' : '标注关了。', this.coach.id);
  }

  /* ---------- 弹层 ---------- */
  openModal(html, cls = '') {
    this._modalReturn = document.activeElement;
    $('#modal-root').innerHTML = `<div class="modal-wrap"><div class="modal-scrim" data-act="close-modal"></div><div class="modal ${cls}">${html}</div></div>`;
    document.body.style.overflow = 'hidden';
    $$('#modal-root [data-act="close-modal"]').forEach((n) => n.addEventListener('click', () => this.closeModal()));
    const modal = $('#modal-root .modal');
    if (modal) {
      modal.addEventListener('keydown', (e) => trapFocus(e, modal));
      setTimeout(() => { const f = getFocusable(modal)[0]; if (f) f.focus(); }, 0);
    }
    this.syncBackground();
  }

  closeModal() {
    const had = Boolean($('#modal-root')?.innerHTML);
    $('#modal-root').innerHTML = '';
    document.body.style.overflow = '';
    // 清理残留的模态事件
    if (!$('#drawer')?.hidden) document.body.style.overflow = 'hidden';
    if (had) {
      this.restoreFocus(this._modalReturn);
      this._modalReturn = null;
    }
    this.syncBackground();
  }

  restoreFocus(el) {
    if (!el || !el.isConnected || typeof el.focus !== 'function') return;
    if (el.closest('[aria-hidden="true"]')) return;
    try { el.focus(); } catch (e) { /* 忽略 */ }
  }

  /** 打开任何层时把背后内容从读屏树里移除 */
  syncBackground() {
    const anyOpen = !($('#drawer')?.hidden ?? true) || Boolean($('#modal-root')?.innerHTML) || !($('#coach-drawer')?.hidden ?? true);
    for (const sel of ['#view', '.topbar', '#tabbar', '#coach-corner']) {
      const el = $(sel);
      if (!el) continue;
      if (anyOpen) el.setAttribute('aria-hidden', 'true');
      else el.removeAttribute('aria-hidden');
    }
  }

  announceTimer(text) {
    const el = $('#timer-live');
    if (el) el.textContent = text;
  }

  announceRestCountdown() {
    this.announceTimer(`还剩 ${Math.max(0, this.timer.left)} 秒`);
  }

  openFinishModal({ session, done, total, ratio, bondGain }) {
    const pet = this.state.pet;
    this.openModal(`
      <div class="modal-head">
        <div>
          <span class="eyebrow">记录完成</span>
          <h2 style="margin-top:4px">${esc(session.title)}</h2>
          <p class="small muted">${new Date().toLocaleString('zh-CN', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</p>
        </div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      <div class="grid grid-3">
        <div class="train-stat"><div class="ts-num">${done}/${total}</div><div class="ts-label">完成组数</div></div>
        <div class="train-stat"><div class="ts-num">${ratio}%</div><div class="ts-label">完成度</div></div>
        <div class="train-stat"><div class="ts-num">${this.state.streak}</div><div class="ts-label">连续天数</div></div>
      </div>
      ${pet ? `<div class="card tinted-ochre mt" style="padding:14px">
        <div class="row" style="gap:12px">
          <div style="width:70px;flex:none;text-align:center">${petMini(pet.typeId, pet, 64)}</div>
          <div>
            <div class="card-title" style="font-size:13px">${esc(pet.name)} 羁绊 +${Math.round(bondGain)}</div>
            <div class="small muted">${ratio >= 80 ? '它今天很满意。' : '没做完它也认，来了就算。'} 它现在的方向是「${esc(PET_BY_ID[pet.typeId].directionName)}」。</div>
          </div>
        </div>
      </div>` : ''}
      <div class="fd-coach mt">
        <div class="fd-coach-avatar">${coachSVG(this.coach.id, 30)}</div>
        <div class="fd-coach-text">${esc(this.finishLine(ratio))}</div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-act="close-modal">关掉</button>
        <button class="btn btn-primary" data-act="goto-pet">去看${pet ? esc(pet.name) : '宠物'}</button>
      </div>
    `);
    $$('#modal-root [data-act="goto-pet"]').forEach((n) => n.addEventListener('click', () => {
      this.closeModal();
      this.go(pet ? 'pet' : 'adopt');
    }));
  }

  finishLine(ratio) {
    const style = this.coach.style;
    if (ratio >= 90) return { roast: '不错，全做完了。明天别装死。', science: '完成度达标，负荷维持，观察恢复。', warm: '你今天做到了，我真的很开心。', drill: '任务完成，合格。' }[style];
    if (ratio >= 60) return { roast: '做了大半，还行。缺的那几组，明天补不补？', science: '完成度略低，建议减少辅助动作以保住主项。', warm: '做得挺好的，剩下的下次再来。', drill: '完成度不足，下次补齐。' }[style];
    return { roast: '这就结束了？我不骂你了，明天继续。', science: '完成度偏低但已记录，比零好。', warm: '来就好，真的。下一次我们多做一组。', drill: '记录在案。下次补。' }[style];
  }

  openOnboarding() {
    if ($('#modal-root').innerHTML) return;
    this.openModal(`
      <div class="onboard">
        <h2>先认识一下：你是哪种练法</h2>
        <p class="ob-sub">四个问题，三十秒。答完 ${esc(this.coach.name)} 替你排一份。</p>
        <div id="ob-body"></div>
        <div class="ob-dots" id="ob-dots"></div>
        <div class="modal-foot">
          <button class="btn btn-ghost" data-act="close-modal">我随便看看</button>
          <button class="btn btn-primary" data-act="ob-next">下一步 →</button>
        </div>
      </div>
    `);
    this.obStep = 0;
    this.renderObStep();
  }

  obNext() {
    if (this.obStep < 3) {
      this.obStep += 1;
      this.renderObStep();
      return;
    }
    this.state.profile.onboarded = true;
    this.generatePlan();
    this.closeModal();
  }

  renderObStep() {
    const p = this.state.profile;
    const body = $('#ob-body');
    const dots = $('#ob-dots');
    const steps = [
      {
        title: '第一步：目标',
        html: `<div class="ob-options">${Object.entries(GOALS).map(([k, g]) => `<button class="opt-card ${p.goal === k ? 'is-on' : ''}" data-pick="goal" data-val="${k}"><span class="opt-emoji">${g.icon}</span><span class="opt-title">${g.label}</span><span class="opt-desc">${g.blurb}</span></button>`).join('')}</div>`,
      },
      {
        title: '第二步：水平',
        html: `<div class="ob-options">${Object.entries(LEVELS).map(([k, l]) => `<button class="opt-card ${p.level === k ? 'is-on' : ''}" data-pick="level" data-val="${k}"><span class="opt-title">${l.label}</span><span class="opt-desc">${l.months}</span></button>`).join('')}</div>`,
      },
      {
        title: '第三步：一周几次，一次多久',
        html: `<div class="seg" style="margin-bottom:16px">${[2, 3, 4, 5, 6].map((d) => `<button class="seg-opt ${p.days === d ? 'is-on' : ''}" data-pick="days" data-val="${d}">${d} 天</button>`).join('')}</div>
          <div class="field"><label>单次时长 <b id="min-val">${p.minutes} 分钟</b></label><input type="range" min="20" max="90" step="5" value="${p.minutes}" data-range="minutes" /></div>`,
      },
      {
        title: '第四步：挑一只宠物',
        html: `<p class="small muted mb">它会绑定你的训练方向，也会影响教练给你的建议。</p>
          <div class="ob-pet-options">${PETS.map((x) => `<button class="pet-pick ${this.adoptPick === x.id ? 'is-on' : ''}" data-act="pick-pet" data-pet="${x.id}" style="padding:10px">
            ${petMini(x.id, null, 72)}<div class="pp-name" style="font-size:13px">${esc(x.name)}</div><div class="pp-species" style="font-size:10.5px">${esc(x.directionName)}</div>
          </button>`).join('')}</div>`,
      },
    ];
    const step = steps[this.obStep];
    body.innerHTML = `<h3 style="font-size:16px;margin-bottom:12px">${step.title}</h3>${step.html}`;
    dots.innerHTML = steps.map((_, i) => `<span class="ob-dot ${i === this.obStep ? 'is-on' : ''}"></span>`).join('');
    $$('#ob-body [data-pick]').forEach((n) => n.addEventListener('click', () => {
      this.pickProfile(n.dataset.pick, n.dataset.val);
      this.renderObStep();
      if (n.dataset.pick === 'goal' && this.obStep === 0) {
        this.state.profile.onboarded = true;
      }
    }));
    $$('#ob-body [data-act="pick-pet"]').forEach((n) => n.addEventListener('click', () => {
      this.adoptPick = n.dataset.pet;
      this.renderObStep();
    }));
    const range = $('#ob-body input[type="range"]');
    if (range) {
      const upd = () => {
        const pct = ((range.value - range.min) / (range.max - range.min)) * 100;
        range.style.setProperty('--fill', pct + '%');
        const v = $('#min-val');
        if (v) v.textContent = `${range.value} 分钟`;
        this.state.profile.minutes = Number(range.value);
      };
      upd();
      range.addEventListener('input', upd);
    }
    const next = $('#modal-root [data-act="ob-next"]');
    if (next) next.textContent = this.obStep === 3 ? '生成计划，开始' : this.obStep === 2 ? '下一步 →' : '下一步 →';
  }

  confirmReset() {
    this.openModal(`
      <div class="modal-head">
        <div><span class="eyebrow">危险操作</span><h2>清空全部数据？</h2></div>
        <button class="icon-btn" data-act="close-modal">✕</button>
      </div>
      <p class="small" style="color:var(--ink-2);line-height:1.7">计划、宠物、训练记录、对话、收藏都会被删掉，不能恢复。建议先导出。</p>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-act="close-modal">算了</button>
        <button class="btn" style="background:var(--cinnabar);color:#fff" data-act="do-reset">确认清空</button>

      location.reload();
    }));
  }

  pickImportFile() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.addEventListener('change', async () => {
      const file = input.files?.[0];
      if (!file) return;
      let raw;
      try {
        raw = JSON.parse(await file.text());
      } catch (e) {
        this.toast('读取失败：这不是一个有效的 JSON 文件。', this.coach.id);
        return;
      }
      const preview = validateBackup(raw);
      if (!preview.ok) {
        this.toast(`备份不合法：${preview.errors[0]}`, this.coach.id);
        return;
      }
      this._pendingImport = raw;
      this.openModal(`
        <div class="modal-head">
          <div><span class="eyebrow">导入备份</span><h2 style="margin-top:4px">覆盖当前数据？</h2></div>
          <button class="icon-btn" data-act="close-modal">✕</button>
        </div>
        <p class="small" style="color:var(--ink-2);line-height:1.7">
          将用备份替换当前计划、宠物、训练记录与收藏。当前已有 <b>${this.state.totalSessions || 0}</b> 次训练记录，导入后不可撤销。
        </p>
        <div class="cue-box">备份文件校验通过：${preview.state.plan ? '含计划' : '无计划'} · ${(preview.state.setLogs || []).length} 组重量记录 · 教练 ${esc(preview.state.coachId || 'tanshi')}</div>
        <div class="modal-foot">
          <button class="btn btn-ghost" data-act="close-modal">取消</button>
          <button class="btn btn-primary" data-act="confirm-import">确认导入</button>
        </div>
      `);
    });
    input.click();
  }

  importBackup(raw) {
    const v = validateBackup(raw);
    if (!v.ok) {
      this.toast(`备份不合法：${v.errors[0]}`, this.coach.id);
      return v;
    }
    this.state = markExported({ ...v.state, activeSession: null }, Date.now());
    this.coach = COACH_BY_ID[this.state.coachId] || COACH_BY_ID[DEFAULT_COACH_ID];
    this.state.pet = this.state.pet ? tickPet(this.state.pet) : null;
    this.planTab = 0;
    this.sessionIndex = 0;
    this.sessionClock = 0;
    this.save();
    this.updateChrome();
    this.go('home');
    this.toast(`导入成功：${this.state.totalSessions || 0} 次训练记录已恢复。`, this.coach.id);
    return v;
  }

  exportData() {
    const blob = new Blob([JSON.stringify(this.state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `wuzhishan-backup-${todayKey()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    this.state = markExported(this.state, Date.now());
    this.save();
    if (this.view === 'progress') {
      this.renderView();
      this.afterRender();
    }
    this.toast('导出了，收好。', this.coach.id);
  }

  /* ---------- 提示 ---------- */
  toast(text, coachId = null) {
    const root = $('#toast-root');
    if (!root) return;
    // 同时只留一条，新消息顶掉旧的，避免叠成一片
    root.querySelectorAll('.toast').forEach((n) => n.remove());
    const node = document.createElement('div');
    node.className = 'toast';
    node.innerHTML = `${coachId ? `<span class="t-coach">🖐️</span>` : ''}<span>${esc(text)}</span>`;
    root.appendChild(node);
    // 气泡和 toast 不叠加：toast 期间把教练气泡收起来，之后再放出来
    const bubble = $('#coach-bubble');
    if (bubble) {
      bubble.classList.add('is-quiet');
      clearTimeout(this._bubbleRestoreT);
      this._bubbleRestoreT = setTimeout(() => {
        bubble.classList.remove('is-quiet');
        clearTimeout(this._bubbleT);
        this._bubbleT = setTimeout(() => bubble.classList.add('is-quiet'), 7000);
      }, 3200);
    }
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => {
      node.classList.add('is-out');
      setTimeout(() => node.remove(), 320);
    }, 3000);
  }
}

/* 工具：从 rest 字符串解析秒数（训练页里也有一个，保持一致） */
function parseRestSec(rest) {
  if (!rest) return 60;
  if (/min/.test(rest)) return (parseInt(rest, 10) || 2) * 60;
  const m = rest.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 60;
}

function commonMistake(ex) {
  const map = {
    A: '肘关节外翻、肩耸起来推，压力全跑到肩前。',

    C: '憋气塌腰，腰替腹肌干活。',
    K: '一上来就冲，五分钟后靠意志力。',
    M: '弹震式拉伸，越拉越紧。',
  };
  return map[ex.pattern] || '重量优先于动作质量。';
}

/* 启动 */
const app = new App();
window.__app = app;
app.boot();


};

__defs["js/backup.js"] = function (module, exports, __require) {
/**
 * 本地备份提醒（P2.5）
 * 纯函数：只回答「现在该不该提醒」，不碰 DOM / localStorage。
 */

const BACKUP_SESSIONS = 20;
const BACKUP_DAYS = 30;
const DAY = 86400000;

/**
 * @param {object} state 存档（只用 totalSessions / backup）
 * @param {number} now 可注入时间，便于测试
 * @returns {{due:boolean, reason:'sessions'|'days'|null, sessionsSince:number, daysSince:number|null}}
 */
function backupStatus(state = {}, now = Date.now()) {
  const total = Number(state.totalSessions) || 0;
  const b = state.backup || {};
  const last = Number(b.lastExportAt) || 0;
  const atExport = Number(b.sessionsAtExport) || 0;
  const sessionsSince = Math.max(0, total - atExport);
  const daysSince = last ? Math.floor((now - last) / DAY) : null;

  // 新用户前 5 次不打扰
  if (total < 5) return { due: false, reason: null, sessionsSince, daysSince };
  if (sessionsSince >= BACKUP_SESSIONS) return { due: true, reason: 'sessions', sessionsSince, daysSince };
  if (last && daysSince >= BACKUP_DAYS) return { due: true, reason: 'days', sessionsSince, daysSince };
  return { due: false, reason: null, sessionsSince, daysSince };
}

/** 标记「刚导出过」，返回副本 */
function markExported(state = {}, now = Date.now()) {
  return {
    ...state,
    backup: { lastExportAt: now, sessionsAtExport: Number(state.totalSessions) || 0 },
  };
}


Object.assign(module.exports, { BACKUP_SESSIONS, BACKUP_DAYS, backupStatus, markExported });
};

/* 五指山引擎：在任何页面，任何一块「可以改」的地方，

const FINGERS = [

  { key: 'shan', label: '山', name: '计划', desc: '频率 / 结构 / 顺序', color: '#b8860b' },
  { key: 'xiang', label: '相', name: '标准', desc: '姿势 / 动作幅度 / 要点', color: '#2e86ab' },
  { key: 'xi', label: '息', name: '剂量', desc: '组数 / 次数 / 休息', color: '#7b5ea7' },
  { key: 'xin', label: '心', name: '恢复', desc: '睡眠 / 吃喝 / 心态', color: '#3f7d4f' },
];

const SEV_RANK = { high: 3, mid: 2, low: 1, info: 0 };

function mk(fingerKey, o) {
  const f = FINGERS.find((x) => x.key === fingerKey);
  return {
    finger: f.key,
    label: f.label,
    fingerName: f.name,

  };
}

/* ---------------- 各页面的「五根手指」 ---------------- */

function fingersHome(ctx) {
  const { state, plan, pet, profile, coach } = ctx;
  const out = [];
  const today = new Date().getDay();
  const planned = plan?.sessions?.[today % (plan?.sessions?.length || 1)];
  const streak = state.streak || 0;

  // 武
  if (planned) {
    out.push(mk('wu', {
      severity: streak === 0 ? 'mid' : 'info',
      title: `今天该练：${planned.title}`,
      body: `安排了 ${planned.items.length} 个动作、约 ${planned.minutes} 分钟。先做第一个，别想全部。`,
      why: '开始成本最低的做法，是先做完热身和第一个动作。',
      action: { label: '开练', kind: 'start_session', payload: { index: today % (plan?.sessions?.length || 1) } },
      height: 0.9,
      tone: 'action',
    }));
  } else {
    out.push(mk('wu', {
      severity: 'high',
      title: '还没有计划',
      body: '没有计划的人，练的是心情。先花一分钟生成一份。',
      why: '计划不是为了约束你，是为了让你不用每天重新决定练什么。',
      action: { label: '去生成计划', kind: 'goto', payload: { view: 'plan' } },
      height: 1,
      tone: 'risk',

  }

  // 山

  const highIssue = issues.filter((i) => i.severity === 'high' || i.level === 'high')[0] || issues[0];
  out.push(mk('shan', {
    severity: highIssue ? 'mid' : 'low',
    title: highIssue ? '计划有个结构问题' : '计划结构目前没硬伤',
    body: highIssue?.text || '频率和部位覆盖都在合理区间，先执行两周再说。',
    why: '结构问题比意志问题更值得先修。',
    action: highIssue ? { label: '去改计划', kind: 'goto', payload: { view: 'plan' } } : { label: '看八周路线', kind: 'goto', payload: { view: 'plan', anchor: 'phases' } },
    height: highIssue ? 0.75 : 0.4,
    tone: highIssue ? 'risk' : 'info',

  // 相
  if (planned?.items?.length) {

function pickWeakest(weekly, plan) {
  const pet = plan.petId ? PET_BY_ID[plan.petId] : null;
  const goalTags = {
    muscle: ['力量', '胸', '背', '腿', '后链'],
    fatloss: ['减脂', '心肺', '低冲击'],
    strength: ['力量', '后链', '进阶'],
    endurance: ['心肺', '低冲击', '减脂'],
    mobility: ['灵活度', '拉伸', '久坐救星'],
  }[plan.goal] || [];
  const badTags = {
    muscle: ['热身', '护腰友好'],
    fatloss: ['进阶'],
    strength: ['居家', '护膝友好'],
    endurance: [],
    mobility: ['进阶', '力量'],
  }[plan.goal] || [];

  const scored = weekly
    .filter(({ it }) => it.role === 'accessory')
    .map(({ si, it }) => {
      const ex = getExercise(it.id);
      if (!ex) return null;
      let s = 0;
      for (const t of ex.tags) {
        if (goalTags.includes(t)) s -= 1.2;   // 贴合目标的动作更不该换
        if (badTags.includes(t)) s += 1.2;
      }
      if (pet) s -= (pet.priority[ex.pattern] ?? 1) * 0.8;
      if (it.role === 'finisher') s -= 2;
      const swap = suggestSwap(plan, si, it.id, {
        injuries: plan.injuries,
        level: plan.level,
        equipment: plan.equipment,
        role: it.role,
      });
      return { si, it, ex, s, swap };
    })
    .filter(Boolean)
    .sort((a, b) => b.s - a.s);

  for (const cand of scored) {
    if (cand.swap && cand.swap.ex && cand.swap.ex.id !== cand.it.id) return cand;
  }
  return null;
}

const ZONES = { home: fingersHome, plan: fingersPlan, train: fingersTrain, pet: fingersPet, coach: fingersCoach, progress: fingersProgress };

function sortFingers(fingers) {
  return [...fingers].sort((a, b) => SEV_RANK[b.severity] - SEV_RANK[a.severity] || b.height - a.height);
}

function petFlavor(finger, pet) {
  if (!pet) return null;
  const p = PET_BY_ID[pet.typeId];
  if (!p) return null;
  const mood = moodOf(pet);
  // 心情差 → 建议更消极；心情好 → 更积极（宠物影响语气）
  if (mood === 'bored' || mood === 'hungry') return `${p.name}在旁边没精神，它觉得这条你大概率不会做。`;
  if (mood === 'ecstatic') return `${p.name}在边上蹦：就按这个来。`;
  return null;
}

function buildFingers(zone, ctx) {
  const fn = ZONES[zone] || fingersHome;
  let fingers = sortFingers(fn(ctx));
  const { coach, pet } = ctx;

  for (const f of fingers) {
    const opener = phrase(coach, f.severity === 'high' || f.severity === 'mid' ? 'open' : 'open', 0);
    const closer = f.action ? phrase(coach, 'close', 0) : '';
    f.coachNote = `${opener}${f.title}。${f.why}${closer ? ' ' + closer : ''}`;
    if (coach.style === 'science' && f.severity !== 'high') {
      f.coachNote = `${opener}${f.why}`;
    }
    f.petNote = petFlavor(f, pet);
    f.priority = SEV_RANK[f.severity] * 10 + Math.round(f.height * 10);
  }

  return {
    zone,
    coach,
    pet,
    summary: buildSummary(zone, coach, pet, ctx),
    fingers,
    primary: fingers[0] || null,
  };
}

function buildSummary(zone, coach, pet, ctx) {
  const p = pet ? PET_BY_ID[pet.typeId] : null;
  const mood = pet ? MOODS[moodOf(pet)] : null;
  const zoneLabel = { home: '首页', plan: '计划', train: '训练', pet: '宠物', coach: '教练', progress: '进展' }[zone] || '';
  const lead = {
    roast: `伸个五指山，${zoneLabel}这页有 5 个地方能改。`,
    science: `${zoneLabel}页可调变量清单如下，按影响排序。`,
    warm: `${zoneLabel}这页我们可以一点点来，先看最要紧的那个。`,
    drill: `报告：${zoneLabel}页存在 5 项可调整项，按优先级排列。`,
  }[coach.style] || '这页有 5 个地方能改。';
  return {
    lead,

/* ---------- 一键应用 ---------- */
function applyFingerAction(action, app) {
  if (!action) return { ok: false, msg: '这条是启发，不需要动手。' };
  const { kind, payload } = action;
  switch (kind) {
    case 'goto':
    case 'scroll_to':
      return { ok: true, nav: payload };
    case 'swap_item': {
      const plan = app.state.plan;
      if (!plan) return { ok: false, msg: '还没有计划。' };
      const si = payload.sessionIndex ?? 0;
      const cur = plan.sessions[si]?.items.find((i) => i.id === payload.itemId);
      if (!cur) return { ok: false, msg: '这个动作已经不在计划里了。' };
      let newId = payload.newId;
      // 预选失效（被删/本来就是它自己）时，现场重新找一个
      if (!newId || newId === payload.itemId) {
        const sug = suggestSwap(plan, si, payload.itemId, { injuries: plan.injuries, level: plan.level, equipment: plan.equipment });
        newId = sug?.ex?.id;
      }
      if (!newId || newId === payload.itemId) return { ok: false, msg: '这一项暂时没有更合适的替代动作，换个部位练也行。' };
      replaceItem(plan, si, payload.itemId, newId);
      app.save();
      return { ok: true, msg: `换成了「${getExercise(newId)?.name}」。`, refresh: true };
    }
    case 'swap_current': {
      const plan = app.state.plan;
      if (!plan) return { ok: false, msg: '还没有计划。' };
      app.sessionIndex = app.sessionIndex ?? 0;
      const si = app.sessionIndex ?? 0;
      const profile = { injuries: plan.injuries, level: plan.level, equipment: plan.equipment };
      const sug = suggestSwap(plan, si, payload.itemId, profile);
      if (!sug) return { ok: false, msg: '这一项找不到替代动作，要不要换个部位练？' };
      replaceItem(plan, si, payload.itemId, sug.ex.id);
      app.save();
      return { ok: true, msg: `换成了「${sug.ex.name}」。${sug.reason}`, refresh: true };
    }
    case 'set_days': {
      if (!app.profile) return { ok: false, msg: '先建个档案。' };
      app.profile.days = payload.days;
      app.regeneratePlan();
      return { ok: true, msg: `改成一周 ${payload.days} 练，计划重排了。`, refresh: true };
    }
    case 'start_session': {
      app.startSession(payload.index);
      return { ok: true, msg: '开始了。' };
    }
    default:
      if (typeof app[`action_${kind}`] === 'function') return app[`action_${kind}`](payload);
      return { ok: false, msg: '这个动作还没接通。' };
  }
}

/** 识别用户问题里的具体约束，让回答不像模板 */
function extractFacts(t) {
  const facts = {};
  const cn = { 一: 1, 两: 2, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10 };
  const NUM = '[0-9一二两三四五六七八九十]';
  const m1 = t.match(new RegExp(`(?:一周|每周|1周)\\s*(?:只能|只|能|大概|差不多)?\\s*(${NUM})\\s*(?:次|天)`));
  const m2 = t.match(new RegExp(`(${NUM})\\s*(?:次|天)\\s*(?:每周|一周)`));
  const m3 = t.match(new RegExp(`(?:只能|只能练|就练|练)\\s*(${NUM})\\s*(?:次|天)`));
  const raw = m1?.[1] || m2?.[1] || m3?.[1];
  if (raw) {
    const n = cn[raw] ?? Number(raw);
    if (n >= 1 && n <= 7) facts.days = n;
  }
  const kg = t.match(/([0-9]{2,3})\s*(?:kg|公斤|斤)/i);
  if (kg) facts.weight = Number(kg[1]);
  const dm = t.match(/([0-9]{2})\s*(?:分钟|min)/i);
  if (dm) facts.minutes = Number(dm[1]);
  return facts;
}

function chatReply(text, ctx) {
  const t = (text || '').trim();
  if (!t) return null;

  // 多轮指代优先：「那吃呢」「为什么」「还有别的吗」「它呢」
  const follow = resolveFollowUp(t, ctx);
  if (follow) {
    return {
      text: wrapCoach(follow.body, ctx.coach, follow.topic, true),
      suggestions: related(follow.topic),
      topic: follow.topic,
    };
  }

  const facts = extractFacts(t);
  const hits = [];
  for (const topic of CHAT_TOPICS) {
    let score = 0;
    for (const k of topic.k) {
      if (t.includes(k)) score += k.length >= 2 ? 2 : 1;
    }
    if (score > 0) hits.push({ key: topic.key, score });
  }
  hits.sort((a, b) => b.score - a.score);
  // 用户给了频率，就问的是排法，计划主题优先
  if (facts.days) {
    const planHit = hits.find((h) => h.key === 'plan');
    if (planHit) planHit.score += 3;
    else hits.unshift({ key: 'plan', score: 3 });
    hits.sort((a, b) => b.score - a.score);
  }
  // 用户报了单次时长，优先答时长
  if (facts.minutes) {
    for (const h of hits) if (h.key === 'duration') h.score += 4;
    if (!hits.some((h) => h.key === 'duration')) hits.unshift({ key: 'duration', score: 4 });
    hits.sort((a, b) => b.score - a.score);
  }

  const askCtx = { ...ctx, ask: facts };

  if (!hits.length) {
    return {
      text: composeFallback(t, askCtx),
      suggestions: ['一周练几次合适', '减脂怎么吃', '坚持不下来怎么办'],
      topic: null,
    };
  }

  // 有具体部位/主题时，优先答主题，而不是拿「怎么练」去抢计划话题
  const concrete = hits.filter((h) => !['plan', 'duration'].includes(h.key));
  if (concrete.length && !facts.days) {
    hits.sort((a, b) => {
      const sa = concrete.includes(a) ? a.score + 2 : a.score;
      const sb = concrete.includes(b) ? b.score + 2 : b.score;
      return sb - sa;
    });
  }

  const primary = hits[0].key;
  const secondary = hits[1]?.key;
  let body = CHAT_ANSWERS[primary](askCtx);
  let composed = false;
  if (secondary && secondary !== primary && hits[1].score >= 2 && !['identity', 'pet'].includes(secondary)) {
    body = `${body} 至于${topicLabel(secondary)}，${CHAT_ANSWERS[secondary](askCtx)}`;
    composed = true;
  }
  if (facts.days && primary !== 'plan') {
    body += ` 你说一周 ${facts.days} 次——那就按这个排，别硬加。`;
    composed = true;
  }

  return {
    text: wrapCoach(body, ctx.coach, primary, composed),
    suggestions: related(primary),
    topic: primary,
  };
}

/** 返回 {topic, body} 或 null；只处理明确指向上一轮的追问 */
function resolveFollowUp(t, ctx) {
  const last = ctx.lastTopic;
  if (!last) return null;

  if (/^(为什么|为啥|怎么说|理由)/.test(t)) {
    return { topic: last, body: WHY_TEXT[last] || '这一条的依据在五指山的「为什么」里，点开就能看到。' };
  }
  if (/(还有|换一?个|再来一?个|别的)/.test(t)) {
    return { topic: last, body: `那我们换个角度：${related(last).slice(0, 2).join('、')}。你想先聊哪个？` };
  }
  const isFollow = /^(那|这个|它|还有|换|再)/.test(t) || /(呢|吗)[？?]?$/.test(t);
  if (isFollow) {
    for (const [re, topic] of FOLLOW_TOPIC) {
      if (re.test(t)) {
        const answer = CHAT_ANSWERS[topic] ? CHAT_ANSWERS[topic]({ ...ctx, ask: {} }) : '';
        if (answer) return { topic, body: `顺着你刚才问的——${answer}` };
      }
    }
  }
  if (/^(这个|它|那这个)/.test(t) && CHAT_ANSWERS[last]) {
    return { topic: last, body: `还是「${topicLabel(last)}」这件事：${CHAT_ANSWERS[last]({ ...ctx, ask: {} })}` };
  }
  return null;
}

function topicLabel(key) {

}

function related(key) {
  const map = {

}

function wrapCoach(body, coach, key, composed = false) {
  const open = phrase(coach, 'open', 0);
  const close = phrase(coach, 'close', 0);
  switch (coach.style) {
    case 'roast':
      return `${open}${body}${key === 'motivation' ? ' 别问我「怎么坚持」，你先把鞋穿上。' : ''}${composed ? '' : ' ' + close}`;
    case 'science':
      return `${open}${body}`;
    case 'warm':
      return `${open}${body} 不着急，我们一步一步来。`;
    case 'drill':
      return `${open}${body} 就这些，执行。`;
    default:
      return body;
  }
}

/* 兜底：不鹦鹉学舌，而是把问题接住，再给一条可执行的小事 */
function composeFallback(text, ctx) {
  const coach = ctx.coach;
  const topic = text.replace(/[?？!！。]/g, '').slice(0, 20);
  const planLine = ctx.plan
    ? `你现在这份是一周 ${ctx.plan.days} 练的${ctx.plan.goalLabel}计划，先按它执行，别自己加戏。`
    : '你还没计划——这就是你现在最该解决的问题。';
  return {
    roast: `「${topic}」这个问题，我不给你背标准答案。${planLine} 先练两周，用你的数据来问我。`,

function scoreExercise(ex, ctx, { pattern, role }) {

  if (role === 'accessory' && !ex.compound) s += 0.9;

    s += (pw - 1) * 1.5;
    for (const like of pet.likes) if (ex.tags.includes(like)) s += 0.7;

function buildWarmup(ctx) {

        rest: isTime ? '60s' : '30s',

      if (!timed) break;

  for (const s of plan.sessions) {

/** 计划体检：找问题，供五指山「山·计划骨架」使用 */

  const issues = [];

    issues.push({ level: 'high', text: '灵活度目标却没有活动度课，方向错了。' });

    issues.push({ level: 'mid', text: '有一天动作超过 7 个，练到最后基本是靠意志力，删两个辅助动作。' });

}

/** 为某个动作找一个可替换项（自动替代网络 + 宠物方向微调） */
function suggestSwap(plan, sessionIndex, itemId, profile) {

  const list = findSubstitutes(itemId, {
    equipment: plan.equipment,
    injuries,
    level: level.cap,
    exclude: used,
    limit: 8,

    : '';

    ex: best.ex,
    samePattern: best.samePattern,
    reason: best.reason + extra,
    alternatives: ranked.slice(0, 5),
  };
}

function replaceItem(plan, sessionIndex, itemId, newExerciseId) {
  const session = plan.sessions[sessionIndex];
  const idx = session.items.findIndex((i) => i.id === itemId);
  if (idx < 0) return null;
  const ex = getExercise(newExerciseId);
  if (!ex) return null;
  const old = session.items[idx];
  session.items[idx] = {
    ...old,
    id: ex.id,
    name: ex.name,
    pattern: ex.pattern,
    muscles: ex.muscles,
    reps: ex.time ? old.reps.replace(/\d+.*/, GOALS[plan.goal].reps + ' 秒') : old.reps,
    cue: cueFor(ex),
    swapTo: ex.swap,
    swappedFrom: old.swappedFrom || old.name,
  };
  plan.version = (plan.version || 1) + 1;
  plan.stats = planStats(plan);
  return plan;
}
